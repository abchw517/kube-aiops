openapi: 3.1.0
info:
  title: kube-aiops Portal Backend API
  version: 2.3.0
  description: >-
    Portal Backend contract with provider-neutral identity, authorization, audit,
    sanitization, and bounded Phase 2 observability correlation. Correlation never exposes raw
    PromQL, LogsQL, upstream URLs, raw logs, raw Kubernetes objects, or mutation capabilities.
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: Health
  - name: Kubernetes
  - name: Findings
  - name: Correlation
  - name: Incidents
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness endpoint
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Backend readiness endpoint
      responses:
        '200':
          description: Backend is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Backend is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /api/v1/clusters:
    get:
      tags: [Kubernetes]
      operationId: listClusters
      summary: List configured clusters
      responses:
        '200':
          description: Cluster list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/clusters/{cluster}/namespaces:
    get:
      tags: [Kubernetes]
      operationId: listNamespaces
      summary: List namespaces for a cluster
      parameters:
        - $ref: '#/components/parameters/ClusterPath'
      responses:
        '200':
          description: Namespace list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/clusters/{cluster}/resources/{kind}/{namespace}/{name}:
    get:
      tags: [Kubernetes]
      operationId: getResource
      summary: Read a safe projection of a supported Kubernetes resource
      parameters:
        - $ref: '#/components/parameters/ClusterPath'
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [pod, pods, deployment, deployments]
        - name: namespace
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Resource projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/findings:
    get:
      tags: [Findings]
      operationId: listFindings
      summary: List normalized K8sGPT findings
      parameters:
        - $ref: '#/components/parameters/FindingCollectionClusterQuery'
        - $ref: '#/components/parameters/FindingEnvironmentQuery'
        - $ref: '#/components/parameters/FindingBusinessQuery'
        - $ref: '#/components/parameters/FindingGroupQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/SeverityQuery'
        - $ref: '#/components/parameters/ProblemQuery'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: continue
          in: query
          required: false
          description: Opaque keyset pagination cursor returned by the previous page.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: "Finding page. Empty results are represented as items: []."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/findings/summary:
    get:
      tags: [Findings]
      operationId: summarizeFindings
      summary: Summarize normalized K8sGPT findings
      parameters:
        - $ref: '#/components/parameters/FindingCollectionClusterQuery'
        - $ref: '#/components/parameters/FindingEnvironmentQuery'
        - $ref: '#/components/parameters/FindingBusinessQuery'
        - $ref: '#/components/parameters/FindingGroupQuery'
        - $ref: '#/components/parameters/NamespaceQuery'
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/SeverityQuery'
        - $ref: '#/components/parameters/ProblemQuery'
      responses:
        '200':
          description: Finding summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/findings/{id}:
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Read one normalized K8sGPT finding
      parameters:
        - $ref: '#/components/parameters/FindingIDPath'
        - $ref: '#/components/parameters/ClusterQuery'
      responses:
        '200':
          description: Finding detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/findings/{id}/correlation:
    get:
      tags: [Correlation]
      operationId: getFindingCorrelation
      summary: Read bounded sanitized observability evidence correlated to one resolved Finding
      description: >-
        Resolves the Finding first, derives its real cluster/namespace/resource scope, authorizes
        correlations:read on that scope, and executes only fixed backend-owned adapters. The client
        cannot supply PromQL, LogsQL, upstream URLs, arbitrary Kubernetes queries, or raw log requests.
      parameters:
        - $ref: '#/components/parameters/FindingIDPath'
        - $ref: '#/components/parameters/ClusterQuery'
      responses:
        '200':
          description: Safe correlation bundle. Individual disabled or unavailable sources are explicit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/diagnostics/overview:
    get:
      tags:
        - Incidents
      operationId: getIncidentOverview
      summary: Read authorized incident aggregates
      security:
        - PortalSession: []
      responses:
        '200':
          description: Read authorized incident aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
        - name: businessId
          in: query
          required: false
          schema:
            type: string
        - name: clusterId
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentSeverity'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
  /api/v1/diagnostics/incidents:
    get:
      tags:
        - Incidents
      operationId: listIncidents
      summary: List authorized incidents
      security:
        - PortalSession: []
      responses:
        '200':
          description: List authorized incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
        - name: businessId
          in: query
          required: false
          schema:
            type: string
        - name: clusterId
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          schema:
            type: string
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentSeverity'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: continue
          in: query
          required: false
          schema:
            type: string
    post:
      tags:
        - Incidents
      operationId: createIncident
      summary: Create a scoped incident
      security:
        - PortalSession: []
      responses:
        '201':
          description: Create a scoped incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentInput'
  /api/v1/diagnostics/incidents/{id}:
    get:
      tags:
        - Incidents
      operationId: getIncident
      summary: Read an authorized incident
      security:
        - PortalSession: []
      responses:
        '200':
          description: Read an authorized incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    patch:
      tags:
        - Incidents
      operationId: updateIncident
      summary: Update an incident with an expected version
      security:
        - PortalSession: []
      responses:
        '200':
          description: Update an incident with an expected version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentInput'
  /api/v1/diagnostics/incidents/{id}/timeline:
    get:
      tags:
        - Incidents
      operationId: listIncidentTimeline
      summary: Read incident timeline
      security:
        - PortalSession: []
      responses:
        '200':
          description: Read incident timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimelinePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: continue
          in: query
          required: false
          schema:
            type: string
  /api/v1/diagnostics/incidents/{id}/evidence:
    get:
      tags:
        - Incidents
      operationId: listIncidentEvidence
      summary: Read sanitized evidence summaries
      security:
        - PortalSession: []
      responses:
        '200':
          description: Read sanitized evidence summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvidencePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: continue
          in: query
          required: false
          schema:
            type: string
  /api/v1/diagnostics/incidents/{id}/evidence/{evidenceId}:
    get:
      tags:
        - Incidents
      operationId: getIncidentEvidence
      summary: Read one sanitized evidence snapshot
      security:
        - PortalSession: []
      responses:
        '200':
          description: Read one sanitized evidence snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvidenceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
  /api/v1/diagnostics/incidents/{id}/collect:
    post:
      tags:
        - Incidents
      operationId: collectIncidentEvidence
      summary: Collect scoped evidence using configured sources
      security:
        - PortalSession: []
      responses:
        '200':
          description: Collect scoped evidence using configured sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
  /api/v1/diagnostics/incidents/{id}/merge:
    post:
      tags:
        - Incidents
      operationId: mergeIncidents
      summary: Merge two eligible incidents
      security:
        - PortalSession: []
      responses:
        '200':
          description: Merge two eligible incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeIncidentInput'
  /api/v1/diagnostics/incidents/{id}/split:
    post:
      tags:
        - Incidents
      operationId: splitIncident
      summary: Move selected evidence into a child incident
      security:
        - PortalSession: []
      responses:
        '201':
          description: Move selected evidence into a child incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          headers:
            ETag:
              schema:
                type: string
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Stale version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitIncidentInput'
  /api/v1/diagnostics/incidents/{id}/rca-runs:
    get:
      tags:
        - Incidents
      operationId: listRcaRuns
      summary: 列出故障根因分析任务
      security:
        - PortalSession: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '200':
          description: 列出故障根因分析任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCATaskPage'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: continue
          in: query
          required: false
          schema:
            type: string
    post:
      tags:
        - Incidents
      operationId: startRcaRun
      summary: 启动故障根因分析
      security:
        - PortalSession: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '202':
