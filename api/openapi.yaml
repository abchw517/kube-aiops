components:
  securitySchemes:
    DiagnosticIngress:
      type: http
      scheme: bearer
    PortalSession:
      type: apiKey
      in: cookie
      name: __Host-kube-aiops-session
  parameters:
    ClusterPath:
      name: cluster
      in: path
      required: true
      schema:
        type: string
    FindingIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    ClusterQuery:
      name: cluster
      in: query
      required: false
      schema:
        type: string
        default: local
    FindingCollectionClusterQuery:
      name: cluster
      in: query
      required: false
      description: Cluster instance ID. Use '*' to query all authorized instances. Omission queries local.
      schema:
        type: string
        default: local
    FindingEnvironmentQuery:
      name: environment
      in: query
      required: false
      description: Select the exact environment label when cluster is '*'.
      schema:
        type: string
    FindingBusinessQuery:
      name: business
      in: query
      required: false
      description: Select the exact business label when cluster is '*'.
      schema:
        type: string
    FindingGroupQuery:
      name: group
      in: query
      required: false
      description: Select the exact cluster group label when cluster is '*'.
      schema:
        type: string
    NamespaceQuery:
      name: namespace
      in: query
      required: false
      schema:
        type: string
    KindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
    SeverityQuery:
      name: severity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Severity'
    ProblemQuery:
      name: problem
      in: query
      required: false
      description: Case-insensitive substring filter.
      schema:
        type: string
  headers:
    RequestID:
      description: Validated request identifier emitted by the Portal Backend.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationID:
      description: Validated correlation identifier for cross-component request tracing.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No valid authenticated identity is available for this API request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal is not authorized for the requested capability or scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested cluster, resource, or finding does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: A safe upstream or correlation service failure response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        The backend, authentication/authorization provider, or all configured correlation sources
        are temporarily unavailable, or a safe scan limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RCAInput:
      type: object
      required: []
      properties:
        observation:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
    RCAConclusion:
      type: object
      required:
        - state
        - judgment
        - references
        - gaps
        - next
      properties:
        state:
          type: string
        judgment:
          type: string
        references:
          type: array
          items:
            type: string
        gaps:
          type: string
        next:
          type: string
    RCARevision:
      type: object
      required:
        - version
        - actor
        - at
        - conclusion
      properties:
        version:
          type: integer
        actor:
          type: string
        at:
          type: string
          format: date-time
        conclusion:
          $ref: '#/components/schemas/RCAConclusion'
    RCATask:
      type: object
      required:
        - id
        - incidentId
        - state
        - evidence
        - actor
        - version
        - createdAt
        - revisions
      properties:
        id:
          type: string
        incidentId:
          type: string
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - timed_out
            - canceled
        observation:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvidence'
        actor:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RCARevision'
        policyId:
          type: string
        policyVersion:
          type: integer
    RCATaskPage:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RCATask'
        pagination:
          $ref: '#/components/schemas/IncidentPagination'
    TopologyNode:
      type: object
      required:
        - id
        - name
        - kind
        - scope
        - resourceId
        - platform
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        scope:
          $ref: '#/components/schemas/IncidentScope'
        resourceId:
          type: string
        incidentId:
          type: string
        state:
          type: string
        platform:
          type: string
    TopologyLink:
      type: object
      required:
        - source
        - target
        - relation
        - confidence
        - reason
        - actor
        - recordedAt
      properties:
        source:
          type: string
        target:
          type: string
        relation:
          type: string
        confidence:
          type: string
        reason:
          type: string
        actor:
          type: string
        recordedAt:
          type: string
          format: date-time
        evidenceId:
          type: string
    IncidentTopology:
      type: object
      required:
        - root
        - nodes
        - edges
        - coverage
        - truncated
      properties:
