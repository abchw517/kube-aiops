name: kube-aiops CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kube-aiops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBERNETES_VERSION: v1.36.4
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

jobs:
  preflight:
    name: Preflight / Lint / RBAC
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: false

      - name: Install validation tools
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --disable-pip-version-check --no-cache-dir \
            yamllint==1.35.1 \
            -r tools/openapi/requirements.txt

          archive="kubeconform-linux-amd64.tar.gz"
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "/tmp/${archive}" "${url}"
          printf '%s  %s\n' "${KUBECONFORM_SHA256}" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Bash syntax
        run: |
          set -Eeuo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          set -Eeuo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -x

      - name: YAML lint
        run: |
          set -Eeuo pipefail
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' \
            deploy api .github/workflows

      - name: Platform baseline consistency
        run: |
          set -Eeuo pipefail
          python3 tests/platform-baseline-test.py

      - name: API contract gate
        run: |
          set -Eeuo pipefail
          make api-contract-check

      - name: Go backend checks
        run: |
          set -Eeuo pipefail
          make api-fmt-check
          go vet ./...
          make api-test
          make api-build

      - name: Phase 1.3 Web checks
        run: |
          set -Eeuo pipefail
          make web-check

      - name: Docker backend smoke test
        run: |
          set -Eeuo pipefail
          image="kube-aiops-api:ci"
          container="kube-aiops-api-ci"

          docker build --pull --tag "${image}" .
          docker run --detach --name "${container}" --publish 127.0.0.1:18080:8080 "${image}"
          trap 'docker rm --force "${container}" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/healthz
          ready_code="$(curl --silent --output /tmp/readyz.json --write-out '%{http_code}' http://127.0.0.1:18080/readyz)"
          test "${ready_code}" = "503"

      - name: Docker web smoke test
        run: |
          set -Eeuo pipefail
          make web-docker-smoke

      - name: Phase 1.3 browser E2E
        run: |
          set -Eeuo pipefail
          make web-e2e

      - name: Run project preflight
        run: |
          bash ./preflight.sh
          bash ./tests/lifecycle-common-test.sh
          bash ./tests/verify-results-test.sh
          bash ./tests/observability-test.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks full repository scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  kind-e2e:
    name: Kubernetes v1.36 Kind E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - preflight
      - secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.36.4

      - name: Verify Kubernetes v1.36 platform baseline
        run: bash ./tests/kubernetes-v1.36-smoke.sh

      - name: Run lifecycle, rollback, concurrency and trusted uninstall E2E
        run: bash ./tests/e2e-kind.sh

      - name: Run Phase 1.2 readonly API E2E
        run: bash ./tests/e2e-api-kind.sh
