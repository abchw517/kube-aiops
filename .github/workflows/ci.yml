name: Phase 1.1 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-1-1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight / Lint / RBAC
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pyyaml==6.0.2 \
            yamllint==1.35.1

      - name: Bash syntax
        run: |
          set -Eeuo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          set -Eeuo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -x

      - name: YAML lint
        run: |
          set -Eeuo pipefail
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' \
            deploy .github/workflows

      - name: Run project preflight
        run: |
          bash ./preflight.sh
          bash ./tests/lifecycle-common-test.sh
          bash ./tests/verify-results-test.sh
          bash ./tests/observability-test.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks full repository scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  kind-e2e:
    name: Kubernetes v1.34 Kind E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - preflight
      - secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          install_only: true
          kubectl_version: v1.34.8

      - name: Run lifecycle, rollback, concurrency and trusted uninstall E2E
        env:
          KIND_NODE_IMAGE: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
        run: bash ./tests/e2e-kind.sh
