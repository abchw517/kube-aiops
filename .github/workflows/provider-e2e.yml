name: Phase 1.1 Provider Functional E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-1-provider-e2e
  cancel-in-progress: false

env:
  KUBERNETES_VERSION: v1.36.4
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

jobs:
  provider-e2e:
    name: Provider Result Functional E2E
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: phase-1.1-functional

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.36.4

      - name: Verify Kubernetes v1.36 platform baseline
        run: bash ./tests/kubernetes-v1.36-smoke.sh

      - name: Run Demo to fresh Result and AI details E2E
        env:
          OPENAI_TOKEN: ${{ secrets.OPENAI_E2E_TOKEN }}
        run: bash ./tests/e2e-provider-kind.sh
