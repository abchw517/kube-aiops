apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-aiops-web
  namespace: kube-aiops-system
spec:
  parentRefs:
    - name: production-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - kube-aiops.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-aiops-web
          port: 8080
