apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-aiops-api
  namespace: kube-aiops-system
  labels:
    app.kubernetes.io/name: kube-aiops-api
    app.kubernetes.io/part-of: kube-aiops
    app.kubernetes.io/component: portal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-aiops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-aiops-api
        app.kubernetes.io/part-of: kube-aiops
        app.kubernetes.io/component: portal-backend
    spec:
      serviceAccountName: kube-aiops-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kube-aiops-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: READY_TIMEOUT
              value: "3s"
            - name: K8SGPT_NAMESPACE
              value: k8sgpt-operator-system
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
