apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-aiops-api-ingress
  namespace: kube-aiops-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-aiops-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: production-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-aiops-web
      ports:
        - protocol: TCP
          port: 8080
