apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-aiops-api
  namespace: kube-aiops-system
spec:
  parentRefs:
    - name: production-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - kube-aiops.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/admin/finding-analysis
      timeouts:
        request: 195s
        backendRequest: 190s
      backendRefs:
        - name: kube-aiops-api
          port: 8080
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /api/v1/diagnostics/health
      timeouts:
        request: 55s
        backendRequest: 50s
      backendRefs:
        - name: kube-aiops-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: kube-aiops-api
          port: 8080
