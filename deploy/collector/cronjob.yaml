apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-aiops-collector
  namespace: k8sgpt-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-aiops-collector
  namespace: k8sgpt-operator-system
rules:
  - apiGroups: [core.k8sgpt.ai]
    resources: [results]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-aiops-collector
  namespace: k8sgpt-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-aiops-collector
subjects:
  - kind: ServiceAccount
    name: kube-aiops-collector
    namespace: k8sgpt-operator-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kube-aiops-collector
  namespace: k8sgpt-operator-system
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 45
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 45
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: kube-aiops-collector
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: kube-aiops-api:dev
              args: [cluster-report]
              env:
                - name: CLUSTER_REPORT_URL
                  value: https://kube-aiops.example.com
                - name: CLUSTER_REPORT_ID
                  value: dev-yunfan-01
                - name: CLUSTER_REPORT_TOKEN_FILE
                  value: /var/run/collector/token
                - name: K8SGPT_NAMESPACE
                  value: k8sgpt-operator-system
                - name: K8SGPT_NAME
                  value: k8sgpt-engine
              volumeMounts:
                - name: enrollment
                  mountPath: /var/run/collector
                  readOnly: true
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: enrollment
              secret:
                secretName: kube-aiops-collector
