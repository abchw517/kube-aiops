# K8sGPT Operator production baseline
# dynamicRBAC=false 时，Helm 会创建静态 k8sgpt ServiceAccount/ClusterRole/Binding。
# post-renderer 会在提交 API Server 前收敛身份和权限，安装后 SSA 再复验 Git 基线。

dynamicRBAC:
  enabled: false

serviceMonitor:
  enabled: false

grafanaDashboard:
  enabled: false

controllerManager:
  kubeRbacProxy:
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.19.1@sha256:9f21034731c7c3228611b9d40807f3230ce8ed2b286b913bf2d1e760d8d866fc
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

  manager:
    image:
      repository: ghcr.io/k8sgpt-ai/k8sgpt-operator
      tag: v0.2.29@sha256:82d0adcce816182bbfbef9f1d535db93ab0901f08d45a3a9e572c6e795c5bfa8
    enableResultLogging: false
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
