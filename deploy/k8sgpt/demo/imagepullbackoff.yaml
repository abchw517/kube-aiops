apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-demo
  namespace: k8sgpt-demo
  labels:
    app: imagepull-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-demo
  template:
    metadata:
      labels:
        app: imagepull-demo
    spec:
      containers:
        - name: demo
          image: registry.invalid.example/k8sgpt/demo:not-exist
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
