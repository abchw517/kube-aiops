apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-engine
  namespace: k8sgpt-operator-system
  labels:
    app.kubernetes.io/name: k8sgpt
    app.kubernetes.io/component: analyzer
    app.kubernetes.io/part-of: kube-aiops
    app.kubernetes.io/instance: k8sgpt-operator
spec:
  ai:
    enabled: true
    backend: openai
    model: gpt-4o-mini
    anonymized: true
    language: english
    secret:
      name: k8sgpt-openai-secret
      key: openai-api-key

  analysis:
    interval: "5m"

  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  # v0.4.37 is the newest semantic release whose immutable GHCR digest is
  # independently verified for this baseline. Do not replace with a mutable tag.
  version: v0.4.37@sha256:ebf0d1f5a8463190abdf1a9c84282cfbd9ce611e3dc1c490194b7aaf2676d088

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - Service
    - StatefulSet
    - Job
    - CronJob
    - PersistentVolumeClaim
    - Node
    - Ingress
    - HorizontalPodAutoscaler

  # Phase 1.1 不启用 Log Analyzer，避免应用日志直接进入 LLM。
  # Phase 1.1 不启用自动修复 / Mutation。
