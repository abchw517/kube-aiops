apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # 与 K8sGPT Operator dynamicRBAC=false 时 Helm 创建的静态 ClusterRole 同名。
  # 本文件用于覆盖官方默认权限，移除 secrets 与 pods/log 等 Phase 1.1 不需要的能力。
  name: k8sgpt-clusterrole
  labels:
    app.kubernetes.io/part-of: kube-aiops
    app.kubernetes.io/component: k8sgpt
    app.kubernetes.io/instance: k8sgpt-operator
  annotations:
    kube-aiops.io/owner: phase-1.1
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - nodes
      - namespaces
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

# Phase 1.1 明确不授予：
# - secrets
# - pods/log
# - 未启用 Analyzer 的 daemonsets/networkpolicies/webhook/PDB/Gateway API
# - create/update/patch/delete/deletecollection
