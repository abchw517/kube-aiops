<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kube-aiops · 诊断总览重构</title>
<style>
:root{--nav:#142438;--bg:#edf2f7;--white:#fff;--ink:#17283d;--muted:#526780;--line:#d9e3ee;--blue:#0765be;--soft:#eaf4ff;--critical:#ae2142;--warning:#895716;--info:#126b63;--finding:#117d75;--incident:#2b72be}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.56 Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}h1,h2,h3,p,ul,dl,dd{margin:0}button,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}small,.muted{color:var(--muted)}strong,.num, time{font-variant-numeric:tabular-nums}
.top{height:58px;background:var(--nav);color:white;display:flex;align-items:center;gap:18px;padding:0 20px}.brand{color:white;display:inline-flex;min-width:170px;align-items:center;gap:10px;font-size:16px;font-weight:750}.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#164d79;border:1px solid #6ab0e6}.top-module{display:flex;align-items:center;align-self:stretch;background:#253951;border-bottom:2px solid #78b8f1;padding:0 16px;font-weight:650}.demo{margin-left:auto;font-size:12px;color:#d1e1f3}.layout{display:grid;grid-template-columns:204px minmax(0,1fr);min-height:calc(100vh - 58px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 0}aside h2{font-size:16px;margin:0 16px 15px}aside a{display:block;color:var(--ink);padding:9px 14px 9px 18px;border-inline-start:3px solid transparent}aside a[aria-current]{background:#e2f0fe;color:#0059ac;border-inline-start-color:#0870ca;font-weight:700}
main{padding:20px 24px 38px;min-width:0;width:100%;max-width:1690px;margin:0}.screen{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.crumb{font-size:12px;color:var(--muted);margin-bottom:3px}h1{font-size:29px;font-weight:760;letter-spacing:-.02em}h2{font-size:17px;font-weight:730}h3{font-size:14px;font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:9px;min-width:0}.pad{padding:17px 19px}.head{display:flex;align-items:start;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}.head p{margin-top:2px;font-size:12px}.toolbar{display:flex;align-items:end;gap:9px 14px;flex-wrap:wrap}.toolbar label{display:grid;gap:4px;width:min(100%,224px);font-size:12px;font-weight:700;color:var(--muted)}.toolbar label+label{width:min(100%,166px)}.toolbar select,.btn,.segment a{min-height:34px;border:1px solid #acbfd5;border-radius:5px;background:#fff;padding:6px 9px;color:var(--ink);font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:660}.btn:hover,.segment a:hover{background:var(--soft);text-decoration:none}.primary{border-color:#0766bc;color:#fff;background:#0766bc}.primary:hover{background:#05559e}.reset{display:inline-flex;align-items:center;min-height:34px;font-size:13px}.scope{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:9px;font-size:12px;color:var(--muted)}.scope strong{color:var(--ink)}.note{padding:11px 15px;background:#fff7e8;border:1px solid #e7c58f;border-radius:7px;color:#70440a;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{--tone:var(--blue);display:grid;align-content:center;gap:2px;color:var(--ink);padding:12px 16px 11px;border-top:3px solid var(--tone);min-height:76px;text-decoration:none}.metric:hover{background:#f4f9ff;text-decoration:none}.metric[aria-current]{background:#edf6ff;box-shadow:inset 0 0 0 1px #8ab9e7}.metric-label{font-size:13px;color:var(--muted)}.metric strong{color:var(--tone);font-size:29px;line-height:1.13}.critical{--tone:var(--critical);--wash:#fce9ee}.warning{--tone:var(--warning);--wash:#fff0d7}.info{--tone:var(--info);--wash:#e2f4ef}.badge{background:var(--wash,#e8eff7);color:var(--tone,#3a526b);border-radius:4px;padding:2px 7px;font-weight:670;font-size:12px;white-space:nowrap;display:inline-block}
.records{overflow:hidden}.records .head{padding:15px 18px 12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.table-zone{overflow-x:auto}table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:745px;font-size:13px}th,td{text-align:left;vertical-align:middle;padding:10px 12px;border-bottom:1px solid #e5ecf3}th{background:#f5f8fc;color:var(--muted);font-size:12px;font-weight:680;border-top:1px solid #e5ecf3}td:first-child,th:first-child{width:42%;padding-left:18px}th:nth-child(2){width:9%}th:nth-child(3){width:11%}th:nth-child(4){width:12%}th:nth-child(5){width:10%}th:nth-child(6){width:16%}td:first-child a{font-weight:620;overflow-wrap:anywhere}td{overflow-wrap:anywhere}td:last-child{white-space:normal}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}.relative{display:block;font-size:11px;color:var(--muted);margin-top:2px}.record-cards{display:none}.empty{padding:20px 14px;text-align:center;color:var(--muted)}.empty p{margin-top:3px}.empty .reset{margin-top:4px}.empty strong{color:var(--ink)}.analytics{display:grid;grid-template-columns:minmax(0,2fr) minmax(234px,1fr);gap:14px;align-items:start}.segment{display:flex;gap:2px;padding:2px;background:#eef3f9;border-radius:6px}.segment a{border-color:transparent;min-height:26px;padding:3px 7px;font-size:12px}.segment a[aria-current]{background:white;color:#0058a8;border-color:var(--line);font-weight:730}.chart-empty{background:#f4f8fc;border:1px dashed #c6d7e9;border-radius:7px;padding:12px 13px;margin-top:12px}.chart-empty .reset{min-height:24px;margin-top:2px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}.legend small::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--incident);margin-right:5px}.legend small+small::before{background:var(--finding)}.plot{display:grid;grid-template-columns:repeat(var(--days),minmax(0,1fr));gap:2px;margin-top:10px}.day{min-width:0;position:relative;display:grid;grid-template-rows:68px 16px;gap:3px;padding:0;border:0;background:none;color:var(--muted);font-size:10px}.day:hover,.day[aria-pressed=true]{background:#eef5fc}.pile{display:flex;align-items:center;flex-direction:column-reverse;border-bottom:1px solid var(--line)}.pile span{display:block;min-width:4px;width:min(65%,23px);background:var(--incident)}.pile span+span{background:var(--finding)}.plot-note{margin-top:8px;color:var(--muted);font-size:12px;min-height:18px}.bars{display:grid;gap:10px;list-style:none;padding:0;margin-top:13px}.bars li{display:grid;grid-template-columns:32px minmax(0,1fr) 24px;gap:9px;align-items:center;font-size:13px}.track{height:8px;background:#edf2f8;border-radius:4px;overflow:hidden}.track i{display:block;height:100%;background:var(--tone);border-radius:4px}.bars strong{text-align:right;color:var(--tone)}.detail{display:grid;gap:9px}.detail dl{display:grid;grid-template-columns:90px 1fr;gap:4px}.crumb a{color:var(--blue)}
@media (max-width:1050px){main{padding-inline:16px}.layout{grid-template-columns:164px minmax(0,1fr)}.analytics{grid-template-columns:minmax(0,1.6fr) minmax(210px,1fr)}}
@media (max-width:850px){.layout{grid-template-columns:minmax(0,1fr)}aside{display:flex;gap:2px;padding:0 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}aside h2{display:none}aside a{white-space:nowrap;border:0;border-bottom:2px solid transparent;padding:8px 10px}aside a[aria-current]{border-bottom-color:var(--blue)}.table-zone{display:none}.record-cards{display:grid;list-style:none;padding:0;margin:0}.record-cards li{padding:10px 15px;border-top:1px solid #e5ecf3}.record-cards li>a{font-weight:670;display:block;overflow-wrap:anywhere}.card-line{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--muted)}}
@media (max-width:580px){main{padding:12px 10px 24px}.top{height:48px;padding:0 10px;gap:8px}.brand{min-width:0;font-size:14px}.top-module{padding:0 8px;font-size:13px}.demo{font-size:11px}.pad{padding:13px}.screen{gap:11px}h1{font-size:25px}.toolbar{gap:7px 8px}.toolbar label:first-child,.toolbar label+label{width:auto;min-width:0;flex:1 1 44%}.toolbar select{min-width:0;width:100%}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric{min-height:63px;padding:7px 12px}.metric strong{font-size:23px}.analytics{grid-template-columns:minmax(0,1fr);gap:10px}.records .head{padding:12px}.actions .btn{min-height:29px}.plot{gap:0}.day{font-size:9px}}
</style>
</head>
<body>
<header class="top"><a href="#/diagnostics" class="brand"><span class="mark">K</span>kube-aiops</a><a href="#/diagnostics" class="top-module" style="color:white">诊断控制台</a><span class="demo">原型 · 示例数据</span></header>
<div class="layout"><aside aria-label="诊断栏目"><h2>诊断控制台</h2><a data-page="overview" href="#/diagnostics">诊断总览</a><a data-page="incident" href="#/diagnostics/events">故障事件</a><a data-page="finding" href="#/findings">原有诊断结果</a></aside><main id="content"></main></div>
<script>
"use strict";
const base="/diagnostics", events=base+"/events", findings="/findings";
const levels={critical:"严重",warning:"警告",info:"信息"};
const scopeNames={dev:"dev-k8s · dev",test:"test-k8s · test"};
const dates={end:"2026-11-24",ms:86400000};
const labels={investigating:"处理中",pending:"待确认",recovered:"已恢复"};
const records=[
 {id:"dev-pvc",type:"finding",cluster:"dev",level:"warning",title:'StorageClass "k8sgpt-non-existent-storageclass" 未找到',source:"K8sGPT",at:"2026-11-16T10:07:21Z"},
 {id:"dev-deploy",type:"finding",cluster:"dev",level:"warning",title:"Deployment crashloop-demo 需要 1 个副本，当前 0 个可用",source:"K8sGPT",at:"2026-11-16T10:01:35Z"},
 {id:"dev-pod",type:"finding",cluster:"dev",level:"warning",title:"Pod 镜像拉取失败，处于 ImagePullBackOff",source:"K8sGPT",at:"2026-11-16T10:01:35Z"},
 {id:"test-p1",type:"incident",cluster:"test",level:"critical",title:"订单接口 5xx 超过告警阈值",source:"Alertmanager",status:"investigating",at:"2026-11-24T04:16:00Z"},
 {id:"test-k8s",type:"finding",cluster:"test",level:"warning",title:"订单服务 Pod 就绪探针连续失败",source:"K8sGPT",at:"2026-11-24T03:30:00Z"},
 {id:"test-p2",type:"incident",cluster:"test",level:"warning",title:"测试实例节点磁盘压力",source:"Kubernetes 事件",status:"recovered",at:"2026-11-22T03:05:00Z"},
 {id:"test-info",type:"finding",cluster:"test",level:"info",title:"日志采集组件未设置资源请求",source:"K8sGPT",at:"2026-11-20T09:40:00Z"}
];
const main=document.querySelector("main");
const e=(value="")=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const fmt=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",dateStyle:"short",timeStyle:"medium",hourCycle:"h23"});
const href=(path,q)=>"#"+path+(q.size?"?"+q:"");
function read(){
 const [path="",raw=""]=location.hash.slice(1).split("?");
 return {path:path||base,q:new URLSearchParams(raw)};
}
function update(q,updates){
 const next=new URLSearchParams(q);
 for(const [key,value] of Object.entries(updates)){if(value)next.set(key,value);else next.delete(key);}
 return next;
}
function selection(q){
 const cluster=q.has("clusterId")?q.get("clusterId"):"dev";
 return {cluster:cluster==="*"?"":cluster,level:Object.hasOwn(levels,q.get("severity"))?q.get("severity"):"",days:[7,14,30].includes(Number(q.get("trendDays")))?Number(q.get("trendDays")):7,demo:q.get("demo")};
}
function getRows(q){
 const {cluster,level,demo}=selection(q);
 return records.filter(r=>(!cluster||r.cluster===cluster)&&(!level||r.level===level)&&
 (demo!=="partial"||r.type==="finding")&&demo!=="failed")
 .sort((a,b)=>b.at.localeCompare(a.at)||a.id.localeCompare(b.id));
}
function clearQuery(q){return update(q,{clusterId:"*",severity:""});}
function option(value,label,selected){return '<option value="'+e(value)+'"'+(value===selected?' selected':'')+'>'+e(label)+'</option>';}
function header(title,parent){
 return '<header><p class="crumb">'+(parent?'<a href="'+e(parent)+'">诊断总览</a>':'诊断控制台')+' › '+e(title)+'</p><h1>'+e(title)+'</h1></header>';
}
function filters(q){
 const {cluster,level}=selection(q);
 return '<section class="panel pad"><form class="toolbar" id="filters">'+
 '<label>集群实例<select name="clusterId">'+option("*","全部可见实例",cluster||"*")+Object.entries(scopeNames).map(([k,v])=>option(k,v,cluster)).join("")+'</select></label>'+
 '<label>诊断级别<select name="severity">'+option("","全部级别",level)+Object.entries(levels).map(([k,v])=>option(k,v,level)).join("")+'</select></label>'+
 '<button type="submit" class="btn primary">应用筛选</button><a class="reset" href="'+e(href(base,clearQuery(q)))+'">清除筛选</a></form>'+
 '<p class="scope">当前范围 <strong>'+e(scopeNames[cluster]||(cluster||"全部可见实例"))+' · '+(levels[level]||"全部级别")+'</strong><span>故障事件与 K8sGPT</span></p></section>';
}
function metrics(rows,q,failed){
 const chosen=selection(q).level;
 const facets=[["","诊断记录总数",rows.length],...Object.entries(levels).map(([k,v])=>[k,v,rows.filter(r=>r.level===k).length])];
 return '<div class="metrics" aria-label="统一诊断指标">'+facets.map(([key,label,n])=>
  '<a class="panel metric '+key+'" href="'+e(href(base,update(q,{severity:key})))+'"'+(key===chosen?' aria-current="true"':'')+
  '><span class="metric-label">'+label+'</span><strong>'+ (failed?'—':n) +'</strong></a>').join("")+'</div>';
}
function detailHref(row,q){
 const target=row.type==="finding"?findings:events;
 return href(target+"/"+encodeURIComponent(row.id),update(q,{from:"overview"}));
}
function badge(row){return '<span class="badge '+row.level+'">'+levels[row.level]+'</span>';}
function rowViews(rows,q){
 if(!rows.length)return '<div class="empty"><strong>当前范围暂无诊断记录</strong><br><a class="reset" href="'+e(href(base,clearQuery(q)))+'">清除筛选</a></div>';
 const table='<div class="table-zone"><table aria-label="诊断记录"><thead><tr>'+["问题","级别","处置状态","来源","实例","首次发现"].map(x=>'<th scope="col">'+x+'</th>').join("")+
 '</tr></thead><tbody>'+rows.map(r=>'<tr><td><a href="'+e(detailHref(r,q))+'">'+e(r.title)+'</a></td><td>'+badge(r)+'</td><td>'+e(labels[r.status]||"—")+
 '</td><td>'+e(r.source)+'</td><td>'+e(r.cluster)+'</td><td><time datetime="'+r.at+'">'+e(fmt.format(new Date(r.at)))+'</time></td></tr>').join("")+'</tbody></table></div>';
 const cards='<ul class="record-cards">'+rows.map(r=>'<li><a href="'+e(detailHref(r,q))+'">'+e(r.title)+'</a><div class="card-line">'+badge(r)+'<span>'+e(r.source)+
 '</span><span>'+e(r.cluster)+'</span><span>'+e(labels[r.status]||"")+'</span><time datetime="'+r.at+'">'+e(fmt.format(new Date(r.at)))+'</time></div></li>').join("")+'</ul>';
 return table+cards;
}
function recordPanel(rows,q,overview){
 return '<section class="panel records" aria-label="'+(overview?"最近诊断":"诊断记录")+'"><header class="head"><div><h2>'+
 (overview?"最近诊断":"诊断记录")+'</h2><p class="muted">'+(overview?"按首次发现时间倒序，最多 5 条":"当前范围共 "+rows.length+" 条")+
 ' · UTC+8</p></div>'+(overview?'<div class="actions"><a class="btn" href="'+e(href(events,q))+'">查看故障事件</a><a class="btn" href="'+e(href(findings,q))+'">查看原有诊断结果</a></div>':"")+
 '</header>'+rowViews(overview?rows.slice(0,5):rows,q)+'</section>';
}
function daysOf(rows,count){
 const last=Date.parse(dates.end);
 return Array.from({length:count},(_,index)=>{
  const day=new Date(last-(count-index-1)*dates.ms).toISOString().slice(0,10);
  const matches=rows.filter(row=>row.at.startsWith(day));
  return {day,incident:matches.filter(r=>r.type==="incident").length,finding:matches.filter(r=>r.type==="finding").length};
 });
}
function trend(rows,q){
 const scope=selection(q), days=daysOf(rows,scope.days), total=days.reduce((n,d)=>n+d.incident+d.finding,0);
 const maximum=Math.max(1,...days.map(d=>d.incident+d.finding));
 const toggles='<div class="segment" aria-label="趋势时间窗">'+[7,14,30].map(n=>'<a href="'+e(href(base,update(q,{trendDays:String(n)})))+'"'+(n===scope.days?' aria-current="true"':'')+'>'+n+' 天</a>').join("")+'</div>';
 let content;
 if(!total){
  content='<div class="chart-empty"><strong>'+(scope.demo==="partial"?"数据覆盖不完整":("近 "+scope.days+" 天无新增"))+'</strong>'+
   '<p class="muted">'+(scope.demo==="partial"?"当前窗口未取得诊断记录。":(rows.length?"当前范围的 "+rows.length+" 条诊断均在此时间窗之前。":"当前筛选没有匹配的诊断记录。"))+'</p>'+
   (scope.days===7&&rows.length?'<a class="reset" href="'+e(href(base,update(q,{trendDays:"14"})))+'">查看近 14 天</a>':"")+'</div>';
 }else{
  content='<div class="plot" style="--days:'+scope.days+'">'+days.map((d,index)=>{
   const n=d.incident+d.finding, label=d.day+"（UTC）共 "+n+" 条，故障 "+d.incident+" 条，K8sGPT "+d.finding+" 条";
   const show=scope.days===7||index===0||index===scope.days-1||index%(scope.days===14?4:7)===0;
   return '<button type="button" class="day" data-count="'+n+'" data-plot="'+e(label)+'" aria-pressed="false" aria-label="'+e(label)+'" title="'+e(label)+'">'+
    '<span class="pile" aria-hidden="true"><span style="height:'+d.incident/maximum*100+'%"></span><span style="height:'+d.finding/maximum*100+'%"></span></span>'+
    '<span aria-hidden="true">'+(show?d.day.slice(5):"")+'</span></button>';
  }).join("")+'</div><div class="legend"><small>故障事件</small><small>K8sGPT</small></div><p class="plot-note" role="status" id="plot-note">'+(scope.demo==="partial"?"已获取 ":"窗口内 ")+total+' 条</p>';
 }
 return '<section class="panel pad" aria-label="诊断趋势"><header class="head"><div><h2>诊断趋势</h2><p class="muted">'+days[0].day+' 至 '+days.at(-1).day+'（UTC）</p></div>'+toggles+'</header>'+content+'</section>';
}
function distribution(rows,q){
 const partial=selection(q).demo==="partial";
 return '<section class="panel pad"><header class="head"><div><h2>严重度分布</h2><p class="muted">'+(partial?"已获取记录":"当前范围")+' · '+rows.length+' 条</p></div></header>'+
 '<ul class="bars">'+Object.entries(levels).map(([level,label])=>{
  const n=rows.filter(r=>r.level===level).length;
  return '<li class="'+level+'"><span>'+label+'</span><span class="track" aria-hidden="true"><i style="width:'+(rows.length?n/rows.length*100:0)+'%"></i></span><strong>'+n+'</strong></li>';
 }).join("")+'</ul></section>';
}
function overview(q){
 const rows=getRows(q), {demo}=selection(q);
 const warning=demo==="partial"?"故障事件暂不可用。指标、分布和最近诊断仅展示已取得的 K8sGPT 记录。":
  demo==="failed"?"诊断数据暂不可用。当前筛选已保留。":"";
 const note=warning?'<p class="note" role="status"><span>'+warning+'</span><a class="btn" href="'+e(href(base,update(q,{demo:""})))+'">重试</a></p>':"";
 return header("诊断总览")+filters(q)+note+metrics(rows,q,demo==="failed")+
 (demo==="failed"?'<section class="panel empty"><strong>最近诊断与图表暂不可用</strong></section>':
 recordPanel(rows,q,true)+'<div class="analytics">'+trend(rows,q)+distribution(rows,q)+'</div>');
}
function render(){
 const {path,q}=read(),isFinding=path.startsWith(findings),isIncident=path.startsWith(events);
 const target=path.split("/").length>(isFinding?2:3)?path.split("/").at(-1):"";
 const mode=isFinding?"finding":isIncident?"incident":"overview";
 const view=update(q,{from:""});
 for(const link of document.querySelectorAll("aside a")){
  const key=link.dataset.page;
  if(key===mode)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current");
  link.href=href(key==="overview"?base:key==="incident"?events:findings,view);
 }
 let body;
 if(mode==="overview")body=overview(q);
 else if(!target)body=header(isFinding?"原有诊断结果":"故障事件",href(base,view))+recordPanel(getRows(q).filter(r=>r.type===mode),q,false);
 else{
  const row=records.find(r=>r.id===target&&r.type===mode);
  body=header(isFinding?"诊断详情":"故障详情",href(base,view))+
  '<div><a class="btn" href="'+e(href(base,view))+'">返回诊断总览</a></div>'+
  (row?'<section class="panel pad detail"><h2>'+e(row.title)+'</h2><p>'+badge(row)+'</p><dl><dt>来源</dt><dd>'+e(row.source)+
   '</dd><dt>集群实例</dt><dd>'+e(row.cluster)+'</dd><dt>首次发现</dt><dd>'+e(fmt.format(new Date(row.at)))+'</dd><dt>处置状态</dt><dd>'+e(labels[row.status]||"—")+'</dd></dl></section>':
  '<section class="panel empty">此记录不可用。</section>');
 }
 main.innerHTML='<div class="screen">'+body+'</div>';
}
document.addEventListener("submit",event=>{
 if(event.target.id!=="filters")return;
 event.preventDefault();
 const payload=new FormData(event.target);
 location.hash=href(base,update(read().q,{clusterId:payload.get("clusterId"),severity:payload.get("severity")}));
});
document.addEventListener("click",event=>{
 const point=event.target.closest("[data-plot]");
 if(!point)return;
 main.querySelector('[data-plot][aria-pressed="true"]')?.setAttribute("aria-pressed","false");
 point.setAttribute("aria-pressed","true");
 document.getElementById("plot-note").textContent=point.dataset.plot;
});
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
