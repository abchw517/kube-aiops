<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据源管理 · kube-aiops</title>
<style>
:root{font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#172941;background:#f2f5fa;--ink:#172941;--muted:#4e627b;--line:#dbe4ee;--blue:#1459c3;--blue-dark:#124b9f;--paper:#fff;--soft:#f7f9fc}
*{box-sizing:border-box}
body,p,h1,h2,h3,h4,dl,dd{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #79aef8;outline-offset:2px}
a{color:var(--blue-dark)}
.top{height:61px;display:flex;align-items:center;gap:32px;padding:0 22px;background:#14263b;color:#e5edf8;border-bottom:1px solid #243952}
.logo{font-weight:770;display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo-icon{border:1px solid #5d87b2;border-radius:7px;width:28px;height:28px;display:grid;place-items:center;background:#18456f}
.top-links{display:flex;gap:25px;align-items:center;font-size:13px}
.top-links strong{color:#fff;align-self:stretch;padding:19px 0 16px;border-bottom:3px solid #86b7fe}
.shell{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100vh - 61px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 12px;color:#3a5069}
.sidebar h2{font-size:16px;padding:0 8px}
.sidebar p{font-size:12px;margin:22px 8px 6px;color:var(--muted)}
.sidebar span,.sidebar strong{display:block;padding:8px;border-radius:7px}
.sidebar strong{background:#eaf2ff;color:#164d9c}
main{width:100%;max-width:1510px;margin:auto;padding:23px 28px 36px;align-self:start}
.crumb,.muted,.hint{color:var(--muted)}
.crumb,.hint{font-size:13px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:4px 0 18px}
.page-head h1{font-size:28px;line-height:1.25;letter-spacing:-.015em;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 12px;border:1px solid #bdcce0;border-radius:7px;background:white;color:#25405f;font-weight:650;white-space:nowrap}
.btn:hover:not(:disabled){background:#eff5fc}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.primary:hover:not(:disabled){background:#0f4daa}
.btn.weak{background:transparent;border-color:transparent;color:var(--blue-dark)}
.btn.small{min-height:31px;font-size:12px;padding:4px 8px}
.icon-button{width:36px;height:36px;flex:none;border:0;border-radius:6px;background:transparent;color:#415976;font-size:23px;line-height:1}
.icon-button:hover{background:#edf3fa}
.workspace{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 6px #132b4809}
.tabbar{display:flex;padding:0 17px;gap:22px;border-bottom:1px solid var(--line)}
.tabbar button{background:none;border:0;border-bottom:3px solid transparent;color:#455b76;padding:12px 4px 10px;font-weight:650}
.tabbar button[aria-selected=true]{color:var(--blue-dark);border-bottom-color:var(--blue)}
.workspace-body{padding:16px 17px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:#405771}
.stat b{font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat[data-filter=issue] b{color:#a53a1d}
.stat[aria-pressed=true]{background:#edf5ff;border-color:#a4c4f1}
.stat:disabled{opacity:1}
.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:15px 0 7px}
.control{display:grid;gap:3px;min-width:110px}
.control span,.field>label{font-weight:650;color:#2c435f;font-size:13px}
.control input,.control select,.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-width:0;min-height:36px;border:1px solid #bdcce0;border-radius:7px;background:#fff;color:var(--ink);padding:6px 9px}
.control.search{min-width:185px;flex:1;max-width:340px}
.control input:disabled,.field input[readonly],.field select:disabled{background:#f0f4f8;color:#516680}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 7px;color:var(--muted);font-size:13px;min-height:31px}
.group-label{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
input[type=checkbox]{accent-color:var(--blue)}
.table-wrap{border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}
th{background:#f2f6fb;color:#3b5270;font-size:12px;padding:8px 10px;font-weight:690}
td{border-top:1px solid #e4ebf3;padding:9px 10px;vertical-align:middle;overflow-wrap:anywhere}
th:first-child{border-radius:7px 0 0 0;width:28%}
th:nth-child(2){width:19%}
th:nth-child(3){width:16%}
th:nth-child(4){width:19%}
th:last-child{border-radius:0 7px 0 0;width:18%;text-align:right}
tbody tr:not(.group-row):hover{background:#fafcff}
.cell-name{display:flex;align-items:center;gap:9px;min-width:0}
.provider-icon{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-weight:770;font-size:12px;flex:none}
.source-link{background:transparent;border:0;padding:0;color:#154d9d;display:block;text-align:left;word-break:break-word;font-weight:720}
.source-link:hover{text-decoration:underline}
.cell-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.state{display:inline-block;font-size:12px;font-weight:660;padding:2px 7px;border-radius:5px;line-height:1.45}
.state.good,.signal.good{background:#e5f5ed;color:#155c46}
.state.issue,.signal.issue{background:#fff0e9;color:#973820}
.state.pending,.signal.pending{background:#fff5d9;color:#785009}
.state.ready,.signal.ready{background:#eaf1fc;color:#214d86}
.state.paused,.signal.paused{background:#edf1f6;color:#52637a}
.time{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:3px;flex-wrap:wrap}
.menu{position:relative}
.menu>summary{list-style:none;display:grid;place-items:center;cursor:pointer;border:1px solid transparent;border-radius:6px;width:30px;height:31px;color:#3b5677;font-size:17px}
summary::-webkit-details-marker{display:none}
.menu>summary:hover,.menu[open]>summary{background:#edf4fc;border-color:#ccdcee}
.menu-panel{z-index:3;position:absolute;right:0;top:calc(100% + 4px);width:max-content;min-width:135px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px #21385825}
tr:nth-last-child(-n+2) .menu-panel{top:auto;bottom:calc(100% + 4px)}
.menu-panel button{display:block;width:100%;padding:6px 8px;background:#fff;border:0;text-align:left;border-radius:4px;color:#263e5c}
.menu-panel button:hover{background:#eff5fc}
.group-row td{background:#f4f7fb;padding:0}
.group-toggle{width:100%;background:none;border:0;text-align:left;padding:7px 11px;font-weight:700;color:#2b4664}
.group-toggle small{margin-left:7px;color:var(--muted);font-weight:500}
.chevron{display:inline-block;margin-right:7px}
.group-toggle[aria-expanded=true] .chevron{transform:rotate(90deg)}
.empty{text-align:center;padding:38px 15px 42px;border:1px dashed #c9d9eb;border-radius:8px;background:#f9fbfe}
.empty p{margin:5px 0 12px;color:var(--muted)}
.signal{padding:8px 10px;border-radius:7px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#notice{margin-top:11px}
details.deployment{margin-top:13px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}
.deployment summary{padding:7px 10px;cursor:pointer;font-weight:650;color:#34506f}
.deployment p{padding:0 10px 8px 24px}
.demo{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.demo select{font:inherit;color:#34506f;border:1px solid #bfcee0;border-radius:6px;padding:3px 5px;background:#fff}
dialog{padding:0;border:0;color:var(--ink);box-shadow:0 20px 75px #14264155}
dialog::backdrop{background:#14294295}
.modal{width:min(920px,calc(100% - 26px));max-width:none;max-height:none;border-radius:12px;overflow:hidden}
.dialog-ui{display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:calc(100dvh - 34px)}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:21px;line-height:1.25;margin-bottom:3px}
.dialog-body{padding:15px 20px;overflow:auto;overscroll-behavior:contain}
.dialog-foot{border-top:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px 13px}
.dialog-foot p{color:var(--muted);font-size:13px;flex:1}
.dialog-foot .actions{gap:7px}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:flex;text-align:left;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);padding:10px}
.pick:hover,.pick[aria-pressed=true]{background:#edf5ff;border-color:#9dbff0}
.pick strong,.pick small{display:block}
.pick small{margin-top:2px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.field{min-width:0}
.wide{grid-column:1/-1}
.field>label{display:block;margin-bottom:3px}
.field small{display:block;margin-top:3px;color:var(--muted)}
.field [aria-invalid=true]{border-color:#af352e}
.field-error{font-size:12px;color:#972f26;margin-top:3px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:10px}
.form-card h3{font-size:15px;margin-bottom:7px}
.setup-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-items:start}
.setup-columns>.form-card{margin:0}
.setup-columns + .form-card{margin:10px 0 0}
.dialog-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#setup-title:focus{outline:none}
.inline-action{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:8px}
.choices{display:grid;gap:5px;padding:6px 0}
.choices label{display:flex;align-items:center;gap:5px}
.choices input{width:auto}
.form-msg{font-size:13px;padding:7px 8px;margin-top:7px;border-radius:6px;background:#edf4ff;color:#234e83}
.form-msg[data-tone=issue]{background:#fff0e9;color:#973820}
.form-msg[data-tone=good]{background:#e5f5ed;color:#155c46}
.drawer{padding:0;width:min(510px,100%);height:100dvh;max-width:none;max-height:none;margin:0 0 0 auto;border:0}
.drawer .dialog-ui{height:100%;max-height:none}
.drawer .dialog-body{background:#f5f8fc}
.detail-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.detail-kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:7px;font-size:13px}
.detail-kv dt{color:var(--muted)}
.detail-kv dd{overflow-wrap:anywhere}
.detail-actions{display:flex;gap:7px;flex-wrap:wrap}
.confirm{width:min(420px,calc(100% - 28px));border-radius:11px;padding:18px 20px}
.confirm h2{font-size:18px}
.confirm p{color:var(--muted);margin:6px 0 15px}
@media(max-width:1000px){
 .shell{grid-template-columns:158px minmax(0,1fr)}
 main{padding:18px 16px 26px}
 .sidebar{padding-inline:8px}
 th:first-child{width:26%} th:nth-child(2){width:18%} th:nth-child(4){width:19%} th:last-child{width:21%}
}
@media(max-width:780px){
 .shell{display:block}.sidebar{display:none}.top{gap:18px;padding:0 14px}.top-links{gap:12px}
 main{padding:15px 12px 24px}
}
@media(max-width:650px){
 .top{height:auto;min-height:49px;flex-wrap:wrap;gap:2px 12px}.top-links{font-size:12px;flex-wrap:wrap}.top-links strong{padding:10px 0 8px}
 .page-head h1{font-size:24px}.page-head p{font-size:12px}.page-head{align-items:flex-start}
 .workspace-body{padding:10px}.tabbar{padding:0 10px;gap:15px}
 .stat{padding:5px 7px;font-size:12px}.stat b{font-size:17px}
 .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .control.search{max-width:none;grid-column:1/-1}.filters .btn{align-self:end}
 table,tbody{display:block}thead{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
 tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;padding:9px;border-top:1px solid #e4ebf3}
 tbody tr:first-child{border-top:0}
 td{display:block;padding:0;border:0}td:first-child,td:last-child{grid-column:1/-1}
 td[data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
 .group-row{padding:0}.group-row td{display:block}
 .time{white-space:normal}.menu-panel{top:auto;bottom:calc(100% + 4px)}
 .dialog-head,.dialog-body,.dialog-foot{padding-inline:12px}
 .dialog-foot{display:grid;grid-template-columns:minmax(0,1fr)}
 .form-grid,.pick-grid,.setup-columns{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span class="logo-icon">K</span>kube-aiops</div>
  <div class="top-links"><span>诊断控制台</span><strong>资源管理</strong><span>运维知识库</span><span>系统管理</span></div>
</header>
<div class="shell">
  <aside class="sidebar">
    <h2>资源管理</h2><p>集群资源</p><span>Kubernetes 集群管理</span>
    <p>平台目录</p><span>环境管理</span><span>业务线管理</span><strong aria-current="page">数据源管理</strong>
  </aside>
  <main>
    <p class="crumb">资源管理 › 数据源管理</p>
    <header class="page-head">
      <div><h1>数据源管理</h1><p class="muted">接入诊断信号和云资产，查看验证与同步状态。</p></div>
      <button type="button" class="btn primary" id="add-source">＋ 新增数据源</button>
    </header>
    <section class="workspace">
      <div class="tabbar" role="tablist" aria-label="数据源分类">
        <button type="button" data-tab="monitor" id="tab-monitor" role="tab" aria-controls="source-panel" aria-selected="true">监控与诊断</button>
        <button type="button" data-tab="asset" id="tab-asset" role="tab" aria-controls="source-panel" aria-selected="false" tabindex="-1">资产数据源</button>
      </div>
      <div class="workspace-body" id="source-panel" role="tabpanel" aria-labelledby="tab-monitor">
        <div class="summary" aria-label="当前页签统计">
          <button type="button" class="stat" data-filter="all" aria-pressed="true">已接入<b id="stat-all">0</b></button>
          <button type="button" class="stat" data-filter="issue" aria-pressed="false">需处理<b id="stat-issue">0</b></button>
          <button type="button" class="stat" data-filter="paused" aria-pressed="false">暂停或停用<b id="stat-paused">0</b></button>
        </div>
        <div class="filters" aria-label="筛选数据源">
          <label class="control search"><span>搜索</span><input type="search" id="search" placeholder="搜索数据源名称"></label>
          <label class="control"><span>环境</span><select id="environment"><option value="">全部环境</option><option>生产</option><option>预发</option><option>测试</option><option>研发</option><option>未指定</option></select></label>
          <label class="control"><span>类型</span><select id="type-filter"></select></label>
          <label class="control"><span>状态</span><select id="state-filter"><option value="">全部状态</option><option value="enabled">已启用</option><option value="issue">需处理</option><option value="pending">待首次同步</option><option value="paused">暂停或停用</option></select></label>
          <button type="button" class="btn weak" id="clear-filters">清空筛选</button>
        </div>
        <div class="results-bar"><span id="result-count" role="status"></span><label class="group-label"><input type="checkbox" id="group-view">按类型分组</label></div>
        <div id="load-error" class="signal issue" hidden><span>资产数据源暂时无法读取。</span><button type="button" class="btn small" id="retry-load">重试加载</button></div>
        <div class="table-wrap" id="table-wrap">
          <table aria-label="数据源列表"><thead><tr><th scope="col">名称 / 类型</th><th scope="col">所属范围</th><th scope="col">状态</th><th scope="col">最近活动 <span class="muted">· UTC+8</span></th><th scope="col">操作</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
        <div id="empty" class="empty" hidden></div>
        <p id="notice" class="signal ready" role="status" hidden></p>
        <details id="deployment" class="deployment"><summary>部署配置 <small class="muted">· 1 项</small></summary><p class="hint">Prometheus · 由部署参数维护</p></details>
      </div>
    </section>
    <div class="demo"><label for="demo-view">原型场景</label><select id="demo-view"><option value="normal">已有数据源</option><option value="empty">尚未接入</option><option value="error">资产加载失败</option></select><span>使用示例数据</span></div>
  </main>
</div>
<dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
<dialog id="setup" class="modal" aria-labelledby="setup-title"></dialog>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2><p id="confirm-copy"></p>
  <div class="actions"><button type="button" class="btn" id="confirm-stay" autofocus>取消</button><button type="button" class="btn primary" id="confirm-act">确认</button></div>
</dialog>
<script>
"use strict";
const by = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[char]);
const types = {
  zabbix: { name:"Zabbix", mark:"Z", tint:"#fce9e9", ink:"#97352f", purpose:"同步主机问题", side:"monitor", operation:"sync" },
  prometheus: { name:"Prometheus", mark:"P", tint:"#ffebdf", ink:"#a54220", purpose:"查询指标证据", side:"monitor", operation:"test" },
  victorialogs: { name:"VictoriaLogs", mark:"VL", tint:"#edf0ff", ink:"#4051a0", purpose:"查询日志证据", side:"monitor", operation:"test" },
  alertmanager: { name:"Alertmanager", mark:"A", tint:"#f4eafb", ink:"#744694", purpose:"同步告警和查询证据", side:"monitor", operation:"sync" },
  grafana: { name:"Grafana", mark:"G", tint:"#fff1d9", ink:"#835202", purpose:"关联诊断仪表盘", side:"monitor", operation:"test" },
  ecs: { name:"阿里云 ECS", mark:"E", tint:"#ffede0", ink:"#9b4826", purpose:"同步阿里云实例资产", side:"asset", operation:"inventory" },
  cvm: { name:"腾讯云 CVM", mark:"C", tint:"#e5f0ff", ink:"#19538e", purpose:"同步腾讯云实例资产", side:"asset", operation:"inventory" }
};
const envOptions = ["生产","预发","测试","研发"];
const stamp = "11-25";
const baseRows = [
  { id:"z1", kind:"zabbix", name:"生产主机监控", env:"生产", business:"全局", state:"good", time:"09:18", checked:"09:18", auth:"token", selections:["生产应用主机","生产中间件"], sample:"128 台主机 · 7 条活跃问题" },
  { id:"a1", kind:"alertmanager", name:"生产 Kubernetes 告警", env:"生产", business:"运维", cluster:"prod-k8s-01", state:"issue", time:"08:42", checked:"09:17", auth:"none", error:"上游连接超时，当前可查看上次成功同步的快照。" },
  { id:"p1", kind:"prometheus", name:"生产集群指标", env:"生产", business:"运维", cluster:"prod-k8s-01", state:"ready", time:"09:06", checked:"09:06", auth:"bearer" },
  { id:"v1", kind:"victorialogs", name:"生产应用日志", env:"生产", business:"运维", cluster:"prod-k8s-01", state:"ready", time:"08:56", checked:"08:56", auth:"basic", username:"observe-reader", account:"0", project:"0" },
  { id:"g1", kind:"grafana", name:"运维诊断仪表盘", env:"生产", business:"运维", cluster:"prod-k8s-01", state:"ready", time:"09:03", checked:"09:03", auth:"bearer", selections:["Kubernetes 集群","应用可用性"] },
  { id:"z2", kind:"zabbix", name:"预发主机监控", env:"预发", business:"全局", state:"paused", time:"08:24", auth:"password", selections:["预发应用主机"] },
  { id:"a2", kind:"alertmanager", name:"测试集群告警", env:"测试", business:"运维", cluster:"test-k8s-01", state:"pending", auth:"none" },

function run(row) {

  updateRowUI(row);
  setTimeout(()=>{
    running.delete(row.id);
    row.time=row.checked=now();
    row.error="";
    row.state=action(row)==="test"?"ready":"good";
    if(isAsset(row))row.sample="1 台可见资产";
    updateRowUI(row,"[data-run]");

  },530);

}
function clusterChoices(env) {
  const clusters={生产:"prod",预发:"pre",测试:"test",研发:"dev"};
  return [["","请选择集群实例"],...(clusters[env]?[[clusters[env]+"-k8s-01",clusters[env]+"-k8s-01"]]:[])];
}
function replaceClusterOptions() {
  const select=by("form-cluster");
  if(!select)return;
  select.replaceChildren(...clusterChoices(by("form-env").value).map(([id,label])=>new Option(label,id)));
}
function value(id) {return by(id)?.value.trim()||"";}
function updateAuth() {
  if(!by("form-auth"))return;
  const auth=value("form-auth");
  const hasAccount=auth==="password"||auth==="basic";
  by("account-field").hidden=!hasAccount;
  by("form-account").disabled=!hasAccount;
  by("secret-field").hidden=auth==="none";
  by("form-secret").disabled=auth==="none";
  const label=setup.querySelector('label[for="form-secret"]');
  label.textContent=auth==="password"||auth==="basic"?"密码":auth==="bearer"?"Token":"API Token";
}
function updateMapping() {
  if(!by("form-mapping"))return;
  const shared=value("form-mapping")==="shared";
  by("mapping-label").hidden=!shared;
  by("mapping-value").hidden=!shared;
  by("form-label").disabled=!shared;
  by("form-value").disabled=!shared;
}
function selections() {
  return [...setup.querySelectorAll("[name=selection]:checked")].map(option=>option.value);
}
function paintDiscovery() {
  const block=by("discover");
  if(!block)return;
  const isZ=flow.kind==="zabbix";
  if(!flow.tested){
    block.innerHTML='<p class="hint">测试连接后选择'+(isZ?"主机组":"仪表盘")+'。</p>';
    return;
  }
  const samples=isZ?["生产应用主机","生产中间件","预发应用主机"]:["Kubernetes 集群","应用可用性","入口流量"];
  block.innerHTML='<strong>选择'+(isZ?"主机组":"仪表盘")+'</strong><div class="choices">'+samples.map(item=>
    '<label><input name="selection" type="checkbox" value="'+esc(item)+'" '+(flow.row?.selections?.includes(item)?"checked":"")+'> '+esc(item)+'</label>').join("")+'</div>';
}
function setResult(id,message,tone="") {
  const node=by(id);
  if(!node)return;
  node.hidden=!message;
  node.textContent=message;
  node.dataset.tone=tone;
}
function showError(control,message) {
  if(!control){
    by("setup-status").textContent=message;
    return;
  }
  clearError(control);
  const error=document.createElement("p");
  error.id=control.id+"-error";
  error.className="field-error";
  error.textContent=message;
  control.after(error);
  control.setAttribute("aria-invalid","true");
  control.setAttribute("aria-describedby",error.id);
  control.focus();
}
function clearError(control) {
  if(!control?.hasAttribute("aria-invalid"))return;
  by(control.id+"-error")?.remove();
  control.removeAttribute("aria-invalid");
  control.removeAttribute("aria-describedby");
}
function check(ids) {
  for(const id of ids){
    const control=by(id);
    if(control&&!control.disabled&&!value(id)){
      const label=setup.querySelector('label[for="'+id+'"]').textContent.replace("*","").trim();
      showError(control,"请填写或选择"+label+"。");
      return false;
    }
  }
  return true;
}
function checkURL() {
  const addr=by("form-endpoint");
  try{
    const url=new URL(addr.value.trim());
    if(url.protocol==="https:" && url.hostname && !url.username && !url.password)return true;
  }catch{}
  showError(addr,"请输入有效的 HTTPS 服务地址。");
  return false;
}
function checkRange(previewing) {
  if(flow.kind==="zabbix"){
    if(previewing&&!selections().length){setResult("preview-result","请至少选择一个主机组。","issue");return false;}
    return true;
  }
  if(!check(["form-env","form-business","form-cluster"]))return false;
  if(value("form-mapping")==="shared"&&!check(["form-label","form-value"]))return false;
  if(flow.kind==="victorialogs"&&(value("form-account-id")||value("form-project-id"))){
    if(!check(["form-account-id","form-project-id"]))return false;
    for(const id of ["form-account-id","form-project-id"]){
      const number=Number(value(id));
      if(!Number.isInteger(number)||number<0||number>4294967295){
        showError(by(id),"请输入 0 至 4294967295 之间的整数。");
        return false;
      }
    }
  }
  if(previewing&&flow.kind==="grafana"&&!selections().length){
    setResult("preview-result","请至少选择一个仪表盘。","issue");
    return false;
  }
  return true;
}
function refreshSetup() {
  const save=by("setup-save");
  if(!save)return;
  const asset=types[flow.kind].side==="asset";
  save.disabled=saveDisabled||(!asset&&!flow.ready);
  if(by("preview")){
    by("preview").hidden=!flow.tested;
    by("preview").disabled=saveDisabled||!flow.tested;
  }
  if(by("probe")){
    by("probe").hidden=flow.tested&&flow.mode!=="rotate";
    by("probe").disabled=saveDisabled;
  }
  by("setup-status").textContent=saveDisabled?"正在处理…":asset?"保存后可在列表中测试并同步。":
    flow.ready?"已完成验证，可保存。":flow.tested?"请选择范围并预览。":"请先测试连接。";
}
function invalidate(onlyPreview=false) {
  flow.ready=false;
  setResult("preview-result","");
  if(!onlyPreview){
    flow.tested=false;
    setResult("probe-result","");
    paintDiscovery();
  }
  refreshSetup();
}
function fillSample() {
  const set=(id,text)=>{if(by(id)&&!by(id).readOnly)by(id).value=text;};
  for(const field of setup.querySelectorAll("[aria-invalid]"))clearError(field);
  if(!flow.row)set("form-name","示例 "+types[flow.kind].name);
  set("form-endpoint","https://"+flow.kind+".example.com");
  set("form-secret","prototype-reader");
  set("form-account","observe-reader");
  if(!flow.row){
    set("form-env","生产");set("form-business","运维");
    replaceClusterOptions();
    set("form-cluster","prod-k8s-01");
  }
  if(types[flow.kind].side==="asset"){
    set("form-region",flow.kind==="ecs"?"cn-hangzhou":"ap-guangzhou");
    set("form-asset-ids",flow.kind==="ecs"?"i-sample-datasource":"ins-sample-datasource");
    set("form-ref","cloud-reader");
    set("form-asset-cluster","prod-k8s-01");
    set("form-namespace","ops");
    set("form-asset-env","prod");
    set("form-asset-business","ops");
  }
  flow.dirty=true;
  invalidate();
}
function probe(previewing) {
  if(saveDisabled)return;
  if(!previewing){
    if(!check(["form-name","form-endpoint","form-env","form-account"])||!checkURL()||
      ((!flow.row||flow.mode==="rotate"||flow.row.auth!==value("form-auth"))&&!check(["form-secret"])))return;
  }
  if(!checkRange(previewing))return;
  saveDisabled=true;
  refreshSetup();
  by("setup-body").inert=true;
  setResult(previewing?"preview-result":"probe-result",previewing?"正在预览…":"正在测试连接…");
  setTimeout(()=>{
    by("setup-body").inert=false;
    saveDisabled=false;
    if(previewing){
      flow.ready=true;
      const sample={zabbix:"预览通过 · 26 台主机，4 条活跃问题。",prometheus:"预览通过 · 18 条时序。",victorialogs:"预览通过 · 12 条日志。",alertmanager:"预览通过 · 4 条活动告警。",grafana:"预览通过 · "+selections().length+" 个仪表盘。"};
      setResult("preview-result",sample[flow.kind],"good");
    }else {
      const outcome=value("probe-scenario");
      flow.tested=outcome==="ok";
      flow.ready=flow.tested&&flow.mode==="rotate";
      setResult("preview-result","");
      setResult("probe-result",flow.tested?"连接测试通过。":outcome==="denied"?"上游拒绝授权，请检查账号或只读凭据。":"连接超时，请检查服务地址和网络路径。",flow.tested?"good":"issue");
      paintDiscovery();
    }
    refreshSetup();
    const result=by(previewing?"preview-result":"probe-result");
    if(result?.dataset.tone==="issue"||previewing||flow.mode==="rotate"){
      result?.scrollIntoView({block:"nearest"});
      (previewing?by("setup-save"):by("probe"))?.focus({preventScroll:true});
    }else if(by("discover")){
      const selection=setup.querySelector("[name=selection]");
      if(selection)selection.focus();
      else by("preview")?.focus();
    }else by("preview")?.focus();
  },420);
}
function saveFlow(event) {
  event.preventDefault();
  if(saveDisabled || by("setup-save").disabled)return;
  const {mode,kind,row}=flow;
  const asset=types[kind].side==="asset";
  if(asset&&!check(["form-name","form-asset-ids","form-ref","form-asset-cluster","form-namespace"]))return;
  const inputValues={
    name:value("form-name"),endpoint:value("form-endpoint"),auth:value("form-auth"),username:value("form-account"),
    env:value("form-env") || (value("form-asset-env")==="prod"?"生产":value("form-asset-env")),business:value("form-business") || value("form-asset-business"),
    cluster:value("form-cluster") || value("form-asset-cluster"),namespace:value("form-namespace"),
    region:value("form-region"),assetIds:value("form-asset-ids"),selections:selections(),
    mapping:value("form-mapping"),label:value("form-label"),mappingValue:value("form-value"),
    account:value("form-account-id"),project:value("form-project-id"),suppressed:Boolean(by("form-suppressed")?.checked)
  };
  let saved=row;
  if(!row){
    saved={...inputValues,kind,id:"new-"+(++nextID),
      state:asset?(by("form-enabled").checked?"untested":"paused"):types[kind].operation==="sync"?"pending":"ready",
      time:!asset&&types[kind].operation==="test"?now():""};
    rows.unshift(saved);
  }else if(mode==="scope"){
    row.selections=inputValues.selections;
  }else if(mode==="rotate"){
    row.auth=inputValues.auth;
  }else if(asset){
    Object.assign(row,{name:inputValues.name,region:inputValues.region,assetIds:inputValues.assetIds});
    if(!by("form-enabled").checked){
      if(row.state!=="paused")row.beforePause=row.state;
      row.state="paused";
    }else if(row.state==="paused")row.state=row.beforePause||"untested";
  }else {
    Object.assign(row,{...inputValues});
    if(action(row)==="test"){
      row.time=row.checked=now();
      if(row.state!=="paused")row.state="ready";
    }
  }
  setup.close();
  groupState.delete(kind);
  render();
  if(detail.open&&detailID===saved.id){paintDetail(saved);detail.querySelector("[data-close-detail]").focus();}
  notify(saved.name+" · 配置已保存。"+(asset&&!row?" 可以测试并同步。":""),"good");
}
function goBack() {
  const returnToPicker=()=>{
    flow.mode="pick";
    flow.dirty=flow.ready=flow.tested=false;
    paintPicker();
    setup.querySelector("h2").focus();
  };
  if(flow.dirty)ask("返回类型选择？","这一步已经填写的内容将被丢弃。","返回选择",returnToPicker);
  else returnToPicker();
}
by("add-source").addEventListener("click",event=>openSetup("pick",undefined,event.currentTarget));
by("clear-filters").addEventListener("click",clearFilters);
for(const [id,key] of [["search","search"],["environment","env"],["type-filter","kind"],["state-filter","state"],["group-view","group"]]){
  by(id).addEventListener("input",event=>{
    filters[side][key]=key==="group"?event.target.checked:event.target.value;
    render();
  });
}
by("demo-view").addEventListener("change",event=>{
  scene=event.target.value;
  rows=scene==="empty"?[]:structuredClone(baseRows);
  groupState.clear();
  filters.monitor={};
  filters.asset={};
  switchTab(scene==="error"?"asset":"monitor");
});
by("retry-load").addEventListener("click",()=>{
  scene="normal";
  by("demo-view").value="normal";
  render();
  by("search").focus();
  notify("资产数据源已重新加载。","good");
});
document.querySelector(".tabbar").addEventListener("click",event=>{
  const tab=event.target.closest("[data-tab]");
  if(tab)switchTab(tab.dataset.tab);
});
document.querySelector(".tabbar").addEventListener("keydown",event=>{
  if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
  event.preventDefault();
  switchTab(event.key==="Home"?"monitor":event.key==="End"?"asset":side==="monitor"?"asset":"monitor",true);
});
by("source-panel").addEventListener("click",event=>{
  const target=event.target.closest("button");
  if(!target)return;
  if(target.dataset.filter){
    filters[side].state=target.dataset.filter==="all"?"":target.dataset.filter;
    syncFilters();
    render();
  }
  if(target.hasAttribute("data-clear")){
    clearFilters();
    by("search").focus();
  }
  if(target.hasAttribute("data-add"))openSetup("pick",undefined,target);
  if(target.dataset.group){
    const group=target.dataset.group;
    if(groupState.has(group))groupState.delete(group);
    else groupState.add(group);
    render();
    by("rows").querySelector('[data-group="'+group+'"]').focus();
  }
  const origin=target.closest(".menu");
  const row=getRow(target.dataset.detail||target.dataset.run||target.dataset.row);
  if(!row)return;
  if(origin)origin.open=false;
  const returnTo=origin?.querySelector("summary")||target;
  if(target.dataset.detail)openDetail(row,returnTo);
  if(target.dataset.run)run(row);
  if(target.dataset.action)rowCommand(row,target.dataset.action,returnTo);
});
document.addEventListener("click",event=>{
  const current=event.target.closest(".menu");
  for(const menu of document.querySelectorAll(".menu[open]"))if(menu!==current)menu.open=false;
});
by("source-panel").addEventListener("keydown",event=>{
  const menu=event.target.closest(".menu[open]");
  if(event.key!=="Escape"||!menu)return;
  event.preventDefault();
  menu.open=false;
  menu.querySelector("summary").focus();
});
detail.addEventListener("click",event=>{
  const target=event.target.closest("button");
  if(!target)return;
  if(target.hasAttribute("data-close-detail"))detail.close();
  const row=getRow(target.dataset.run||target.dataset.row);
  if(!row)return;
  if(target.dataset.run)run(row);
  if(target.dataset.action)rowCommand(row,target.dataset.action,target);
});
detail.addEventListener("close",()=>{
  const focus=detailReturn?.isConnected?detailReturn:by("rows").querySelector('[data-detail="'+detailID+'"]');
  (focus||by("search")).focus();
  detailID=undefined;
});
setup.addEventListener("click",event=>{
  const target=event.target.closest("button");
  if(!target)return;
  if(target.hasAttribute("data-close-setup"))closeSetup();
  if(target.dataset.pick){
    flow.kind=target.dataset.pick;
    for(const option of setup.querySelectorAll("[data-pick]")){
      option.setAttribute("aria-pressed",String(option===target));
    }
    by("pick-next").disabled=false;
  }
  if(target.id==="pick-next"){
    flow.mode="add";
    paintForm();
    setup.querySelector("h2").focus();
  }
  if(target.hasAttribute("data-back-pick"))goBack();
  if(target.hasAttribute("data-demo-fill"))fillSample();
  if(target.id==="probe")probe(false);
  if(target.id==="preview")probe(true);
});
setup.addEventListener("input",event=>{
  const control=event.target;
  if(!setup.querySelector("form"))return;
  clearError(control);
  if(control.id==="probe-scenario"){
    invalidate();
    return;
  }
  flow.dirty=true;
  if(control.id==="form-env")replaceClusterOptions();
  if(control.id==="form-auth"){
    by("form-secret").value="";
    clearError(by("form-secret"));
    clearError(by("form-account"));
    updateAuth();
  }
  if(control.id==="form-mapping")updateMapping();
  invalidate(control.name==="selection"||flow.mode==="scope");
});
setup.addEventListener("submit",saveFlow);
setup.addEventListener("cancel",event=>{event.preventDefault();closeSetup();});
setup.addEventListener("close",()=>{
  setup.replaceChildren();
  flow=undefined;
  if(setupReturn?.isConnected)setupReturn.focus();
  else if(detail.open)detail.querySelector("[data-close-detail]")?.focus();
  else by("add-source").focus();
});
by("confirm-stay").addEventListener("click",()=>confirmDialog.close());
by("confirm-act").addEventListener("click",()=>{
  confirmDialog.close();
  confirmed?.();
});
switchTab("monitor");
</script>
</body>
</html>
