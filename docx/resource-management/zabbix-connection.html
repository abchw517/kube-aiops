<body>
<header class="top"><div class="brand"><span class="brand-sign" aria-hidden="true">K</span> kube-aiops</div><span class="aux">本地交互原型 · 模拟数据</span></header>
<div class="layout">
  <nav class="rail" aria-label="平台导航">
    <p>资源管理</p><button type="button" data-act="sources" aria-current="page">数据源管理</button>
    <p>诊断控制台</p><button type="button" data-act="overview">诊断总览</button>
  </nav>
  <main class="main" id="screen"></main>
</div>
<dialog class="dialog" id="modal" aria-labelledby="modal-title"></dialog>
<div class="banner ok toaster" id="notification" role="status" hidden></div>
<script>
"use strict";
const groups = [
  {id:"windows",label:"Windows 应用主机",hosts:["web","app"]},
  {id:"middleware",label:"中间件",hosts:["kafka"]},
  {id:"edge",label:"入口与证书",hosts:["web","tls"]},
  {id:"infra",label:"基础设施巡检",hosts:["probe"]}
];
const businesses={生产:["运维","有数","云帆"],测试:["运维","有数"]};
const demoDay="2026-11-24";
const physicalHosts={
  web:{name:"WIN-WEB-01",cluster:""}, app:{name:"WIN-APP-02",cluster:""},
  kafka:{name:"Kafka-02",cluster:""}, tls:{name:"TLS-Monitor-01",cluster:"ACK 生产集群"},
  probe:{name:"ACK Node Probe",cluster:"ACK 生产集群"}
};
const problems = [
  {id:"41001",host:"web",title:"Windows 可用内存低于 1 GB",level:"警告",native:"一般",day:24,time:"14:20",state:"未恢复",ack:"未确认",tags:["class: os","component: memory"]},
  {id:"41002",host:"app",title:"D 盘空间不足，使用率超过 85%",level:"警告",native:"警告",day:23,time:"22:07",state:"未恢复",ack:"未确认",tags:["class: os","component: storage"]},
  {id:"41003",host:"kafka",title:"Kafka 消费积压超过 20 万条",level:"严重",native:"严重",day:24,time:"10:42",state:"未恢复",ack:"已确认",tags:["Application: Kafka"]},
  {id:"41004",host:"tls",title:"SSL 证书剩余有效期不足 30 天",level:"信息",native:"信息",day:21,time:"08:15",state:"未恢复",ack:"未确认",tags:["Application: SSL"]},
  {id:"41005",host:"kafka",title:"ZooKeeper 请求延迟超过 15 秒",level:"警告",native:"一般",day:24,time:"09:00",state:"已恢复",ack:"已确认",tags:["Application: ZooKeeper"]}
].map(problem=>({...problem,source:"Zabbix",asset:physicalHosts[problem.host].name,cluster:physicalHosts[problem.host].cluster}));
const baseRows = [
  {id:"INC-042",source:"故障事件",cluster:"ACK 生产集群",asset:"ACK 生产集群",title:"支付网关后端错误率升高",level:"严重",day:24,time:"13:48",state:"处理中",environment:"生产",business:"运维"},
  {id:"F-026",source:"K8sGPT",cluster:"TKE 生产集群",asset:"TKE 生产集群",title:"订单服务 Pod 重启次数异常",level:"警告",day:24,time:"12:35",state:"—",environment:"生产",business:"有数"},
  {id:"F-019",source:"K8sGPT",cluster:"ACK 生产集群",asset:"ACK 生产集群",title:"应用未配置资源请求",level:"信息",day:22,time:"16:40",state:"—",environment:"生产",business:"运维"}
];
const checkNames=["地址与版本","凭据认证","主机组读取","问题读取"];
const failures = {
  blocked:[0,"地址尚未获准","请联系平台管理员检查 Zabbix 地址的访问策略。"],
  net:[0,"连接超时","请检查 Zabbix 地址及平台后端到 Zabbix 的网络。"],
  tls:[0,"证书校验失败","请检查 Zabbix 域名、证书链以及平台信任的 CA。"],
  auth:[1,"认证失败","检查账号密码或 API Token。凭据过期后可换用新凭据。"],
  noaccess:[2,"可认证，未发现可读取的主机组","请在 Zabbix 为接入账号授予目标主机组的只读权限。"],
  role:[3,"可读取主机组，无法读取问题","请在 Zabbix 用户角色中检查 problem.get 与 event.get 的权限。"]
};
const sampleOptions={ok:"正常",empty:"当前零问题",firstTimeout:"首次同步超时",blocked:"地址未获准",auth:"认证失败",net:"连接超时",tls:"证书异常",noaccess:"无可读主机组",role:"无问题权限"};
const healthLabels={
  pending:["等待首次同步","info"],syncing:["同步中","info"],healthy:["同步正常","ok"],
  firstFailed:["首次同步失败","bad"],stale:["数据已过期","warn"],restricted:["采集范围权限失效","bad"],paused:["已暂停",""]
};
let page="sources", source=null, draft=null, modalKind="", noticeTimer, attemptCounter=0;
let filters={source:"",cluster:"",level:"",environment:"",business:"",state:"active",days:7};
const screen=document.querySelector("#screen"), modal=document.querySelector("#modal");
const esc = value => String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function button(action,label,kind="",extra=""){return '<button type="button" class="btn '+kind+'" data-act="'+action+'" '+extra+'>'+label+'</button>'}
function options(values,selected){return Object.entries(values).map(([key,label])=>'<option value="'+esc(key)+'"'+(key===selected?' selected':'')+'>'+esc(label)+'</option>').join("")}
function chip(label,kind=""){return '<span class="state '+kind+'">'+esc(label)+'</span>'}
function levelChip(level){return chip(level,{严重:"bad",警告:"warn",信息:"info"}[level])}
function toast(message){
  const box=document.querySelector("#notification");
  clearTimeout(noticeTimer); box.textContent=message; box.hidden=false;
  noticeTimer=setTimeout(()=>{box.hidden=true},3200);
}
function navigate(target, onlyZabbix=false){
  page=target;
  if(onlyZabbix) filters={source:"Zabbix",cluster:"",level:"",environment:source?.environment||"",business:source?.business||"",state:"active",days:7};
  if(modal.open) modal.close();
  render();
  screen.querySelector("h1").focus();
}
function heading(crumb,title,description,action=""){
  return '<p class="crumbs">'+crumb+'</p><div class="title"><div><h1 tabindex="-1">'+title+'</h1><p>'+description+'</p></div>'+action+'</div>';
}
function mockProblems(selection,scenario){const list=hostIDs(selection);return scenario==="empty"?[]:problems.filter(p=>list.has(p.host))}
function authLabel(method){return method==="password"?"账号密码":"API Token"}
function ordered(rows){return [...rows].sort((a,b)=>b.day-a.day||b.time.localeCompare(a.time)||a.id.localeCompare(b.id))}
function filterOptions(values){return Object.fromEntries(values.map(value=>[value,value]))}
function render(){
  for(const b of document.querySelectorAll(".rail button")){
    if(b.dataset.act===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  }
  screen.innerHTML=page==="sources"?sourcePage():overviewPage();
}
function syncTime(step){
  const offset=24+step;
  return demoDay+" "+String(14+Math.floor(offset/60)).padStart(2,"0")+":"+String(offset%60).padStart(2,"0")+"（北京时间）";
}
function hasSnapshot(){return Boolean(source?.snapshot)&&!["paused","restricted"].includes(source.state)}
function groupNames(selection){return groups.filter(g=>selection.includes(g.id)).map(g=>g.label).join("、")}
function hostIDs(selection){return new Set(groups.filter(g=>selection.includes(g.id)).flatMap(g=>g.hosts))}
let zabbixPanelOpen=true;
function sourcePanel(headingHtml, body){
  return headingHtml+
    '<section class="card" aria-labelledby="zabbix-source-heading"><div class="card-h between"><h2 class="source-panel-heading" id="zabbix-source-heading"><button type="button" class="source-panel-toggle" data-act="toggle-zabbix-panel" aria-expanded="'+zabbixPanelOpen+'" aria-controls="zabbix-source-list">Zabbix 数据源</button></h2>'+
    (source?"":button("setup","接入 Zabbix","primary"))+'</div><div id="zabbix-source-list"'+(zabbixPanelOpen?"":" hidden")+'>'+body+'</div></section>';
}
function sourcePage(){
  const headingHtml=heading("资源管理 / 平台目录","数据源管理","接入监控数据源，查看采集范围与同步状态。");
  if(!source) return sourcePanel(headingHtml,'<p class="source-empty">当前范围尚未接入 Zabbix 数据源。</p>');
  const health=healthLabels[source.state];
  const count=hasSnapshot()?source.snapshot.filter(p=>p.state==="未恢复").length:"—";
  const fix=source.state==="restricted"?button("rotate","验证并更换凭据"):source.state==="paused"?button("pause","恢复采集"):button("sync",source.state==="firstFailed"?"重试同步":"立即同步","",source.state==="syncing"?' disabled':'');

function normalizeEndpoint(value){
  const url=new URL(value.trim());
  if(url.protocol!=="https:"||url.username||url.password||url.search||url.hash)throw new Error("invalid URL");
  const path=url.pathname.replace(/\/+$/,"");
  if(/\.(?:php|html)$/i.test(path)&&!path.endsWith("/api_jsonrpc.php"))throw new Error("use the base URL");
  url.pathname=path.endsWith("/api_jsonrpc.php")?path:path+"/api_jsonrpc.php";
  return url.toString();
}
function testConnection(){
  if(!draft||draft.testing||modalKind==="scope-edit")return;
  const endpoint=modal.querySelector("#endpoint"), credential=modal.querySelector("#credential");
  resetCheck();
  const badInput=(title,hint,field)=>{
    draft.check={ok:false,title,hint};reportCheck();field.focus();
  };
  let normalized;
  try{normalized=normalizeEndpoint(endpoint.value)}catch{
    badInput("地址格式有误","请输入 HTTPS 站点根路径，或完整的 api_jsonrpc.php 地址。",endpoint);return;
  }
  if(draft.method==="password"&&!modal.querySelector("#account").value.trim()){
    badInput("请输入 Zabbix 账号","建议使用专用只读账号。",modal.querySelector("#account"));return;
  }
  if(!credential.value.trim()){badInput("请填写凭据","原型可以点击「填入演示值」。",credential);return}
  const candidate=draft, revision=draft.revision;
  draft.testing=true;draft.check={pending:true};reportCheck();updateSave();
  setTimeout(()=>{
    if(draft!==candidate||draft.revision!==revision||!modal.open)return;
    draft.testing=false;
    const fail=failures[draft.scenario];
    if(fail){
      draft.check={ok:false,failedIndex:fail[0],title:fail[1],hint:fail[2]};
    }else{
      draft.tested=true;draft.endpoint=normalized;
      endpoint.value=normalized;credential.value="";
      credential.placeholder="已验证 · 更改时重新填写";
      draft.check={ok:true,title:"连接成功 · Zabbix "+draft.version,
        hint:modalKind==="rotate"?"已验证当前采集范围与问题读取权限。":"可读取 "+groups.length+" 个主机组，可继续配置采集范围。"};
    }
    reportCheck();refreshScope();updateSave();
  },280);
}
function persist(){
  if(!draft?.tested||modal.querySelector("#save").disabled)return;

    const paused=source.state==="paused";

    if(!paused)source.state=source.snapshot?"healthy":"pending";
    notifySave("新凭据已保存。");if(!paused)sync();
    return;
  }
  const setup=modalKind==="setup";
  const generation=(source?.generation||0)+1;
  const config={endpoint:draft.endpoint,method:draft.method,version:draft.version,name:draft.name.trim(),environment:draft.environment,business:draft.business,
    groups:[...draft.groups],scenario:draft.scenario,generation};
  zabbixPanelOpen=true;
  source={...config,state:"pending",upstream:setup&&draft.scenario==="firstTimeout"?"timeout":"ok",
    snapshot:null,snapshotHosts:null,lastSync:null,lastAttempt:null};
  navigate("sources");

function sync(){
  if(!source||["syncing","paused","restricted"].includes(source.state))return;
  const candidate=source, generation=++source.generation;
  const upstream=source.upstream;
  const stamp=syncTime(attemptCounter++);
  source.lastAttempt=stamp;source.state="syncing";refreshAfterAction("sync");
  setTimeout(()=>{
    if(source!==candidate||source.generation!==generation)return;
    if(upstream==="permission"){
      source.snapshot=null;source.snapshotHosts=null;source.state="restricted";
    }else if(upstream==="timeout"){
      source.state=source.snapshot?"stale":"firstFailed";
    }else{
      source.snapshot=mockProblems(source.groups,source.scenario);
      source.snapshotHosts=hostIDs(source.groups).size;source.lastSync=stamp;source.state="healthy";
    }
    const stillOnStatus=document.activeElement?.dataset?.act==="sync";
    render();if(stillOnStatus)focusAction("sync");
  },430);
}
function focusAction(action){screen.querySelector('[data-act="'+action+'"]:not([disabled])')?.focus()}
function refreshAfterAction(action){const held=document.activeElement?.dataset?.act===action;render();if(held)focusAction(action)}
function simulate(mode){
  if(!source)return;
  source.generation++;
  source.upstream=mode;
  if(source.state==="paused"){render();return}
  if(mode==="permission"){
    source.snapshot=null;source.snapshotHosts=null;source.state="restricted";
    source.lastAttempt=syncTime(attemptCounter++);render();return;
  }
  source.state=source.snapshot?"healthy":"pending";
  sync();
}
function togglePause(){
  if(source.state==="paused"){
    source.state="pending";sync();return;
  }
  source.generation++;source.state="paused";source.snapshot=null;source.snapshotHosts=null;
  render();focusAction("pause");
}
function showDetail(id){
  const row=overviewRows().find(item=>item.id===id);
  if(!row)return;
  const external=row.source==="Zabbix";
  const details=external?
    [["Zabbix 事件",row.id],["主机",row.asset],["业务范围",source.environment+" / "+source.business],["级别",row.level+"（Zabbix 原级别："+row.native+"）"],["问题状态",row.state],["Zabbix 确认",row.ack],["首次发生",timeText(row)],["持续时间",row.state==="已恢复"?"5 分钟":({"41001":"4 分钟","41002":"16 小时 17 分钟","41003":"3 小时 42 分钟","41004":"3 天 6 小时 9 分钟"})[row.id]]]:
    [["记录",row.id],["来源",row.source],["资源",row.asset],["级别",row.level],["状态",row.state],["首次发生",timeText(row)]];
  openDialog(dialogHead(esc(row.title),row.source==="Zabbix"?"Zabbix 问题详情":esc(row.source))+
    '<div class="dialog-body vstack"><dl class="kv">'+details.map(([key,value])=>'<dt>'+key+'</dt><dd>'+esc(value)+'</dd>').join("")+'</dl>'+
    (external?'<div class="tags">'+row.tags.map(t=>chip(t)).join("")+'</div><div id="detail-note" class="banner" role="status" hidden></div>':'')+
    '</div>'+footer(button("close","返回总览"),external?button("origin","查看 Zabbix 原始问题","primary"):""));
}
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-act]");
  if(!target)return;
  switch(target.dataset.act){
    case "sources":case "overview":navigate(target.dataset.act);break;
    case "toggle-zabbix-panel":
      zabbixPanelOpen=!zabbixPanelOpen;
      target.setAttribute("aria-expanded",String(zabbixPanelOpen));
      document.querySelector("#zabbix-source-list").hidden=!zabbixPanelOpen;
      break;
    case "overview-z":navigate("overview",true);break;
    case "setup":case "rotate":case "scope-edit":startEdit(target.dataset.act);break;
    case "close":modal.close();break;
    case "auth-mode":
      if(draft.method!==target.dataset.method){draft.method=target.dataset.method;draft.revision++;draft.tested=false;
        draft.testing=false;draft.check=null;showSetup();modal.querySelector("#credential").focus()}
      break;
    case "test":testConnection();break;
    case "sample":
      if(modalKind!=="rotate"){
        draft.endpoint="https://zabbix.example.test/zabbix";modal.querySelector("#endpoint").value=draft.endpoint;
        if(!draft.environment)draft.environment="生产";
        if(!draft.name.trim())draft.name="生产 Zabbix";
        modal.querySelector("#environment").value=draft.environment;
        modal.querySelector("#source-name").value=draft.name;
      }
      if(draft.method==="password")modal.querySelector("#account").value="svc-kube-aiops";
      modal.querySelector("#credential").value=draft.method==="password"?"demo-password":"demo-token";
      resetCheck();break;
    case "save":persist();break;
    case "sync":
      if(source?.state==="firstFailed")source.upstream="ok";
      sync();break;
    case "simulate-timeout":simulate("timeout");break;
    case "simulate-permission":simulate("permission");break;
    case "simulate-recover":simulate("ok");break;
    case "pause":togglePause();break;
    case "level":filters.level=target.dataset.level;render();screen.querySelector('.metric[aria-pressed="true"]').focus();break;
    case "bucket":screen.querySelector("#bucket-note").textContent=target.dataset.hint;break;
    case "detail":showDetail(target.dataset.id);break;
    case "origin":{const note=modal.querySelector("#detail-note");note.hidden=false;note.textContent="生产界面将打开该事件在 Zabbix 中的详情。演示数据不连接真实服务。";break}
  }
});
document.addEventListener("input",event=>{
  const input=event.target;
  if(!draft)return;
  if(input.id==="group-query"){renderGroups();return}
  if(input.id==="source-name"){draft.name=input.value;updateSave();return}
  if(!["endpoint","account","credential"].includes(input.id))return;
  if(input.id==="endpoint"){
    draft.endpoint=input.value;
    draft.groups=[];
  }
  resetCheck();
});
document.addEventListener("change",event=>{
  const input=event.target;
  if(draft&&input.id==="scenario"){draft.scenario=input.value;resetCheck()}
  if(draft&&input.id==="environment"){
    if(draft.environment!==input.value)draft.business="";
    draft.environment=input.value;
    const environment=modal.querySelector("#scope-environment");
    if(environment)environment.textContent="环境 · "+(draft.environment||"请选择左侧环境");
    const business=modal.querySelector("#business");
    if(business){
      business.disabled=!draft.environment;
      business.innerHTML=options({"":"请选择业务",...filterOptions(businesses[draft.environment]||[])},draft.business);
    }
    updateSave();
  }
  if(draft&&input.id==="business"){draft.business=input.value;updateSave()}
  if(draft&&input.dataset.group){
    const selected=new Set(draft.groups);
    if(input.checked)selected.add(input.dataset.group);else selected.delete(input.dataset.group);
    draft.groups=[...selected];
    renderPreview();updateSave();
  }
  if(input.dataset.filter){
    const name=input.dataset.filter;
    filters[name]=name==="days"?Number(input.value):input.value;
    if(name==="environment"&&filters.environment&&!businesses[filters.environment]?.includes(filters.business))filters.business="";
    render();screen.querySelector('[data-filter="'+name+'"]').focus();
  }
});
document.addEventListener("submit",event=>{
  event.preventDefault();
  if(event.target.id==="connect")testConnection();
});
modal.addEventListener("close",()=>{
  if(modal.open)return;
  modal.replaceChildren();draft=null;modalKind="";
});
render();
</script>
</body>
</html>
