function incidents(){const f=state.filters;return `${heading('INCIDENT WORKSPACE','故障事件','多源 Signal → 标准化 Event → 聚合 Incident；支持人工确认与故障生命周期管理。',btn('+ 创建人工故障',"openModal('newincident')",canEdit()?'primary':'') )}<div class="banner">聚合原则：先按指纹精确去重，再按资源依赖和时间窗口形成候选故障。时间相近不代表必然是同一次故障，误合并可人工拆分。</div><div class="card pad"><div class="filters"><input class="input" id="incident-search" placeholder="搜索故障、资源或编号" value="${esc(f.search)}" oninput="state.filters.search=this.value;refreshIncidentTable()"><select class="select" onchange="state.filters.env=this.value;refreshIncidentTable()">${['全部环境','生产环境','预发环境','测试环境'].map(x=>`<option ${f.env===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="state.filters.severity=this.value;refreshIncidentTable()">${['全部级别','P1','P2','P3'].map(x=>`<option ${f.severity===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="state.filters.status=this.value;refreshIncidentTable()">${['全部状态','待确认','处理中','已恢复','已关闭'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select>${btn('重置筛选',"resetFilters()")}</div><div id="incident-table">${incidentTable(incidentsFiltered())}</div><div id="incident-count" class="muted small" style="padding:13px 2px">共 ${incidentsFiltered().length} 条故障 · 演示数据</div></div>`}

const evidence=[{name:'Prometheus · API 请求延迟',type:'指标',time:'10:04',summary:'订单接口 P99 延迟相较历史基线上升',raw:'query: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service="order-service"}[5m])) by (le))\ntime: 2026-11-20 10:04:00 +08:00\nsource: Prometheus [演示快照]\nresult: P99 从 180ms 升高至 1.6s（合成数据）'}, {name:'Zabbix · 数据库主机异常',type:'主机',time:'10:02',summary:'ecs-db-01 CPU 持续偏高，属于候选关联事件',raw:'zabbix_event_id: DEMO-78212\nhost: ecs-db-01\ntrigger: CPU utilization high\nvalue: 91%（合成数据）\nstatus: PROBLEM'}, {name:'K8sGPT · Pod Readiness 探针失败',type:'K8sGPT',time:'10:07',summary:'order-service 对应 Pod 探针失败',raw:'result: DEMO-K8SGPT-0091\nnamespace: prod-order\nresource: Pod/order-service-5bd7c9\nerror: Readiness probe failed\nexplanation: 应用请求或依赖异常时可能导致探针失败'}, {name:'VictoriaLogs · JDBC 连接超时',type:'日志',time:'10:05',summary:'应用出现 JDBC connection timeout 日志',raw:'2026-11-20 10:05:14 ERROR [order-service] HikariPool - Connection is not available, request timed out after 30000ms\nsource: VictoriaLogs [演示日志]'}, {name:'K8s Events · 探针失败',type:'事件',time:'10:08',summary:'Pod Event 多次出现 Unhealthy',raw:'reason: Unhealthy\ntype: Warning\nmessage: Readiness probe failed: HTTP probe returned statuscode 503\nsource: Kubernetes Events'}];
function evidenceMarkup(){return evidence.map((e,i)=>`<details class="evidence"><summary><span class="pill blue">${e.type}</span><div style="flex:1;min-width:0"><strong>${e.name}</strong><div class="muted small">${e.summary}</div></div><span class="muted tiny">${e.time}</span></summary><div class="econtent"><div class="small muted" style="margin-bottom:9px">来源：${e.name.split(' · ')[0]} · 只读查询 · 演示快照</div><div class="code">${esc(e.raw)}</div><div class="actions" style="margin-top:10px">${btn('复制证据',`copyEvidence(${i})`)}${btn('查看原始数据（演示）',`toast('原始系统跳转：此离线原型不连接外部平台')`)}</div></div></details>`).join('')}
function detail(){const x=current();return `${heading('INCIDENT DETAIL','故障详情',`${x.id} · ${x.platform} · ${x.resource}`,`${btn('← 故障列表',"go('incidents')")}${btn('AI 深度诊断 →',"go('rca')",'primary')}`)}<div class="card pad" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="font-size:19px;margin:0 0 9px">${x.title}</h2><div class="actions">${tag(x.sev)}${tag(x.state)}<span class="pill">${x.env}</span><span class="pill">${x.biz}</span></div></div><div class="actions">${btn('更新状态',"openModal('status')")}${btn('关联事件',"openModal('signals')")}</div></div><div class="summary"><span>责任组：<b>${x.owner}</b></span><span>首次发现：<b>${x.first}</b></span><span>最后更新：<b>${x.latest}</b></span><span>关联信号：<b>${x.signals}</b></span></div></div><div class="grid split"><div><div class="card pad" style="margin-bottom:16px"><div class="cardtitle"><strong>AI 分析摘要</strong><span class="pill orange">可信度：${x.confidence}</span></div><div style="font-size:17px;font-weight:700;margin-bottom:7px">${x.root}</div><div class="muted small">${x.desc} 这是一条基于演示数据生成的候选根因，仍需生产证据验证。</div><div class="actions" style="margin-top:14px">${btn('进入 RCA 工作台',"go('rca')",'primary')}${btn('查看业务拓扑',"go('topology')")}</div></div><div class="card pad"><div class="tabs"><button class="${state.detailTab==='evidence'?'active':''}" onclick="state.detailTab='evidence';render()">关联证据 (${x.signals})</button><button class="${state.detailTab==='timeline'?'active':''}" onclick="state.detailTab='timeline';render()">故障时间线</button><button class="${state.detailTab==='actions'?'active':''}" onclick="state.detailTab='actions';render()">处置建议</button></div>${state.detailTab==='evidence'?`<div class="banner">所有证据默认折叠。点击任一条展开原始数据、查询说明和来源信息。</div>${evidenceMarkup()}`:state.detailTab==='timeline'?timeline():steps()}</div></div><div><div class="card pad" style="margin-bottom:16px"><div class="cardtitle"><strong>故障影响面</strong><span class="pill orange">候选影响</span></div><div class="muted small">受影响业务</div><h3 style="margin:5px 0 11px">${x.biz}</h3><div class="listentry"><span class="dot"></span><div><b>${x.resource}</b><div class="muted small">主要异常对象 · ${x.platform}</div></div></div><div class="listentry"><span class="dot orange"></span><div><b>下游数据库 / 服务</b><div class="muted small">需验证真实依赖关系</div></div></div>${btn('打开关联拓扑 →',"go('topology')")}</div><div class="card pad"><div class="cardtitle"><strong>关联来源</strong><span class="muted small">${x.sources.length} 类</span></div>${x.sources.map(s=>`<div class="source-row"><span class="source-icon">◈</span><div class="source-body">${s}</div><span class="pill blue">已关联</span></div>`).join('')}</div></div></div>`}
function timeline(){return `<div class="timeline">${[['10:02','Zabbix','数据库主机出现 CPU 异常'],['10:04','Prometheus','订单接口 P99 延迟升高'],['10:05','VictoriaLogs','JDBC 连接超时日志出现'],['10:07','K8sGPT','Pod Readiness 探针失败'],['10:14','AI RCA','生成第一版候选根因']].map(x=>`<div class="timeitem"><time>${x[0]} · ${x[1]}</time><strong>${x[2]}</strong></div>`).join('')}</div>`}
function steps(){return `${[['01','验证连接池','检查 active / idle / pending、连接池最大连接数与超时参数'],['02','核查数据库','检查当前连接数、慢 SQL、锁等待与主机 CPU / IO'],['03','确认变更','核对故障前 30 分钟内发布、配置和云资源变更'],['04','执行前审批','如需重启 / 扩容 / 回滚，通过已有审批流程，不由 AI 直接执行']].map(x=>`<div class="step"><h4>${x[0]} · ${x[1]}</h4><p>${x[2]}</p></div>`).join('')}`}
function rca(){const x=current();return `${heading('AI ROOT CAUSE ANALYSIS','AI 根因分析工作台','基于关联证据生成候选原因、验证路径和可追溯的分析版本。',btn('返回故障详情',"go('detail')"))}<div class="grid split"><div><div class="card pad" style="margin-bottom:16px"><div class="cardtitle"><strong>分析任务</strong><span class="pill blue">${x.id}</span></div><div class="scorebox"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><strong>候选根因：${x.root}</strong><span class="pill orange">可信度 ${x.confidence}</span></div><p class="muted small">已结合指标、日志、K8sGPT、K8s Events 的模拟证据。缺少数据库真实连接统计，因此尚不能确认为最终根因。</p></div><h4 class="section-title">支持与反向证据</h4><div class="step"><h4>✓ 支持证据</h4><p>连接超时日志、请求 P99 延迟升高、Pod 探针失败有时间上的相关性。</p></div><div class="step"><h4>△ 仍需验证 / 可能的反证</h4><p>缺少数据库连接数和连接池活动数；需排除网络故障、DNS 异常与数据库锁等待。</p></div><h4 class="section-title" style="margin-top:20px">建议执行的只读检查</h4>${steps()}</div><div class="card pad"><div class="cardtitle"><strong>诊断版本记录</strong><span class="pill">${state.history.length} 版</span></div>${state.history.map(h=>`<div class="listentry"><span class="dot ${h.v===state.runVersion?'green':''}"></span><div><b>V${h.v}</b> <span class="muted small">${h.time}</span><div class="muted small">${esc(h.text)}</div></div></div>`).join('')}</div></div><div><div class="card pad" style="margin-bottom:16px"><div class="cardtitle"><strong>补充观察与 AI 复核</strong><span class="pill purple">人工反馈</span></div><div class="muted small" style="margin-bottom:10px">补充现场信息后重新复核；输入不会因模拟超时而丢失。</div><textarea class="textarea" id="rca-input" placeholder="例如：故障前 10 分钟发布了连接池配置；数据库监控显示连接数满..." oninput="state.rcaInput=this.value">${esc(state.rcaInput)}</textarea><div class="actions" style="margin-top:12px"><button class="btn primary" ${state.runStatus==='running'?'disabled':''} onclick="runRca()">✧ ${state.runStatus==='running'?'复核中…':'开始 AI 复核'}</button>${state.runStatus==='running'?btn('取消任务',"cancelRca()"):' '}${btn('模拟模型超时',"simulateTimeout()")}</div>${state.runStatus==='running'?`<div style="margin-top:15px"><div class="muted small">异步任务执行中 · ${state.runProgress}%</div><div class="progress" style="margin-top:7px"><span style="width:${state.runProgress}%"></span></div></div>`:state.runStatus==='timeout'?'<div class="banner warn" style="margin-top:13px">模型响应超时。补充内容已保留，可重新复核。此处模拟任务状态，不会丢失输入。</div>':state.runStatus==='complete'?'<div class="banner good" style="margin-top:13px">复核已完成，并生成新的诊断版本。结果为模拟数据。</div>':''}</div><div class="card pad"><div class="cardtitle"><strong>诊断治理约束</strong></div><div class="source-row"><div class="source-body">原始数据访问</div><span class="pill blue">按 RBAC 授权</span></div><div class="source-row"><div class="source-body">证据查询操作</div><span class="pill green">只读</span></div><div class="source-row"><div class="source-body">AI 自动修复</div><span class="pill red">默认禁用</span></div><div class="source-row"><div class="source-body">输入内容存储</div><span class="pill">按诊断版本</span></div><div class="banner" style="margin-top:12px;margin-bottom:0">页面操作不发起真实模型调用；后续实现通过异步 Job、幂等重试和审计记录保障可靠性。</div></div></div></div>`}
let rcaTimer;
function runRca(){if(state.runStatus==='running')return;state.runStatus='running';state.runProgress=5;render();clearInterval(rcaTimer);rcaTimer=setInterval(()=>{if(state.runStatus!=='running'){clearInterval(rcaTimer);return}state.runProgress+=24;if(state.runProgress>=100){clearInterval(rcaTimer);state.runStatus='complete';state.runVersion++;state.history.unshift({v:state.runVersion,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text:'结合补充观察的模拟复核 · 仍需验证数据库连接状态'});render();toast('模拟复核完成，已生成新版本')}else{const p=$('.progress span');if(p)p.style.width=state.runProgress+'%';const t=$('.progress')?.previousElementSibling;if(t)t.textContent=`异步任务执行中 · ${state.runProgress}%`}},650)}
function cancelRca(){clearInterval(rcaTimer);state.runStatus='idle';render();toast('复核任务已取消，补充内容保留')}
function simulateTimeout(){clearInterval(rcaTimer);state.runStatus='timeout';render();toast('已模拟模型超时：输入内容保留，可重试')}

人工确认业务影响</div></div></div><div class="listentry"><span class="dot orange"></span><div><b>数据库依赖</b><div class="muted small">候选链路 · 当前未核实全部上游</div></div></div><div class="listentry"><span class="dot green"></span><div><b>Redis 缓存</b><div class="muted small">暂无关联异常，不等于无风险</div></div></div></div></div></div>`}
function selectNode(n){state.selectedNode=n;render()}
function datasources(){return `${heading('DATA CONNECTORS','数据源管理','配置监控、日志、Kubernetes 与多云资源的只读接入；状态为原型演示，不代表真实连接。',btn('+ 添加数据源',"openModal('source')",'primary'))}<div class="banner">推荐部署时使用凭据引用 / K8s Secret 管理敏感字段。连接测试和权限验证必须在服务端执行，浏览器不保存真实 Token。</div><div class="grid kpis">${[['连接器类型',7],['演示已连接',state.sources.filter(s=>s.status==='已连接').length],['演示待配置',state.sources.filter(s=>s.status!=='已连接').length],['只读采集模式','默认']].map(x=>`<div class="card kpi"><div class="muted small">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div><div class="card pad"><div class="cardtitle"><strong>连接器配置</strong><span class="muted small">禁用连接器不会删除历史诊断</span></div>${state.sources.map(s=>`<div class="source-row"><div class="source-icon">${s.id==='prom'?'◉':s.id==='zabbix'?'▥':s.id==='k8sgpt'?'✧':s.id==='k8s'?'☸':'▣'}</div><div class="source-body"><strong>${s.name}</strong><div class="muted small">${s.type} · ${s.scope} · ${s.mode}</div></div>${tag(s.status)}<label class="switch" title="启用或停用"><input type="checkbox" ${s.enabled?'checked':''} ${!canEdit()?'disabled':''} onchange="toggleSource('${s.id}',this.checked)"><span></span></label>${btn('测试',`testSource('${s.id}')`)}${btn('配置',`editSource('${s.id}')`)}</div>`).join('')}</div>`}
function toggleSource(id,v){const s=state.sources.find(s=>s.id===id);if(!canEdit()){toast('只读用户无数据源配置权限');render();return} s.enabled=v;render();toast(`${s.name} 已${v?'启用':'停用'}（仅原型内生效）`)}
function testSource(id){const s=state.sources.find(s=>s.id===id);toast(`${s.name}：模拟连通性检查。离线原型不会访问真实 API。`)}
function editSource(id){state.sourceDraft=id;openModal('source')}
function policies(){return `${heading('DIAGNOSTIC POLICIES','诊断策略','按故障类型编排证据采集、关联分析、AI 复核和执行边界。',btn('+ 新建诊断策略',"openModal('policy')",'primary'))}<div class="banner">推荐使用“规则先行、AI 辅助”的诊断模式。默认只执行只读操作；修复、重启、扩缩容或回滚必须走现有审批与授权流程。</div><div class="card pad"><div class="tablewrap"><table class="table"><thead><tr><th>策略名称</th><th>触发源</th><th>适用范围</th><th>证据模板</th><th>自动触发</th><th>操作</th></tr></thead><tbody>${state.policies.map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="muted tiny">POL-${String(p.id).padStart(3,'0')}</div></td><td>${esc(p.trigger)}</td><td>${esc(p.scope)}</td><td>${esc(p.template)}</td><td><label class="switch"><input type="checkbox" ${p.auto?'checked':''} ${!canEdit()?'disabled':''} onchange="togglePolicy(${p.id},this.checked)"><span></span></label></td><td>${btn('编辑',`editPolicy(${p.id})`)}</td></tr>`).join('')}</tbody></table></div></div><div class="grid split-even" style="margin-top:16px"><div class="card pad"><h3 class="section-title">诊断任务预算</h3><div class="source-row"><div class="source-body">单任务超时</div><b>180 秒 · 建议值</b></div><div class="source-row"><div class="source-body">最大并发任务</div><b>5 · 建议值</b></div><div class="source-row"><div class="source-body">失败重试</div><b>指数退避 · 2 次</b></div></div><div class="card pad"><h3 class="section-title">安全与审计</h3><div class="source-row"><div class="source-body">采集凭据</div><span class="pill green">最小权限</span></div><div class="source-row"><div class="source-body">敏感日志</div><span class="pill blue">脱敏后使用</span></div><div class="source-row"><div class="source-body">自动处置</div><span class="pill red">禁用</span></div></div></div>`}
function togglePolicy(id,v){const p=state.policies.find(x=>x.id===id);if(!canEdit()){toast('只读用户无策略修改权限');render();return}p.auto=v;render();toast(`策略「${p.name}」已${v?'启用':'停用'}自动触发（仅演示）`)}
function editPolicy(id){state.editPolicyId=id;openModal('policy')}
function openModal(t){state.modal=t;render()}
function closeModal(){state.modal=null;render()}
function modalMarkup(){let m=state.modal;let body='';let title='';if(m==='status'){const x=current();title='更新故障状态';body=`<div class="formfield"><label>故障：${x.id}</label><select class="select" id="new-state">${['待确认','处理中','已恢复','已关闭'].map(v=>`<option ${v===x.state?'selected':''}>${v}</option>`).join('')}</select></div><div class="formfield" style="margin-top:13px"><label>处理备注</label><textarea class="textarea" id="state-note" placeholder="输入更新原因（演示记录）"></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:17px">${btn('取消',"closeModal()")}${btn('保存状态',"saveStatus()",'primary')}</div>`}
else if(m==='signals'){title='关联事件（演示）';body=`<div class="muted small" style="margin-bottom:12px">来源、原始信号和候选关联关系。当前支持查看，不执行真实跨源合并。</div>${evidence.map((e,i)=>`<div class="source-row"><input class="check" type="checkbox" checked onchange="toast('模拟选择：实际合并/拆分需要审计与后端幂等接口')"><div class="source-body"><strong>${e.name}</strong><div class="muted small">${e.summary}</div></div><span class="pill blue">候选关联</span></div>`).join('')}${btn('关闭',"closeModal()")}`}
else if(m==='source'){const s=state.sources.find(x=>x.id===state.sourceDraft);title=s?`编辑连接器 · ${s.name}`:'添加数据源';body=`<div class="formgrid"><div class="formfield"><label>数据源类型</label><select class="select" id="src-type" ${s?'disabled':''}>${['K8sGPT','Prometheus / Alertmanager','Zabbix','Kubernetes API','VictoriaLogs','阿里云资源','腾讯云资源'].map(x=>`<option ${s?.name===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formfield"><label>配置名称</label><input class="input" id="src-name" value="${esc(s?.name||'新数据源')}" /></div><div class="formfield"><label>API URL（演示字段）</label><input class="input" placeholder="https://monitor.example.com" id="src-url" /></div><div class="formfield"><label>认证模式</label><select class="select"><option>凭据引用 / Secret（推荐）</option><option>服务账号 / IAM Role</option></select></div></div><div class="banner warn" style="margin-top:15px">安全说明：这只是 UI 设计。不会采集或保存真实密钥，亦不会进行网络测试。</div><div class="actions" style="justify-content:flex-end">${btn('取消',"closeModal()")}${btn('模拟连接测试',"toast('模拟连接测试已触发；未请求真实 API')")}${btn('保存配置',"saveSource()",'primary')}</div>`}
else if(m==='policy'){const p=state.policies.find(x=>x.id===state.editPolicyId);title=p?'编辑诊断策略':'新建诊断策略';body=`<div class="formgrid"><div class="formfield"><label>策略名称</label><input class="input" id="policy-name" value="${esc(p?.name||'')}" placeholder="例如：ECS 主机异常诊断" /></div><div class="formfield"><label>适用环境</label><select class="select" id="policy-scope"><option ${p?.scope==='生产环境'?'selected':''}>生产环境</option><option>全部环境</option><option>所有 K8s 集群</option><option>ECS / CVM / 物理机</option></select></div><div class="formfield"><label>触发源</label><select class="select" id="policy-trigger"><option>Prometheus / Alertmanager</option><option>Zabbix</option><option>K8sGPT / K8s Events</option><option>已关联故障</option></select></div><div class="formfield"><label>证据模板</label><select class="select" id="policy-template"><option>指标 + 日志 + 事件</option><option>Pod / OOM / 容器日志</option><option>CPU / 内存 / IO</option><option>延迟 / 5xx / 上游</option></select></div></div><div class="banner" style="margin-top:15px">安全模式：仅只读证据收集 + AI 诊断。实际权限控制由服务端 RBAC 与审计系统承担。</div><div class="actions" style="justify-content:flex-end">${btn('取消',"closeModal()")}${btn('保存策略',"savePolicy()",'primary')}</div>`}
else if(m==='newincident'){title='创建人工故障';body=`<div class="formfield"><label>故障标题</label><input class="input" id="manual-title" placeholder="输入故障标题"></div><div class="formgrid" style="margin-top:12px"><div class="formfield"><label>级别</label><select class="select" id="manual-sev"><option>P1</option><option selected>P2</option><option>P3</option></select></div><div class="formfield"><label>环境</label><select class="select" id="manual-env"><option>生产环境</option><option>测试环境</option><option>预发环境</option></select></div></div><div class="actions" style="margin-top:18px;justify-content:flex-end">${btn('取消',"closeModal()")}${btn('创建故障',"createIncident()",'primary')}</div>`}
return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function saveStatus(){if(!canEdit()){toast('当前角色没有故障状态更新权限');return}const s=$('#new-state').value;current().state=s;closeModal();toast(`故障状态已更新为「${s}」（原型本地状态）`)}
function saveSource(){if(!canEdit()){toast('没有数据源管理权限');return}const name=$('#src-name').value.trim();if(!name){toast('请输入配置名称');return}const s=state.sources.find(x=>x.id===state.sourceDraft);if(s){s.name=name;s.status='待配置'}else state.sources.push({id:'source'+Date.now(),name,type:'自定义数据源',scope:'未配置',status:'待配置',mode:'待配置',enabled:false});state.sourceDraft=null;closeModal();toast('数据源草稿已保存（仅本地演示）')}
function savePolicy(){if(!canEdit()){toast('没有策略管理权限');return}const name=$('#policy-name').value.trim();if(!name){toast('策略名称不能为空');return}const p=state.policies.find(x=>x.id===state.editPolicyId);const data={name,scope:$('#policy-scope').value,trigger:$('#policy-trigger').value,template:$('#policy-template').value};if(p)Object.assign(p,data);else state.policies.push({id:Date.now(),...data,auto:false});state.editPolicyId=null;closeModal();toast('诊断策略草稿已保存（仅本地演示）')}
function createIncident(){if(!canEdit()){toast('无人工故障创建权限');return}const title=$('#manual-title').value.trim();if(!title){toast('请输入故障标题');return}const id='INC-DEMO-'+String(Date.now()).slice(-5);state.incidents.unshift({id,title,sev:$('#manual-sev').value,state:'待确认',env:$('#manual-env').value,biz:'未指定',platform:'人工录入',resource:'待关联',signals:0,first:'刚刚',latest:'刚刚',owner:'未分配',root:'未诊断',confidence:'证据不足',desc:'待补充关联证据',sources:[]});closeModal();toast('人工故障已创建（仅本地演示）')}
function copyEvidence(i){const text=evidence[i].raw;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制证据')).catch(()=>toast('浏览器拒绝访问剪贴板'));else toast('当前环境不支持剪贴板')}
function toggleMenu(){$('.side')?.classList.toggle('open');$('.overlay-drawer')?.classList.toggle('open')}
const pages={overview,incidents,detail,rca,topology,datasources,policies};render();
</script></body></html>
