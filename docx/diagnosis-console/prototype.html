<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17243b">
  <title>诊断控制台 · 交互原型</title>
  <style>
    :root { color-scheme: light; font: 15px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif; color: #17243b; background: #edf1f7; --border: #d4deec; --blue: #2749a2; --muted: #536680; --critical: #a4243c; --warning: #8a510c; --info: #15645f; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    a { color: var(--blue); }
    a:hover { color: #152e72; text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid #3466d5; outline-offset: 3px; }
    button, select { font: inherit; touch-action: manipulation; }
    button { cursor: pointer; }
    .skip { position: absolute; inset: .5rem auto auto .5rem; padding: .6rem 1rem; background: white; z-index: 4; transform: translateY(-160%); }
    .skip:focus { transform: none; }
    .topbar { min-height: 50px; display: flex; align-items: center; padding: .5rem clamp(.85rem, 3vw, 3rem); background: #17243b; color: white; font-weight: 700; }
    main { max-width: 1450px; margin: auto; padding: clamp(.85rem, 3vw, 3rem); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; text-wrap: balance; margin: .25rem 0 1.2rem; scroll-margin-top: 1rem; }
    h2 { font-size: 1.05rem; text-wrap: balance; }
    .panel { background: white; border: 1px solid var(--border); border-radius: 9px; }
    .filters { padding: .95rem clamp(.85rem, 1.45vw, 1.35rem) 1.2rem; }
    fieldset { border: 0; margin: 0; min-width: 0; padding: 0; }
    fieldset + fieldset { border-top: 1px solid var(--border); margin-top: .95rem; padding-top: .75rem; }
    legend { float: left; width: 100%; margin-bottom: .35rem; padding: 0; font-weight: 750; }
    .controls { clear: both; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; align-items: end; }
    label { display: grid; gap: .25rem; min-width: 0; font-size: .88rem; color: var(--muted); }
    select, .action { background: white; border: 1px solid #8699b9; border-radius: 6px; color: #17243b; min-height: 43px; padding: .45rem .65rem; max-width: 100%; }
    select:hover, .action:hover { border-color: var(--blue); background: #f5f7ff; }
    .action { justify-self: end; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 1rem 0; }
    .metric { --tone: var(--blue); position: relative; min-width: 0; border-top: 3px solid var(--tone); border-right: 1px solid var(--border); padding: .5rem 1rem .65rem; }
    .metric:last-child { border-right: 0; }
    .metric:first-child { border-top-left-radius: 8px; }
    .metric:last-child { border-top-right-radius: 8px; }
    .critical { --tone: var(--critical); --tag: #fce9ed; }
    .warning { --tone: var(--warning); --tag: #fcf0d9; }
    .info { --tone: var(--info); --tag: #e3f3ef; }
    .metric-label, .help { font-size: .9rem; color: #425772; min-height: 36px; display: inline-flex; align-items: center; }
    .help { gap: .4rem; background: none; border: 0; border-radius: 5px; padding: 0 .4rem 0 0; }
    .help:hover, .help[aria-expanded="true"] { color: #17243b; background: #edf2fb; }
    .help-icon { display: inline-grid; place-items: center; width: 1.07rem; height: 1.07rem; border: 1px solid currentColor; border-radius: 50%; font-size: .72rem; font-weight: 700; line-height: 1; }
    .metric output { display: block; font-size: 1.85rem; line-height: 1.2; font-weight: 750; color: var(--tone); font-variant-numeric: tabular-nums; }
    .tooltip { position: absolute; z-index: 2; inset: calc(100% - .1rem) auto auto .65rem; width: min(19rem, calc(100vw - 2rem)); padding: .75rem .85rem; border-radius: 8px; background: #17243b; color: white; box-shadow: 0 8px 18px #17243b24; font-size: .89rem; }
    .metric:last-child .tooltip { inset-inline: auto .65rem; }
    .results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, .27fr); align-items: start; gap: 1rem; }
    .result-heading { padding: .9rem 1rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 690px; border-collapse: collapse; text-align: left; font-size: .9rem; }
    th, td { border-top: 1px solid var(--border); padding: .72rem .95rem; vertical-align: top; }
    th { background: #f2f5fa; white-space: nowrap; color: #3b506b; font-weight: 650; }
    td { overflow-wrap: anywhere; }
    td:first-child, td:last-child { white-space: nowrap; }
    td:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    td a { font-weight: 650; }
    .badge { display: inline-block; padding: .13rem .48rem; border-radius: 4px; color: var(--tone); background: var(--tag); font-size: .82rem; font-weight: 650; }
    .distribution { padding: .85rem 1rem; }
    .distribution section + section { border-top: 1px solid var(--border); padding-top: .75rem; margin-top: .75rem; }
    dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem 1rem; margin: .65rem 0 0; }
    dt { overflow-wrap: anywhere; color: var(--muted); }
    dd { margin: 0; font-weight: 650; }
    .pagination { display: flex; justify-content: end; gap: 1rem; padding: .7rem 1rem; border-top: 1px solid var(--border); }
    .empty { margin: 0 .9rem .9rem; padding: .85rem; background: #f2f5fa; border-radius: 6px; }
    .details { padding: clamp(1rem, 3vw, 2rem); }
    .details h1 { margin-top: .9rem; }
    .details dl { grid-template-columns: 7rem minmax(0, 1fr); }
    .details p { margin-top: .8rem; }
    @media (max-width: 900px) { .results { grid-template-columns: minmax(0, 1fr); } .distribution { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 1rem; } .distribution section + section { border: 0; padding: 0; margin: 0; } }
    @media (max-width: 680px) { .controls, .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } .metric { padding-inline: .6rem; } .metric:first-child, .metric:last-child { border-radius: 0; } .metric:nth-child(2) { border-right: 0; } .metric:nth-child(even) .tooltip { inset-inline: auto .2rem; } .metric:nth-child(odd) .tooltip { inset-inline: .2rem auto; } .tooltip { width: min(19rem, calc(100vw - 2.3rem)); } }
  </style>
</head>
<body>
  <a class="skip" href="#content">跳到主要内容</a>
  <header class="topbar" translate="no">kube-aiops</header>
  <main id="content" tabindex="-1">
    <section id="overview" aria-labelledby="page-title">
      <h1 id="page-title">诊断控制台</h1>
      <form class="panel filters" id="filters">
        <fieldset>
          <legend>集群范围</legend>
          <div class="controls">
            <label>环境<select name="environment"></select></label>
            <label>业务<select name="business"></select></label>
            <label>集群名称<select name="group"></select></label>
            <label>集群实例<select name="cluster"></select></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>结果筛选</legend>
          <div class="controls">
            <label>命名空间<select name="namespace"></select></label>
            <label>严重级别<select name="severity"></select></label>
            <label>资源类型<select name="kind"></select></label>
            <button class="action" id="clear" type="button">清除筛选</button>
          </div>
        </fieldset>
      </form>
      <section class="summary panel" aria-label="诊断结果汇总">
        <div class="metric"><span class="metric-label">总数</span><output id="total" aria-label="诊断总数"></output></div>
        <div class="metric critical">
          <button class="help" type="button" aria-label="严重级别说明" aria-describedby="help-critical" aria-expanded="false">严重 <span class="help-icon" aria-hidden="true">?</span></button>
          <div id="help-critical" class="tooltip" role="tooltip" hidden>关键服务已中断或主要功能受明显影响，应优先排查。例如关键工作负载无可用副本。</div>
          <output id="critical" aria-label="严重诊断数"></output>
        </div>
        <div class="metric warning">
          <button class="help" type="button" aria-label="警告级别说明" aria-describedby="help-warning" aria-expanded="false">警告 <span class="help-icon" aria-hidden="true">?</span></button>
          <div id="help-warning" class="tooltip" role="tooltip" hidden>服务仍可提供，但出现降级或存在故障风险，应安排排查。例如副本数下降或工作负载反复重启。</div>
          <output id="warning" aria-label="警告诊断数"></output>
        </div>
        <div class="metric info">
          <button class="help" type="button" aria-label="信息级别说明" aria-describedby="help-info" aria-expanded="false">信息 <span class="help-icon" aria-hidden="true">?</span></button>
          <div id="help-info" class="tooltip" role="tooltip" hidden>可关注的现象或优化建议，暂未观察到直接服务影响。例如资源配置优化建议。</div>
          <output id="info" aria-label="信息诊断数"></output>
        </div>
      </section>
      <div class="results">
        <section class="panel" aria-labelledby="results-title">
          <h2 class="result-heading" id="results-title" aria-live="polite"></h2>
          <p class="empty" id="empty" hidden></p>
          <div class="table-wrap" id="table-region" role="region" aria-labelledby="results-title" tabindex="0">
            <table>
              <thead><tr><th scope="col">严重级别</th><th scope="col">问题</th><th scope="col">资源</th><th scope="col">命名空间</th><th scope="col">集群实例</th><th scope="col">发现时间</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <nav class="pagination" id="pagination" aria-label="诊断结果分页" hidden>
            <a id="first">返回首页</a><a id="next">下一页</a>
          </nav>
        </section>
        <aside class="panel distribution" aria-label="诊断结果分布">
          <section><h2>按资源类型</h2><dl id="by-kind"></dl><p id="no-kind" hidden>暂无数据</p></section>
          <section><h2>按命名空间</h2><dl id="by-namespace"></dl><p id="no-namespace" hidden>暂无数据</p></section>
        </aside>
      </div>
    </section>
    <section class="panel details" id="details" aria-labelledby="detail-title" hidden>
      <a id="back" href="#/findings">返回诊断列表</a>
      <h1 id="detail-title" tabindex="-1"></h1>
      <dl id="detail-fields"></dl>
    </section>
  </main>
  <script>
    "use strict";

    const instances = [
      { id: "prod-east", environment: "生产", business: "交易", group: "生产-K8S集群" },
      { id: "prod-west", environment: "生产", business: "交易", group: "生产-K8S集群" },
      { id: "test-k8s", environment: "测试", business: "全局", group: "测试-K8S集群" },
      { id: "local", environment: "测试", business: "全局", group: "本地-K8S集群" },
    ];
    const findings = [
      { id: "endpoints", cluster: "prod-east", severity: "critical", problem: "结算服务没有可用端点", kind: "Service", resource: "checkout-api", namespace: "checkout", time: "2026-11-19T02:57:48Z" },
      { id: "endpoints", cluster: "test-k8s", severity: "warning", problem: "买家服务部分端点未就绪", kind: "Service", resource: "buyer-api", namespace: "test-base", time: "2026-11-19T02:57:48Z" },
      { id: "probe", cluster: "test-k8s", severity: "warning", problem: "买家服务启动探针失败", kind: "Pod", resource: "buyer-api-57ff664c4c-zk8lc", namespace: "test-base", time: "2026-11-19T02:54:00Z" },
      { id: "restart", cluster: "prod-west", severity: "warning", problem: "结算服务副本频繁重启", kind: "Pod", resource: "checkout-api-7c846k", namespace: "checkout", time: "2026-11-19T02:41:00Z" },
      { id: "quota", cluster: "prod-east", severity: "info", problem: "建议评估队列工作负载的 CPU 请求值", kind: "Deployment", resource: "settlement-worker", namespace: "settlement", time: "2026-11-19T02:33:00Z" },
      { id: "volume", cluster: "local", severity: "info", problem: "临时卷已绑定，建议确认存储类型", kind: "PersistentVolumeClaim", resource: "artifacts", namespace: "k8sgpt-demo", time: "2026-11-19T02:15:00Z" },
    ];
    const severityLabels = { critical: "严重", warning: "警告", info: "信息" };
    const ranges = ["environment", "business", "group", "cluster"];
    const rangeLabels = { environment: "全部环境（ALL）", business: "全部业务", group: "全部集群名称", cluster: "全部集群实例" };
    const resultFilters = ["namespace", "severity", "kind"];
    const pageSize = 4;
    const formatDate = new Intl.DateTimeFormat("zh-CN", { dateStyle: "short", timeStyle: "medium", timeZone: "Asia/Shanghai" });
    const find = (id) => document.getElementById(id);
    const controls = find("filters").elements;
    let listHash = "#/findings";

    /** 保持筛选器和页码可以通过 URL 恢复。 */
    function listingUrl(params) {
      return "#/findings" + (params.size ? "?" + params : "");
    }
    function currentQuery() {
      return new URLSearchParams(location.hash.split("?")[1]);
    }
    function setOptions(control, all, choices, selected) {
      const values = [...new Set(choices)];
      control.replaceChildren(new Option(all, ""), ...values.map((value) => new Option(control.name === "severity" ? severityLabels[value] : value, value)));
      if (selected && !values.includes(selected)) control.add(new Option("不可用的选项", selected));
      control.value = selected || "";
    }
    function selectInstances(params, updateControls = false) {
      let candidates = instances;
      const instance = instances.find((item) => item.id === params.get("cluster"));
      for (const field of ranges) {
        const key = field === "cluster" ? "id" : field;
        const requested = params.get(field);
        const value = field === "cluster" && requested === "*" ? "" : requested || instance?.[key];
        if (updateControls) setOptions(controls[field], rangeLabels[field], candidates.map((item) => item[key]), value);
        if (value) candidates = candidates.filter((item) => item[key] === value);
      }
      return candidates;
    }
    function renderCounts(items, key, target) {
      const totals = new Map();
      for (const item of items) totals.set(item[key], (totals.get(item[key]) || 0) + 1);
      const entries = [...totals].sort((a, b) => b[1] - a[1]);
      find("by-" + target).replaceChildren(...entries.flatMap(([label, total]) => {
        const term = document.createElement("dt");
        const value = document.createElement("dd");
        term.textContent = label;
        value.textContent = total;
        return [term, value];
      }));
      find("no-" + target).hidden = entries.length > 0;
    }
    function renderRow(record) {
      const row = document.createElement("tr");
      const level = document.createElement("span");
      level.className = "badge " + record.severity;
      level.textContent = severityLabels[record.severity];
      row.insertCell().append(level);
      const link = document.createElement("a");
      link.href = "#/findings/" + encodeURIComponent(record.id) + (record.cluster === "local" ? "" : "?cluster=" + encodeURIComponent(record.cluster));
      link.textContent = record.problem;
      row.insertCell().append(link);
      for (const text of [record.kind + "/" + record.resource, record.namespace, record.cluster, formatDate.format(new Date(record.time))]) {
        row.insertCell().textContent = text;
      }
      return row;
    }
    function renderList(params) {
      const scope = new Set(selectInstances(params, true).map((item) => item.id));
      const scoped = findings.filter((item) => scope.has(item.cluster));
      for (const field of resultFilters) {
        const values = field === "severity" ? Object.keys(severityLabels) : scoped.map((item) => item[field]);
        setOptions(controls[field], "全部", values, params.get(field));
      }
      const matches = scoped.filter((item) => resultFilters.every((field) => !params.get(field) || params.get(field) === item[field]));
      const requestedPage = Number(params.get("page"));
      const lastPage = Math.max(1, Math.ceil(matches.length / pageSize));
      const page = Number.isInteger(requestedPage) && requestedPage > 1 ? Math.min(lastPage, requestedPage) : 1;
      const visible = matches.slice((page - 1) * pageSize, page * pageSize);
      find("total").value = matches.length;
      for (const key of Object.keys(severityLabels)) find(key).value = matches.filter((item) => item.severity === key).length;
      find("results-title").textContent = "共 " + matches.length + " 条诊断结果" + (lastPage > 1 ? "，本页 " + visible.length + " 条" : "");
      find("table-region").hidden = matches.length === 0;
      find("rows").replaceChildren(...visible.map(renderRow));
      find("empty").hidden = matches.length > 0;
      find("empty").textContent = scope.size ? "没有符合当前筛选条件的诊断结果。" : "当前范围无可访问的集群实例。请选择其他范围。";
      renderCounts(matches, "kind", "kind");
      renderCounts(matches, "namespace", "namespace");
      const next = new URLSearchParams(params);
      next.set("page", String(page + 1));
      const first = new URLSearchParams(params);
      first.delete("page");
      find("pagination").hidden = lastPage === 1;
      find("next").href = listingUrl(next);
      find("next").hidden = page >= lastPage;
      find("first").href = listingUrl(first);
      find("first").hidden = page === 1;
    }
    function renderDetail(id, cluster) {
      const record = findings.find((item) => item.id === id && item.cluster === cluster);
      find("back").href = listHash;
      find("detail-title").textContent = record?.problem || "未找到该诊断结果";
      find("detail-fields").replaceChildren();
      if (record) {
        const fields = { 严重级别: severityLabels[record.severity], 集群实例: cluster, 命名空间: record.namespace, 资源: record.kind + "/" + record.resource, 发现时间: formatDate.format(new Date(record.time)) };
        for (const [label, value] of Object.entries(fields)) {
          const term = document.createElement("dt");
          const detail = document.createElement("dd");
          term.textContent = label;
          detail.textContent = value;
          find("detail-fields").append(term, detail);
        }
      }
      find("detail-title").focus();
    }
    function renderRoute() {
      const path = location.hash.split("?")[0];
      const detail = path.startsWith("#/findings/");
      const params = currentQuery();
      find("overview").hidden = detail;
      find("details").hidden = !detail;
      if (detail) {
        renderDetail(path.slice("#/findings/".length), params.get("cluster") || "local");
        return;
      }
      listHash = listingUrl(params);
      renderList(params);
    }
    find("filters").addEventListener("change", (event) => {
      const name = event.target.name;
      const params = currentQuery();
      if (ranges.includes(name)) {
        for (const range of ranges) {
          if (controls[range].value) params.set(range, controls[range].value);
          else params.delete(range);
        }
      }
      if (event.target.value) params.set(name, event.target.value);
      else params.delete(name);
      if (ranges.includes(name)) {
        let candidates = instances;
        for (const range of ranges) {
          const key = range === "cluster" ? "id" : range;
          const value = params.get(range);
          if (!value) continue;
          const matching = candidates.filter((item) => item[key] === value);
          if (matching.length) candidates = matching;
          else params.delete(range);
        }
        const allowed = new Set(selectInstances(params).map((item) => item.id));
        for (const field of ["namespace", "kind"]) {
          if (params.has(field) && !findings.some((item) => allowed.has(item.cluster) && item[field] === params.get(field))) params.delete(field);
        }
      }
      params.delete("page");
      location.hash = listingUrl(params);
    });
    find("clear").addEventListener("click", () => {
      const params = currentQuery();
      for (const field of [...resultFilters, "page"]) params.delete(field);
      location.hash = listingUrl(params);
    });
    document.querySelector(".skip").addEventListener("click", (event) => {
      event.preventDefault();
      find("content").focus();
    });

    /** 保留触屏点按状态，并让鼠标移动到说明时继续显示。 */
    for (const button of document.querySelectorAll(".help")) {
      const tooltip = find(button.getAttribute("aria-describedby"));
      let isPinned = false;
      const setOpen = (isOpen) => {
        tooltip.hidden = !isOpen;
        button.setAttribute("aria-expanded", String(isOpen));
      };
      const close = () => {
        isPinned = false;
        setOpen(false);
      };
      button.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "mouse") setOpen(true);
      });
      button.parentElement.addEventListener("pointerleave", () => {
        if (!isPinned && !button.matches(":focus-visible")) setOpen(false);
      });
      button.addEventListener("focus", () => {
        if (button.matches(":focus-visible")) setOpen(true);
      });
      button.addEventListener("blur", close);
      button.addEventListener("click", () => {
        isPinned = !isPinned;
        setOpen(isPinned);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") close();
      });
      document.addEventListener("click", (event) => {
        if (!button.parentElement.contains(event.target)) close();
      });
    }
    window.addEventListener("hashchange", renderRoute);
    renderRoute();
  </script>
</body>
</html>
