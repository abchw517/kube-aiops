<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运维知识库 · kube-aiops</title>
<style>
:root{color-scheme:light;--ink:#14283b;--muted:#526679;--line:#d8e2eb;--canvas:#eff4f8;--surface:#fff;--nav:#112536;--nav-active:#1d4356;--teal:#00786c;--mint:#a9e9d7;--blue:#234cc4;--blue-light:#edf3ff;--amber:#795116;--amber-bg:#fff3d8;--red:#9e2744;font:15px/1.55 "Inter","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas)}[hidden]{display:none!important}
a{color:var(--blue);text-underline-offset:.2em}a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #2586ba;outline-offset:3px}
.top{min-height:62px;background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between;gap:.9rem;padding:.55rem 1.55rem}
.brand,.role,.row,.actions,.heading,.tabs,.facts,.pager{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
.brand{gap:.75rem;color:white;text-decoration:none;font-weight:750}.brand small{display:block;color:#a9c3d7;font-weight:500}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:9px;color:#0d3c3a;background:var(--mint)}
.role label{color:#d1e2ef;font-size:.81rem}.role select{padding:.33rem .55rem;border-radius:6px;background:#213e51;border:1px solid #638097;color:#fff;min-height:34px}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100dvh - 62px)}
nav.sidebar{background:var(--nav);padding:1.1rem .85rem;color:#d3e5f0}
.sidebar a{display:block;text-decoration:none;color:inherit;padding:.68rem .8rem;border-radius:6px;font-size:.92rem;border-inline-start:3px solid transparent}
.sidebar a[aria-current="page"]{background:var(--nav-active);color:white;border-color:#59d6c6;font-weight:720}
.sidebar a:hover{background:#1a374b}.sidebar .sub a{padding-inline-start:1.25rem;font-size:.85rem}.sub{margin:.75rem 0;padding-top:.55rem;border-top:1px solid #345064}
main{width:100%;min-width:0;max-width:1360px;margin:0 auto;padding:clamp(1rem,3.2vw,3.1rem)}
h1,h2,h3,p{margin:0}h1{font-size:clamp(1.6rem,3vw,2.35rem);line-height:1.16;letter-spacing:-.03em}h2{font-size:1.13rem}h3{font-size:.99rem}p+p{margin-top:.62rem}
.heading{justify-content:space-between;align-items:end;gap:1rem;margin-bottom:1.25rem}.heading p{margin-top:.42rem;max-width:64ch}.muted,.meta{color:var(--muted)}.meta{font-size:.85rem}.eyebrow{font-size:.8rem;color:var(--teal);font-weight:720;margin-bottom:.3rem}.crumb{display:inline-block;margin-bottom:.8rem;font-size:.87rem}
.panel{padding:1.15rem 1.3rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}.stack>*+*{margin-top:1rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.39fr);gap:1rem;align-items:start}.cols.equal{grid-template-columns:repeat(2,minmax(0,1fr))}
.field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.full{grid-column:1/-1}
label{display:grid;gap:.32rem;font-size:.88rem;font-weight:650;color:#384f64;min-width:0}
input:not([type=checkbox]),select,textarea{min-width:0;width:100%;min-height:40px;border:1px solid #9dafc4;background:#fff;color:var(--ink);border-radius:6px;padding:.52rem .7rem}
textarea{resize:vertical}input[type=checkbox]{accent-color:var(--teal)}
.search{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}.search input{flex:1 1 230px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid #b3c4d9;border-radius:7px;background:#fff;color:#244369;padding:.44rem .76rem;text-decoration:none;font-weight:700;font-size:.89rem;text-align:center}
.btn:enabled:hover,a.btn:hover{background:var(--blue-light)}.btn.primary{color:white;background:var(--blue);border-color:var(--blue)}.btn.primary:enabled:hover,a.btn.primary:hover{background:#183da5}.btn.danger{color:var(--red);border-color:#dfb3bd}
.chip{display:inline-block;border-radius:5px;padding:.12rem .48rem;background:#ecf2f8;color:#345271;font-size:.75rem;font-weight:720;white-space:nowrap}.chip.good{background:#e1f5ef;color:#126352}.chip.warn{background:var(--amber-bg);color:var(--amber)}.chip.bad{background:#fae8ee;color:var(--red)}
.tag{border:1px solid var(--line);border-radius:6px;padding:.12rem .48rem;background:#f9fbfd;font: .79rem/1.4 ui-monospace,Consolas,monospace}
.result-list{list-style:none;margin:.3rem 0 0;padding:0}.result{padding:1.03rem 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result h3{font-size:1.05rem}.result h3 a{text-decoration:none}.result h3 a:hover{text-decoration:underline}.result .meta{margin-top:.33rem}.result .row+.meta{margin-top:.45rem}
.summary{border-inline-start:4px solid var(--teal);background:#f1faf7;padding:.85rem 1rem;border-radius:7px}.notice{padding:.79rem .91rem;border-radius:7px;background:#edf4fb;color:#2d4e6b}.notice.warn{background:var(--amber-bg);color:var(--amber)}.notice.danger{background:#fae8ee;color:var(--red)}
.inset{background:#f7fafd;border:1px solid var(--line);border-radius:8px;padding:.85rem}.inset strong{display:block}
dl{margin:.6rem 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.45rem .9rem;font-size:.88rem}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
ol{padding-left:1.25rem;margin:.55rem 0}li+li{margin-top:.55rem}.result-list>li+li{margin-top:0}
.facts{gap:.45rem .8rem;margin-top:.6rem}.line{height:1px;background:var(--line);border:0;margin:1rem 0}
.tabs{gap:.15rem;border-bottom:1px solid var(--line);margin-bottom:.75rem}.tab{border:0;background:transparent;border-bottom:2px solid transparent;padding:.58rem .75rem;color:#365570;text-decoration:none;font-weight:650}.tab[aria-current="page"]{color:var(--teal);border-color:var(--teal)}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:.86rem}th,td{padding:.7rem .66rem;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f2f6fa;color:#465e75;font-weight:700;white-space:nowrap}td .btn{min-height:34px}td:first-child{min-width:160px}.pager{justify-content:flex-end;margin-top:.85rem}
dialog{border:1px solid var(--line);border-radius:12px;color:var(--ink);width:min(640px,calc(100% - 2rem));padding:1.3rem;max-height:85vh}dialog::backdrop{background:#0d24388c}dialog .actions{justify-content:flex-end}
.toast{position:fixed;inset:auto 1rem 1rem auto;max-width:min(420px,calc(100% - 2rem));background:#173a4b;color:white;border-radius:8px;padding:.7rem 1rem;z-index:4;box-shadow:0 5px 20px #10253b44}
.version-link{display:inline-block;margin:.3rem .6rem .2rem 0} .check{display:flex;align-items:center;gap:.5rem}.plain{white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;color:#31536e;font-weight:650}details[open] summary{margin-bottom:.65rem}#end{scroll-margin-top:1rem}
@media(max-width:980px){.shell{grid-template-columns:165px minmax(0,1fr)}.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media(max-width:670px){.shell{display:block}.top{padding:.6rem .85rem}.sidebar{display:flex;flex-wrap:wrap;gap:.2rem}.sidebar a{font-size:.83rem;padding:.42rem .55rem}.sidebar .sub{display:contents}.sidebar .sub a{padding-inline-start:.55rem}.brand small{display:none}.heading{align-items:start}.cols.equal,.form-grid{grid-template-columns:1fr}.panel{padding:.85rem}.role{gap:.3rem}.role label{font-size:.75rem}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/wiki"><span class="mark" aria-hidden="true">K</span><span>kube-aiops<small>Kubernetes 运维控制台</small></span></a>
  <div class="role"><label for="actor">演示身份</label><select id="actor"><option value="a">系统管理员 A</option><option value="b">系统管理员 B</option><option value="reader">测试 Wiki 读者</option><option value="guest">访客</option></select></div>
</header>
<div class="shell">
  <nav class="sidebar" aria-label="主导航">
    <a href="#/finding" data-nav="finding">诊断控制台</a>
    <a href="#/wiki" data-nav="wiki">运维知识库</a>
    <div class="sub" id="admin-nav">
      <a href="#/governance" data-nav="governance">知识治理</a>
      <a href="#/sources" data-nav="sources">导入与来源</a>
    </div>
  </nav>
  <main id="app" tabindex="-1" aria-label="控制台内容"></main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div id="toast" role="status" class="toast" hidden></div>
<script>
"use strict";

const app = document.querySelector("#app");
const dialog = document.querySelector("#dialog");
const actor = document.querySelector("#actor");
const toast = document.querySelector("#toast");
const kinds = ["排障手册", "故障复盘", "操作规程", "常见问题"];
const scopes = {
  test: { environment:"测试", business:"", label:"测试 / test-a / k8sgpt-demo" },
  prod: { environment:"生产", business:"运维", label:"生产 · 运维 / prod-a / platform" }
};
const templates = {
  排障手册: ["适用与排除条件","匹配信号","按序检查及预期","恢复验证","升级路径"],
  故障复盘: ["故障现象与影响","已核实证据","根因或待确认项","处置与恢复验证"],
  操作规程: ["前置条件与影响范围","操作步骤","停止条件与回滚","验收"],
  常见问题: ["问题","答案","适用条件与来源"]
};
const handbooks = [
  { id:"pvc", rev:2, type:"排障手册", title:"PVC Pending：StorageClass 缺失", resource:"PersistentVolumeClaim", team:"存储平台组", scopes:["test","prod"], applicable:"PVC 引用了一个找不到的 StorageClass；默认存储类缺失及供应器故障需分别判断。", tags:["PVC Pending","StorageClass","ProvisioningFailed","存储类缺失"], checked:"2026-11-19", state:"已发布", versionState:"生效中", body:["PVC 长时间 Pending，事件中出现存储类不存在。通用步骤适用于动态卷供应。","ProvisioningFailed · storageclass.storage.k8s.io not found","先核对 PVC 的 spec.storageClassName，再在当前集群核实是否有同名 StorageClass。名称不一致时回查部署模板渲染结果。","校验 PVC 进入 Bound，相关 Pod 挂载成功，且同一错误不再出现。","名称正确且同名类存在时，交由存储平台组检查 CSI 供应器与近期事件。"] },
  { id:"image", rev:1, type:"排障手册", title:"ImagePullBackOff：镜像拉取失败", resource:"Pod", team:"容器平台组", scopes:["test"], applicable:"事件包含 ImagePullBackOff 或 ErrImagePull。按状态码识别仓库访问、凭据或镜像标签问题。", tags:["ImagePullBackOff","ErrImagePull","镜像拉取失败","403"], checked:"2026-11-17", state:"已发布", versionState:"生效中", body:["Pod 容器启动前拉取镜像失败。","ImagePullBackOff · ErrImagePull","查看 Pod 事件及实际镜像路径，区分 401/403、镜像不存在及请求超时。","新 Pod 可以拉取镜像并进入 Ready。","仓库访问仍异常时升级给容器平台组。"] },
  { id:"probe", rev:1, type:"排障手册", title:"Pod 探针失败：区分启动与就绪", resource:"Pod", team:"应用可靠性组", scopes:["test"], applicable:"事件持续出现 Unhealthy；先确认探针类型、应用实际端点和是否影响服务。", tags:["Unhealthy","Readiness probe failed","探针失败"], checked:"2026-10-08", state:"已发布", versionState:"待复核", body:["Pod 处于重启或不就绪，事件持续出现 Unhealthy。","Unhealthy · Readiness probe failed","查看探针类型、端点与应用启动耗时，并核对 Ready 和重启次数。","Pod Ready 稳定，探针失败不再增长。","持续失败时关联应用日志，交由应用可靠性组。"] },
  { id:"case", rev:1, type:"故障复盘", title:"生产案例：部署模板引用了退役存储类", resource:"PersistentVolumeClaim", team:"存储平台组", scopes:["prod"], applicable:"同类症状历史案例，适用于核对部署模板变量。", tags:["PVC Pending","StorageClass","模板"], checked:"2026-11-18", state:"已发布", versionState:"生效中", body:["生产应用挂载卷失败。","事件显示目标存储类已退役。","部署模板保留了旧变量。","变更经审批处理，复查 PVC 已绑定。"] }
];
const oldPVC = { ...handbooks[0], rev:1, body:handbooks[0].body.map((step,i) => i===2 ? "核对 PVC 指定的存储类，并与集群中的配置比对。" : step) };
const drafts = [{
  id:"d-prod", knowledge:"pvc", rev:3, status:"待审核", owner:"a", type:"排障手册", title:"PVC Pending：StorageClass 缺失",
  resource:"PersistentVolumeClaim", team:"存储平台组", scopes:["test","prod"], applicable:handbooks[0].applicable, tags:handbooks[0].tags.join("、"),
  date:"2027-05-19", source:"值班复核 · 已核对部署模板", fields:handbooks[0].body.map((step,i) => i===2 ? step+" 核对渲染后的值与发布配置是否一致。" : step)
}];
const revisions = new Map([["pvc:1",oldPVC]]);
const links = new Map();
let savedReview = true;
let nextDraft = 1;
let syncRunning = false;
let sourceActive = true;
let syncResult = "";
let toastTimer;
function esc(value="") {
  return String(value).replace(/[&<>"']/g, (mark) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[mark]);
}
function admin(){ return actor.value==="a" || actor.value==="b"; }
function canRead(doc){ return admin() || (actor.value==="reader" && doc?.scopes.includes("test")); }
function active(doc){ return doc?.state==="已发布"; }
function visible(doc){ return active(doc) && canRead(doc); }
function getDoc(id){ return handbooks.find((doc)=>doc.id===id); }
function getDraft(id){ return drafts.find((item)=>item.id===id); }
function visibleScopes(doc){ return doc.scopes.filter((value)=> admin() || value==="test"); }
function scopeNames(values){ return values.map((value)=>scopes[value]?.label).filter(Boolean).join("；"); }
function button(text, action, style="", item="") {
  return '<button class="btn '+style+'" type="button" data-action="'+action+'" data-item="'+esc(item)+'">'+esc(text)+'</button>';
}
function anchor(text, href, style="") {return '<a class="btn '+style+'" href="'+esc(href)+'">'+esc(text)+'</a>';}
function pill(text, style=""){return '<span class="chip '+style+'">'+esc(text)+'</span>';}
function headline(name, description="", actions="", back=""){
  return (back ? '<a class="crumb" href="'+esc(back)+'">← 返回知识库</a>' : "")+
    '<header class="heading"><div><h1>'+esc(name)+'</h1>'+(description?'<p class="muted">'+esc(description)+'</p>':"")+'</div>'+
    (actions?'<div class="actions">'+actions+'</div>':"")+'</header>';
}
function say(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3500);}
function pickOptions(values,current=""){return values.map((value)=>'<option'+(value===current?' selected':'')+'>'+esc(value)+'</option>').join("");}
function empty(title,body="",action=""){return '<section class="panel stack"><h2>'+esc(title)+'</h2><p class="muted">'+esc(body)+'</p>'+action+'</section>';}
function overlay(title, html){
  dialog.innerHTML='<div class="stack"><h2 id="dialog-title">'+esc(title)+'</h2>'+html+'</div>';
  if(!dialog.open) dialog.showModal();
}
function result(doc, reason=""){
  const tag = reason || doc.tags[0];
  return '<li class="result"><div class="row"><h3><a href="#/wiki/'+esc(doc.id)+'">'+esc(doc.title)+'</a></h3>'+pill(doc.type)+
    pill(doc.versionState,doc.versionState==="待复核"?"warn":"good")+'</div><p class="meta">'+esc(doc.applicable)+'</p>'+
    '<div class="facts"><code class="tag">'+esc(tag)+'</code><span class="meta">最近复核 '+esc(doc.checked)+'</span></div></li>';
}
function getSearch(params){
  const q = (params.get("q") || "").trim().toLowerCase();
  return handbooks.filter(visible).map((doc)=>{
    const signal = doc.tags.find((tag)=>q && (tag.toLowerCase()===q || tag.toLowerCase().includes(q) || q.includes(tag.toLowerCase())));
    const scopesForUser = visibleScopes(doc).map((id)=>scopes[id]);
    const scopeMatches = scopesForUser.some((scope)=> (!params.get("env") || scope.environment===params.get("env")) && (!params.get("business") || scope.business===params.get("business")));
    const text = [doc.title,doc.resource,doc.applicable,...doc.body].join(" ").toLowerCase();
    const matches = scopeMatches && (!params.get("type") || doc.type===params.get("type")) && (!params.get("resource") || doc.resource===params.get("resource")) &&
      (!q || signal || text.includes(q));
    return { doc, matches, signal };
  }).filter((entry)=>entry.matches).sort((left,right)=>Number(Boolean(right.signal))-Number(Boolean(left.signal)) ||
    Number(left.doc.versionState==="待复核")-Number(right.doc.versionState==="待复核") || right.doc.checked.localeCompare(left.doc.checked) || left.doc.id.localeCompare(right.doc.id));
}
function home(params){
  if(actor.value==="guest") return headline("运维知识库")+empty("当前账号没有知识库读取权限","可返回诊断控制台。",anchor("返回诊断控制台","#/finding"));
  const all = getSearch(new URLSearchParams()).map(({doc})=>doc);
  const candidates = getSearch(params);
  const pageSize = 3;
  const lastPage = Math.max(1,Math.ceil(candidates.length/pageSize));
  const page = Math.max(1,Math.min(lastPage,Math.floor(Number(params.get("page")))||1));
  const pageHref = (i)=>{const next=new URLSearchParams(params);next.set("page",i);return "#/wiki?"+next;};
  const envs = [...new Set(all.flatMap((doc)=>visibleScopes(doc).map((id)=>scopes[id].environment)))];
  const businesses = [...new Set(all.flatMap((doc)=>visibleScopes(doc).map((id)=>scopes[id].business)).filter(Boolean))];
  const filter = (label,key,values)=>'<label>'+label+'<select name="'+key+'"><option value="">全部</option>'+pickOptions(values,params.get(key))+'</select></label>';
  return headline("运维知识库","查找适用于本次故障的手册、复盘和操作规程。",button("AI 知识问答","ask","",params.toString())+(admin()?anchor("新建知识","#/edit/new","primary"):""))+
    '<section class="panel"><form id="search-form" class="stack"><label for="query">搜索知识</label><div class="search"><input id="query" name="q" value="'+esc(params.get("q")||"")+'" placeholder="输入报错、事件 Reason 或故障症状"><button class="btn primary">搜索</button><a href="#/wiki" class="btn">重置</a></div>'+
    '<div class="field-grid">'+filter("环境","env",envs)+filter("业务线","business",businesses)+filter("资源类型","resource",[...new Set(all.map((doc)=>doc.resource))])+filter("知识类型","type",kinds.filter((type)=>all.some((doc)=>doc.type===type)))+'</div></form></section>'+
    '<section class="panel" style="margin-top:1rem"><div class="row"><h2>搜索结果</h2><span class="meta">'+candidates.length+' 条</span></div>'+
    (candidates.length?'<ul class="result-list">'+candidates.slice((page-1)*pageSize,page*pageSize).map(({doc,signal})=>result(doc,signal?"命中 "+signal:"")).join("")+'</ul>':
      '<p class="notice" style="margin-top:.75rem">'+(all.length?"暂无匹配。可清除部分筛选，或尝试输入事件 Reason。":"当前范围暂无可阅读的生效知识。")+'</p>')+
    (lastPage>1?'<div class="pager">'+(page>1?anchor("上一页",pageHref(page-1)):"")+'<span class="meta">'+page+' / '+lastPage+'</span>'+(page<lastPage?anchor("下一页",pageHref(page+1)):"")+'</div>':"")+'</section>';
}
function detail(id,params){
  const latest=getDoc(id);
  const rev=Number(params.get("revision"))||latest?.rev;
  const doc=rev===latest?.rev ? latest : revisions.get(id+":"+rev);
  if(!visible(latest) || !doc || !canRead(doc)) return headline("知识详情","","","#/wiki")+empty("此知识不可访问","该条目可能不存在、已撤回或超出当前授权。");
  const old = rev!==latest.rev;
  const items=getDoc("case");
  const caseLink=id==="pvc" && visible(items) ? '<p><a href="#/wiki/case?revision=1">'+esc(items.title)+'</a></p>' : "";
  return headline(doc.title,"",admin()?button("创建修订","revise","",id):"","#/wiki")+
    '<div class="cols"><div class="panel stack">'+(old?'<p class="notice warn">正在查看历史版本 v'+rev+'。 <a href="#/wiki/'+esc(id)+'">查看生效版</a></p>':"")+
    (doc.versionState==="待复核"?'<p class="notice warn">该手册已到复核日期。请先核对现场条件。</p>':"")+

function submitDraft(form,action){
  const data=new FormData(form);

  if(!admin() || orig && !["草稿","已驳回"].includes(orig.status)) return;
  const type=orig?.fixed?orig.type:data.get("type");
  const candidate = {
    ...(orig||{id:form.dataset.id,rev:1,status:"草稿",owner:actor.value}),
    type, title:data.get("title").trim(), resource:data.get("resource"), team:data.get("team").trim(), date:data.get("date"),
    tags:data.get("tags").trim(), applicable:data.get("applicable").trim(), source:orig?.fixed?orig.source:data.get("source").trim(),
    scopes:orig?.fixed?orig.scopes:data.getAll("scope"),

  };

    overlay("脱敏预览",'<p><strong>'+esc(redacted(candidate.title)||"未命名草稿")+'</strong></p><p class="meta">'+esc(scopeNames(candidate.scopes)||"范围待确认")+'</p>'+
      candidate.fields.map((value,i)=>'<div class="inset"><strong>'+esc(templates[type][i])+'</strong><p class="plain">'+esc(redacted(value)||"待补充")+'</p></div>').join("")+
      '<div class="actions">'+button("返回编辑","close")+'</div>');
    return;
  }
  if(action==="submit"){
    const missing=[!candidate.title&&"标题",!candidate.team&&"责任团队",!candidate.date&&"下次复核日期",!candidate.applicable&&"适用条件",!candidate.scopes.length&&"可见范围",
      ...(type==="排障手册"&&!candidate.tags?["匹配信号"]:[]),...templates[type].filter((_,i)=>!candidate.fields[i])].filter(Boolean);
    const status=document.querySelector("#edit-status");
    if(missing.length){status.textContent="请补齐 "+missing.join("、")+" 后再提交。";status.hidden=false;status.scrollIntoView({block:"nearest"});return;}
    if(candidate.scopes.length>1 && type!=="排障手册"){status.textContent="首版只允许排障手册共享到多个目标。";status.hidden=false;return;}
    candidate.status="待审核";
    candidate.owner=actor.value;
    candidate.fields=candidate.fields.map(redacted);
    candidate.title=redacted(candidate.title);
  }
  if(orig) Object.assign(orig,candidate); else drafts.push(candidate);

      checked:"2026-11-20",state:"已发布",versionState:"生效中",body:[...draft.fields],sourceId:draft.sourceId};
    if(old){revisions.set(old.id+":"+old.rev,{...old});Object.assign(old,published);}else handbooks.push(published);
    draft.status="已发布";dialog.close();render();say("已发布 v"+published.rev);
  }
  if(action==="withdraw"&&active(doc)) overlay("撤回知识",'<p>撤回「'+esc(doc.title)+'」v'+doc.rev+' 后，该条目将退出普通阅读、推荐和 AI 问答。</p><div class="actions">'+button("取消","close")+button("确认撤回","confirm-withdraw","danger",id)+'</div>');
  if(action==="confirm-withdraw"&&active(doc)){doc.state="已撤回";dialog.close();render();say("已撤回 v"+doc.rev);}
  if(action==="withdraw-record"&&doc?.state==="已撤回") overlay("撤回记录",'<p>'+esc(doc.title)+' · v'+doc.rev+'</p><p class="notice">当前已撤回。历史内容可用于治理核对。</p><p class="plain">'+esc(doc.body.join("\n\n"))+'</p><div class="actions">'+button("关闭","close")+'</div>');
  if(action==="recheck"&&active(doc)) overlay("完成复核",'<form id="review-form" data-id="'+esc(id)+'" class="stack"><label>责任团队<input name="team" value="'+esc(doc.team)+'" required></label><p class="meta">更新复核日期，正文版本保持不变。</p><div class="actions">'+button("取消","close")+'<button class="btn primary">确认复核</button></div></form>');
  if(action==="sync"&&sourceActive&&!syncRunning){
    syncRunning=true;syncResult="正在同步…";render();
    setTimeout(()=>{
      syncRunning=false;
      if(!sourceActive){syncResult="来源已停用，本次同步没有写入。";render();return;}
      const existing=drafts.find((entry)=>entry.sourceId==="corp-wiki"&&entry.status!=="已放弃");
      if(!existing) drafts.push({...newDraft(),sourceId:"corp-wiki",source:"公司 Wiki · Kubernetes 手册",title:"容器启动前检查镜像仓库权限",team:"容器平台组",tags:"ErrImagePull、403",applicable:"镜像仓库拒绝请求。",fields:["容器不能拉取镜像。","ErrImagePull · 403","检查镜像引用、仓库权限和最近的凭据变更。","使用相同配置的工作负载达到 Ready。","持续失败时升级到容器平台组。"]});
      syncResult=existing?"同步完成，跳过 1 条未变化内容。":"同步完成，生成 1 条候选，等待审核。";
      if(location.hash.startsWith("#/sources"))render();
    },550);
  }
  if(action==="disable-source")overlay("停用公司 Wiki",'<p>停用后，该来源的内容将退出普通阅读和推荐。</p><div class="actions">'+button("取消","close")+button("确认停用","confirm-disable","danger")+'</div>');
  if(action==="confirm-disable"){sourceActive=false;handbooks.filter((item)=>item.sourceId==="corp-wiki").forEach((item)=>item.state="已撤回");syncResult="来源已停用。";dialog.close();render();}
});
render(true);
</script>
</body>
</html>
