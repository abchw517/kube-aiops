<script id="prototype-form-handler">
(() => {
  // Prototypes handle form data locally, including in previews that block native submission.
  const submitSelector = 'button[type="submit"]';
  document.addEventListener("click", event => {
    const button = event.target.closest(submitSelector);
    if (!button?.form || event.defaultPrevented) return;
    event.preventDefault();
    if (button.form.reportValidity()) {
      button.form.dispatchEvent(new SubmitEvent("submit", {bubbles:true,cancelable:true,submitter:button}));
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key !== "Enter" || event.isComposing || event.defaultPrevented) return;
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || !["text","password","email","number","search","tel","url"].includes(input.type)) return;
    const button = input.form?.querySelector(submitSelector + ":not([hidden]):not(:disabled)");
    if (!button) return;
    event.preventDefault();
    button.click();
  });
})();
</script>

  s.page=s.signedIn?(s.forcePassword?"admin/password":labels[route()]?route():"diagnostics"):"login";
  const canUseAssistant=s.signedIn&&!s.forcePassword&&topGroup(s.page)===registry[0];
  $("#assistant-launch").hidden=!canUseAssistant;
  if(previous!==s.page){
    if(dialog.open)dialog.close();
    if(assistant.open)assistant.close();
    setAssistantContext();
    if(!canUseAssistant)resetAssistantChat();
    s.menu=false;
  }
  header();
  if(!s.signedIn){login();return}
  $("#login").hidden=true;$("#work").hidden=false;
  const [module,,groups]=topGroup(s.page);
  $("#rail").hidden=s.forcePassword;
  $("#work").classList.toggle("password-gate",s.forcePassword);
  $("#rail").classList.toggle("open",s.menu);
  $("#rail").innerHTML=`<nav aria-label="模块栏目"><h2>${module}</h2>${groups.map(([name,items])=>
    `<p class="rail-label">${name}</p>${items.map(([path,label])=>`<a href="#/${path}" ${path===s.page?'aria-current="page"':""}>${label}</a>`).join("")}`).join("")}</nav>`;
  const isAI=s.page==="ai"||s.page==="ai/skills";
  const overview=s.page==="diagnostics";
  $("#page").innerHTML=`<p class="crumb">${module} / ${labels[s.page]}</p>`+
    (isAI?"":renderPage())+
    (overview?'<div class="split-scroll row jump" style="justify-content:flex-end">'+btn("recent-scenario","演示调查异常","quiet small")+'</div>':"");
  $("#recent-frame").hidden=!overview;$("#ai-frame").hidden=!isAI;
  if(overview)ensureFrame("recent"); if(isAI)ensureFrame("ai");
  $("#foot").hidden=s.forcePassword;
  $("#foot").innerHTML=`<details><summary>原型说明与实现依据</summary><p>全站使用演示数据。更改仅在本次打开期间生效。</p>
    <a href="https://github.com/abchw517/kube-aiops/blob/main/${references[module]}" target="_blank" rel="noopener">${module}实现</a>
    <a href="https://github.com/abchw517/kube-aiops/blob/main/${references["全局导航"]}" target="_blank" rel="noopener">全局导航与权限可见性</a></details>`;
  if(previous!==s.page&&scroll)window.scrollTo(0,0);
}
function applyFilter(target){
  const f=localFilter(),id=target.id;
  if(id==="filter-text")f.text=target.value;
  else if(id==="filter-status")f.status=target.value;
  else if(id==="filter-env")f.env=target.value;
  else return;
  const list=$("#list-results"),kind=listKey();
  if(!list||!kind)return;
  const template=document.createElement("template");template.innerHTML=listMarkup(kind,db[kind],false);
  list.replaceWith(template.content.firstElementChild);
}
$("#page").addEventListener("input",e=>{
  if(e.target.id==="filter-text")applyFilter(e.target);
  if(e.target.closest("#ldap-form")){
    $("#ldap-save").disabled=true;$("#ldap-state").textContent="";
  }
});
$("#page").addEventListener("change",e=>applyFilter(e.target));
dialog.addEventListener("input",e=>{
  if(e.target.id!=="permission-query")return;
  const query=e.target.value.trim().toLowerCase();
  dialog.querySelectorAll("[data-permission-section]").forEach(group=>{
    const header=$("h3",group).textContent;
    const rows=[...group.querySelectorAll("[data-permission-row]")];
    rows.forEach(row=>row.hidden=!(header+row.textContent).toLowerCase().includes(query));
    group.hidden=rows.every(row=>row.hidden);
  });
});
$("#page").addEventListener("submit",e=>{
  const form=e.target;
  if(!["diag-filter","session-form","ldap-form","password-form"].includes(form.id))return;
  e.preventDefault();const values=new FormData(form);
  if(form.id==="diag-filter"){s.diagEnv=values.get("env");s.diagSource=values.get("source");render(false);notify("当前诊断范围已应用")}
  if(form.id==="session-form"){s.minutes=Number(values.get("minutes"));logChange("保存会话策略",s.minutes+" 分钟");notify("会话策略已保存");$("summary",form.closest("details")).textContent="会话策略 · "+s.minutes+" 分钟"}
  if(form.id==="ldap-form"&&!$("#ldap-save").disabled){
    s.ldap={url:values.get("url"),bind:values.get("bind"),base:values.get("base")};s.authOpen=true;
    logChange("保存 LDAP 配置","认证配置");render(false);notify("LDAP 配置已保存");
  }
  if(form.id==="password-form"){
    const current=s.passwords?.[s.user]||"demo123", next=String(values.get("next"));
    const feedback=$("#password-state");
    if(values.get("old")!==current||next.length<8||next===current||next!==values.get("confirm")){
      feedback.className="notice bad";feedback.textContent="请核对当前密码。新密码至少 8 位，需与确认密码一致且不同于当前密码。";return;
    }
    (s.passwords ||= {})[s.user]=next;
    const gate=s.forcePassword;s.forcePassword=false;form.reset();logChange("更新演示密码",s.user);
    if(gate)go("diagnostics");notify("密码已更新");
  }
});
document.addEventListener("click",e=>{
  const anchor=e.target.closest('a[href^="#/"]');
  if(anchor){
    // In srcdoc, fragment links can resolve against the outer viewer's URL.
    e.preventDefault();
    if(anchor.closest("#assistant"))assistant.close();
    go(anchor.getAttribute("href").slice(2));return;
  }
  const target=e.target.closest("[data-do]");
  if(!target)return;
  const {do:action,id,view}=target.dataset;
  const [kind,item]=findRow(id);
  switch(action){
    case "demo-login":signIn("demo");break;
    case "assistant-open":openAssistant(assistantFinding);break;
    case "assistant-finding":if(kind==="findings")openAssistant(item);break;
    case "assistant-close":assistant.close();break;
    case "assistant-clear":setAssistantContext();showAssistantScope();assistantField.focus();break;
    case "assistant-prompt":assistantField.value=id;assistantField.focus();break;
    case "assistant-reference":case "assistant-evidence":
      if(item){assistant.close();rowDetail(kind,item)}
      break;
    case "fill-login": {const form=$("#sign-in");form.elements.name.value=form.elements.ldap.checked?"demo-ldap":"demo";form.elements.password.value="demo123";form.elements.name.focus();break}
    case "logout": s.signedIn=false;s.forcePassword=false;s.user="";dialog.close();go("login");break;
    case "menu": s.menu=!s.menu;$("#rail").classList.toggle("open",s.menu);target.setAttribute("aria-expanded",String(s.menu));break;
    case "close": dialog.close();break;
    case "reset": s.filters[s.page]={text:"",status:"",env:""};render(false);$("#filter-text")?.focus();break;
    case "tab": s.tabs[s.page]=id;s.filters[s.page]={text:"",status:"",env:""};render(false);document.querySelector(`.tabs [data-id="${id}"]`)?.focus();break;
    case "jump-recent": $("#recent-frame").scrollIntoView({block:"start"});break;
    case "recent-scenario": sendFrame("recent","scenario");break;
    case "diag-level": s.scopeLevel=s.scopeLevel===id?"":id;render(false);break;
    case "trend-point": s.activeDay=Number(id);render(false);document.querySelector(`.chart [data-id="${id}"]`)?.focus();break;
    case "trend-window": s.windowSize=Number(id);s.activeDay=undefined;render(false);break;
    case "row": if(item)rowDetail(kind,item);break;
    case "row-ai": if(item)rowDetail(kind,item,"ai");break;
    case "detail-mode": if(item)rowDetail(kind,item,view||"detail");break;
    case "topology-node": $("#topology-info").textContent=id+"节点已选中，可核对关联事件及上下游。";break;
    case "ai-cancel":clearTimeout(s.investigationTimer);$("#save").disabled=false;$("#ai-output").innerHTML="<p class='notice warn'>调查已取消，现场观察已保留。</p>";break;
    case "create": openCreate(listKey());break;
    case "toggle-row": if(item)open(item.status==="已停用"?"启用记录":"停用记录",
      scope([["目标记录",item.name],["当前状态",item.status]]),"确认",()=>{
        item.status=item.status==="已停用"?"已启用":"已停用";logChange("更新状态",item.name);done("当前状态为"+item.status);
      },"modal");break;
    case "test-source": case "check-row":
      if(item){
        open("测试连接",scope([["记录",item.name],["连接类型",item.type||"集群 API"],["所属环境",item.env]]),"开始测试",()=>{
          $("#save").disabled=true;say("正在验证演示连接…");
          const feedback=$("#feedback",dialog);
          setTimeout(()=>{if(!feedback.isConnected||!dialog.open)return;say("演示连接可用。");$("#save").disabled=false},650);
        },"modal");
      }break;
    case "check-draft":
      if($("form",dialog).reportValidity())say($("#dialog-title").textContent.includes("用户组")?"预览完成。组角色将由成员继承。":"演示验证通过，可以保存。");break;
    case "namespace": dialog.close();s.tabs["resources/clusters"]="namespaces";s.filters["resources/clusters"]={text:"",status:"",env:item?.env||""};go("resources/clusters");break;
    case "policy-run": if(item)open("策略运行记录",scope([["策略",item.name],["运行状态",item.status==="已启用"?"最近运行已完成":"策略已停用"],["作用范围",item.env]]));break;
    case "ask": open("知识问答",askContent(),"查询",()=>{
      const question=$("#question").value.trim();if(!question)return;
      const doc=/内存|oom/i.test(question)?db.wiki.find(x=>x.id==="w2"):db.wiki.find(x=>x.id==="w1");
      $("#ask-result").innerHTML=`<section class="block"><h3>排障建议</h3><p>${safe(doc.text)}</p><div class="actions">${btn("row","查看引用 · "+doc.name,"small",doc.id)}</div></section>`;
    });break;
    case "wiki-full": if(item)open(item.name,`<section class="block"><h3>${safe(item.type)} · ${safe(item.meta)}</h3><p class="read">${safe(item.text)}</p></section>`);break;
    case "source-sync": if(item){item.meta="本次演示已同步";logChange("同步知识来源",item.name);done("同步完成")};break;
    case "open-ai":dialog.close();go("ai?bind="+encodeURIComponent(item?.type==="Alertmanager"?"alertmanager":"zabbix"));break;
    case "skill-convert":
      dialog.close();go("ai/skills?manual="+encodeURIComponent(item?.id||""));break;
    case "catalog": catalog(null); break;
    case "grant-role": if(item)catalog(item); break;
    case "select-permissions":dialog.querySelectorAll("[data-permission-row]:not([hidden]) input").forEach(box=>box.checked=true);say("已选择当前筛选出的权限。");break;
    case "user-grant":
      if(item)open("分配或撤销角色",`<div class="form-grid">${choice("角色","role",["撤销直接角色",...db.roles.map(role=>role.name)],item.meta.split(" · ")[0])}</div>`,"确认变更",
        values=>{const value=values.get("role");item.meta=value==="撤销直接角色"?"无直接角色":value;logChange("变更账号授权",item.name);done("账号授权已更新")});
      break;
    case "user-audit": if(item){dialog.close();s.filters["admin/operations"]={text:item.name,status:"",env:""};go("admin/operations")};break;
    case "ldap-test": {
      const form=$("#ldap-form"), feedback=$("#ldap-state");
      if(!form.reportValidity())return;
      feedback.className="notice";feedback.textContent="正在验证演示连接…";target.disabled=true;
      setTimeout(()=>{
        if(!feedback.isConnected)return;
        const ok=/^ldaps?:\/\//i.test(form.elements.url.value);
        feedback.className="notice "+(ok?"":"bad");
        feedback.textContent=ok?"网络连接、搜索账号、用户搜索和组搜索均通过演示校验。":"URL 需以 ldap:// 或 ldaps:// 开头。";
        $("#ldap-save").disabled=!ok;target.disabled=false;
      },550);
      break;
    }
  }
});
render();
$("#preview-fallback").hidden=true;
</script>
</body>
</html>
