<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kube-aiops · 前端布局原型</title>
<style>
:root {
  color-scheme: light;
  --canvas: #f2f5fa;
  --rail: #f9fafe;
  --surface: #fff;
  --subtle: #f6f8fc;
  --ink: #18243a;
  --muted: #526178;
  --quiet: #61718a;
  --line: #e2e8f2;
  --field: #cbd5e5;
  --accent: #484bc2;
  --accent-hover: #373a9e;
  --accent-soft: #ecedff;
  --indigo: #6768d7;
  --mint: #269488;
  --purple: #a17bd2;
  --danger: #a52b4a;
  --danger-soft: #fcecf1;
  --warning: #865014;
  --warning-soft: #fff1d8;
  --info: #285499;
  --info-soft: #eaf2ff;
  --success: #17675b;
  --success-soft: #e1f3ed;
  --radius: 20px;
  --control: 12px;
  --shadow: 0 4px 18px #1d35740a;
  font: 100%/1.55 "Inter", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  font-synthesis: none;
  color: var(--ink);
  background: var(--canvas);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; }
button, select, summary { cursor: pointer; }
button:disabled { cursor: default; opacity: .54; }
:focus-visible { outline: 3px solid #716cf0; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 2rem; line-height: 1.23; letter-spacing: -.035em; }
h2 { font-size: 1.22rem; line-height: 1.4; letter-spacing: -.015em; }
h3 { font-size: 1rem; }
small { font-size: .8125rem; }
[hidden] { display: none !important; }
.skip { position: fixed; z-index: 20; left: 16px; top: -100px; padding: 10px 14px; background: white; border-radius: 10px; }
.skip:focus { top: 12px; }
.topbar { min-height: 72px; position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 32px; padding: 0 30px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); font-size: 1.125rem; font-weight: 780; letter-spacing: -.025em; flex: 0 0 170px; white-space: nowrap; }
.logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; background: linear-gradient(145deg,#6668e3,#4446b5); color: #fff; font-weight: 800; box-shadow: 0 4px 11px #4949b92a; }
.top-nav { display: flex; align-items: center; gap: 6px; min-width: 0; }
.top-nav a { padding: 9px 14px; font-size: .9375rem; font-weight: 640; white-space: nowrap; color: var(--muted); border-radius: 11px; }
.top-nav a:hover, .side-nav a:hover { background: var(--subtle); color: var(--ink); }
.top-nav a[aria-current], .side-nav a[aria-current] { background: var(--accent-soft); color: var(--accent-hover); }
.header-meta { display: flex; align-items: center; gap: 16px; margin-left: auto; }
.preview-link { white-space: nowrap; border-radius: 9px; font-size: .875rem; padding: 6px 8px; }
.preview-link:hover { background: var(--accent-soft); }
.demo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: var(--muted); font-size: .8125rem; }
.demo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); }
.frame { min-height: calc(100dvh - 72px); display: grid; grid-template-columns: 244px minmax(0,1fr); }
.sidebar { min-width: 0; padding: 29px 16px 28px; background: var(--rail); border-right: 1px solid var(--line); }
.side-inner { position: sticky; top: 100px; }
.side-title { font-size: 1rem; font-weight: 760; margin: 0 11px 19px; }
.side-group { margin-bottom: 22px; }
.side-group p { margin: 0 11px 7px; font-size: .8125rem; font-weight: 630; color: var(--quiet); }
.side-nav a { color: var(--muted); display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 8px 10px; border-radius: 11px; font-size: .90625rem; font-weight: 630; }
.side-nav a + a { margin-top: 3px; }
.nav-icon { flex: 0 0 18px; display: inline-grid; place-items: center; font-size: 1.03125rem; line-height: 1; }
.mobile-nav { display: none; }
main { min-width: 0; width: 100%; max-width: 1630px; margin-inline: auto; padding: 24px clamp(20px, 2.45vw, 40px) 48px; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 13px; font-size: .8125rem; color: var(--quiet); }
.breadcrumb a { color: var(--muted); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head p { margin-top: 5px; color: var(--muted); font-size: .9375rem; }
.actions, .inline, .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 43px; padding: 8px 15px; border: 1px solid var(--field); border-radius: var(--control); background: var(--surface); color: var(--ink); font-weight: 650; font-size: .9375rem; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--subtle); border-color: #a8b4ce; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 4px 9px #4548b51b; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.small { min-height: 36px; font-size: .875rem; padding: 6px 11px; }
.text-btn { border: 0; padding: 0; background: transparent; text-align: start; color: var(--accent-hover); font-size: inherit; font-weight: 670; overflow-wrap: anywhere; }
.text-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.close { width: 42px; height: 42px; border: 0; border-radius: 12px; background: var(--subtle); color: var(--ink); font-size: 1.5rem; line-height: 1; flex: none; }
.close:hover { background: var(--accent-soft); }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; min-width: 0; min-height: 43px; padding: 8px 11px; border: 1px solid var(--field); border-radius: var(--control); background: white; color: var(--ink); font-weight: 500; }
select { appearance: none; padding-inline-end: 35px; background-image: linear-gradient(45deg,transparent 50%,#566583 50%),linear-gradient(135deg,#566583 50%,transparent 50%); background-position: calc(100% - 17px) 52%,calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
input::placeholder { color: var(--quiet); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 17px; height: 17px; flex: 0 0 17px; margin: 0; }
label.field { display: grid; gap: 5px; align-content: start; font-size: .9375rem; font-weight: 640; min-width: 0; }
.check { display: flex; align-items: center; gap: 9px; min-height: 42px; font-size: .9375rem; cursor: pointer; }
.check span { min-width: 0; }
.filters { gap: 10px 14px; }
.filters .field { min-width: 130px; }
.filters .search { flex: 1 1 230px; }
.filters .result { color: var(--muted); font-size: .875rem; align-self: end; padding-bottom: 9px; margin-left: auto; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.panel-pad { padding: 20px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 17px 20px; }
.panel-head p { color: var(--muted); margin-top: 3px; font-size: .875rem; }
.stack { display: grid; gap: 16px; min-width: 0; }
.metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 13px; }
.metric { padding: 15px 16px; min-width: 0; text-align: start; color: var(--ink); }
.metric:hover { border-color: #b1b7e9; background: #fdfdff; }
.metric[aria-pressed=true] { border-color: #c9cafa; background: linear-gradient(135deg,#f5f4ff,#fcfdff 67%); }
.metric-top { display: flex; align-items: center; gap: 9px; white-space: nowrap; font-size: .875rem; font-weight: 650; color: var(--muted); }
.metric-icon { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: .9rem; font-weight: 760; }
.metric[data-level=严重] .metric-icon { color: var(--danger); background: var(--danger-soft); }
.metric[data-level=警告] .metric-icon { color: var(--warning); background: var(--warning-soft); }
.metric[data-level=信息] .metric-icon { color: var(--info); background: var(--info-soft); }
.metric strong { display: block; font-size: 1.875rem; line-height: 1.2; letter-spacing: -.04em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.analysis-grid { display: grid; grid-template-columns: minmax(0,2.15fr) minmax(240px,1fr); gap: 16px; align-items: stretch; }
.segment { display: inline-flex; flex-wrap: nowrap; max-width: 100%; gap: 3px; padding: 4px; border-radius: 12px; background: #f0f2f9; }
.segment button { border: 1px solid transparent; border-radius: 9px; min-height: 32px; padding: 4px 10px; color: var(--muted); font-size: .875rem; font-weight: 640; white-space: nowrap; background: transparent; }
.segment button:hover { color: var(--ink); }
.segment button[aria-pressed=true] { background: white; border-color: var(--line); color: var(--accent-hover); box-shadow: 0 2px 4px #1d35740b; }
.chart { padding: 0 20px 17px; }
.plot-area { display: grid; grid-template-columns: 22px minmax(0,1fr); }
.axis { height: 132px; display: flex; flex-direction: column; justify-content: space-between; color: var(--quiet); font-size: .75rem; font-variant-numeric: tabular-nums; margin-top: -8px; padding-bottom: 0; }
.plot { height: 124px; display: grid; grid-template-columns: repeat(var(--days),minmax(0,1fr)); align-items: stretch; border-bottom: 1px solid var(--line); gap: clamp(1px, .45vw, 7px); background: repeating-linear-gradient(to bottom,var(--line) 0px,var(--line) 1px, transparent 1px,transparent 25%); }
.day { position: relative; border: 0; background: transparent; min-width: 0; padding: 0; display: flex; align-items: center; justify-content: flex-start; flex-direction: column-reverse; border-radius: 5px 5px 0 0; }
.day:hover, .day[aria-pressed=true] { background: #e9ebff8c; }
.bar { display: block; width: min(73%,27px); min-width: 3px; flex: 0 0 var(--share); }
.bar:last-child { border-radius: 5px 5px 0 0; }
.series-0 { background: var(--indigo); }
.series-1 { background: var(--mint); }
.series-2 { background: var(--purple); }
.x-axis { margin-left: 22px; display: flex; justify-content: space-between; padding-top: 5px; font-size: .75rem; color: var(--quiet); }
.chart-footer { min-height: 33px; margin-top: 9px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 5px 12px; color: var(--muted); font-size: .8125rem; }
.chart-footer strong { color: var(--ink); }
.legend { display: flex; gap: 11px; flex-wrap: wrap; }
.legend span, .distribution-row span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.distribution { padding: 0 20px 18px; display: grid; gap: 11px; }
.ring { width: 113px; aspect-ratio: 1; margin: 0 auto 3px; border-radius: 50%; position: relative; display: grid; place-items: center; background: conic-gradient(#d66b8a 0% var(--critical), #e3a351 var(--critical) var(--warning-edge), #7b9fe5 var(--warning-edge) 100%); }
.ring-inner { display: grid; align-content: center; text-align: center; width: 82px; height: 82px; border-radius: 50%; background: white; line-height: 1.2; }
.ring-inner strong { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.ring-inner small { color: var(--muted); margin-top: 3px; }
.distribution-row { display: grid; grid-template-columns: minmax(0,1fr) auto 42px; align-items: center; gap: 9px; font-size: .875rem; }
.distribution-row strong, .distribution-row small { text-align: right; font-variant-numeric: tabular-nums; }
.distribution-row small { color: var(--quiet); }
.swatch.critical { background: #d66b8a; }
.swatch.warning { background: #e3a351; }
.swatch.info { background: #7b9fe5; }
.table-panel { overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: start; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 14px; border-top: 1px solid #e9edf5; text-align: start; overflow-wrap: anywhere; font-size: .9375rem; vertical-align: middle; }
th { background: var(--subtle); color: var(--muted); font-size: .875rem; font-weight: 650; white-space: nowrap; }
th:first-child, td:first-child { padding-inline-start: 20px; }
th:last-child, td:last-child { padding-inline-end: 20px; }
tbody tr:hover { background: #fafbff; }
td:first-child { min-width: 180px; }
td small, .cell-meta { display: block; color: var(--quiet); font-size: .8125rem; font-weight: 450; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; padding: 3px 9px; min-height: 27px; border-radius: 999px; background: var(--subtle); color: var(--muted); font-size: .875rem; font-weight: 670; line-height: 1.3; white-space: nowrap; }
.badge.critical { background: var(--danger-soft); color: var(--danger); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.good { background: var(--success-soft); color: var(--success); }
.empty { min-height: 160px; display: grid; align-content: center; justify-items: center; gap: 5px; text-align: center; padding: 22px; color: var(--muted); }
.empty strong { color: var(--ink); }
.list-controls { padding: 15px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .875rem; }
.list-controls label { display: inline-flex; align-items: center; gap: 8px; }
.tabbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 5px; background: #e9edf7; border-radius: 14px; width: fit-content; }
.tabbar button { border: 1px solid transparent; min-height: 38px; padding: 6px 13px; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 650; font-size: .9375rem; }
.tabbar button[aria-pressed=true] { background: white; border-color: var(--line); color: var(--accent-hover); box-shadow: 0 2px 4px #1d35740b; }
.group { border-top: 1px solid var(--line); }
.group summary { padding: 13px 20px; font-size: .9375rem; font-weight: 650; }
.group summary small { margin-left: 7px; color: var(--quiet); }
.catalog-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(250px,100%),1fr)); gap: 13px; }
.doc-card { padding: 17px; display: grid; gap: 8px; align-content: start; }
.doc-card p { color: var(--muted); font-size: .9375rem; }
.doc-card small { color: var(--quiet); }
.callout { padding: 12px 15px; border-radius: 13px; background: var(--accent-soft); color: #3d438b; font-size: .9375rem; }
dialog { border: 1px solid var(--line); padding: 0; color: var(--ink); width: min(960px,calc(100% - 32px)); max-height: calc(100dvh - 32px); border-radius: 24px; box-shadow: 0 20px 78px #16234448; background: white; overflow: hidden; }
dialog::backdrop { background: #1a264f68; }
dialog.drawer { width: min(510px,100%); height: 100dvh; max-height: none; margin: 0 0 0 auto; border-radius: 24px 0 0 24px; }
.overlay { display: grid; grid-template-rows: auto minmax(0,1fr) auto; max-height: calc(100dvh - 32px); }
.drawer .overlay { height: 100%; max-height: none; }
.overlay-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 20px 23px 16px; border-bottom: 1px solid var(--line); }
.overlay-head p { margin-top: 4px; color: var(--muted); font-size: .9375rem; }
.overlay-body { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 17px 23px; }
.overlay-foot { min-height: 66px; padding: 10px 23px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); }
.overlay-foot .actions { margin-left: auto; }
.overlay-foot small { color: var(--muted); }
.overlay-grid, .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; align-items: start; }
.box { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: white; }
.box > h3 { margin-bottom: 8px; }
.box > p { color: var(--muted); font-size: .9375rem; }
.option-card { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid var(--field); border-radius: 12px; cursor: pointer; min-width: 0; }
.option-card:has(input:checked) { border-color: #a3a7f0; background: var(--accent-soft); }
.option-card small { display: block; color: var(--muted); }
.subdued-box { border-radius: 13px; background: var(--subtle); padding: 12px 14px; }
.details-list { display: grid; grid-template-columns: minmax(88px,.65fr) minmax(0,1.35fr); gap: 8px 14px; margin: 0; }
.details-list dt { color: var(--muted); font-size: .9375rem; }
.details-list dd { margin: 0; overflow-wrap: anywhere; }
.step-form { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 15px; }
.step-nav { display: grid; gap: 5px; align-content: start; padding: 8px; background: var(--subtle); border-radius: 15px; }
.step-nav button { border: 1px solid transparent; min-height: 39px; text-align: start; border-radius: 10px; background: transparent; color: var(--muted); padding: 7px 10px; font-size: .9375rem; }
.step-nav button[aria-pressed=true] { background: white; border-color: var(--line); color: var(--accent-hover); font-weight: 680; }
.toast { position: fixed; z-index: 12; right: 22px; bottom: 20px; max-width: calc(100% - 44px); padding: 12px 16px; border-radius: 13px; background: #243250; color: white; box-shadow: var(--shadow); font-size: .9375rem; }

body.login-mode .frame { grid-template-columns: minmax(0,1fr); background: radial-gradient(ellipse at 48% 32%,#e8ebff 0%,var(--canvas) 54%); }
body.login-mode .sidebar { display: none; }
body.login-mode main { align-self: center; justify-self: center; }
.login-card { width: min(440px,100%); margin: 10px auto; padding: 28px; display: grid; gap: 21px; box-shadow: 0 12px 46px #45478b14; }
.login-kicker { margin-bottom: 7px; color: var(--accent); font-size: .9375rem; font-weight: 760; }
@media (max-width: 1120px) {
  .frame { grid-template-columns: 216px minmax(0,1fr); }
  .topbar { gap: 20px; padding-inline: 22px; }
  .brand { flex-basis: 153px; }
  .sidebar { padding-inline: 12px; }
  .analysis-grid { grid-template-columns: minmax(0,1.7fr) minmax(205px,1fr); }
}
@media (max-width: 920px) {
  .frame { grid-template-columns: 184px minmax(0,1fr); }
  .side-nav a { align-items: flex-start; }
  .side-nav .nav-icon { padding-top: 4px; }
  main { padding-inline: 18px; }
  .analysis-grid { grid-template-columns: minmax(0,1fr); }
  .distribution { grid-template-columns: 113px minmax(0,1fr); align-items: center; }
  .ring { grid-row: span 3; margin: 0; }
  .metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 740px) {
  .topbar { position: static; min-height: auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 13px 16px 8px; }
  .top-nav { grid-row: 2; grid-column: 1 / -1; overflow-x: auto; padding: 2px 2px 5px; }
  .top-nav a { padding-inline: 10px; font-size: .875rem; }
  .header-meta { grid-row: 1; grid-column: 2; gap: 6px; }
  .preview-link { font-size: .8125rem; }
  .frame { display: block; }
  .sidebar { display: none; }
  .mobile-nav { display: block; margin-bottom: 13px; }
  main { padding: 16px 14px 30px; }
  .page-head { align-items: flex-start; flex-direction: column; margin-bottom: 16px; gap: 11px; }
  h1 { font-size: 1.65rem; }
  .metrics { gap: 9px; }
  .metric { padding: 11px 13px; }
  .metric strong { font-size: 1.6rem; }
  .table-wrap { overflow: visible; }
  table, tbody { display: block; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  tbody tr { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-items: start; padding: 11px 15px; border-top: 1px solid var(--line); gap: 8px; }
  tbody tr > td, tbody tr > td:first-child, tbody tr > td:last-child { padding: 0; border: 0; min-width: 0; }
  td:first-child { grid-column: 1 / -1; }
  td[data-label]:not(:first-child)::before { content: attr(data-label); display: block; color: var(--quiet); font-size: .8125rem; margin-bottom: 2px; }
  .panel-head { padding-inline: 15px; }
  .overlay-grid, .step-form { grid-template-columns: 1fr; }
  .step-nav { display: flex; flex-wrap: wrap; gap: 2px; }
  .step-nav button { padding-inline: 7px; }
  .overlay-head, .overlay-body, .overlay-foot { padding-inline: 14px; }
}
@media (max-width: 430px) {
  .chart { padding-inline: 14px; }
  .form-grid { grid-template-columns: 1fr; }
  .filters .result { margin-left: 0; }
  dialog.drawer { border-radius: 18px 0 0 18px; }
}
</style>
</head>

<a class="skip" href="#main">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="#/diagnostics"><span class="logo" aria-hidden="true">K</span> kube-aiops</a>
  <nav id="top-nav" class="top-nav" aria-label="主导航"></nav>
  <div class="header-meta"><span class="demo">原型 · 演示数据</span><a class="preview-link" href="#/login">登录页</a></div>
</header>
<div class="frame">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="overlay" aria-labelledby="overlay-title"></dialog>
<p id="toast" class="toast" role="status" hidden></p>
<script>
'use strict';

const severityTotals = {'': [24, 76, 12], 生产: [18, 45, 8], 测试: [4, 19, 3], 研发: [2, 12, 1]};
const series = ['故障事件','K8sGPT','Zabbix'];

function dailySeries(offset) {
  const recent = [[2,4,2],[1,2,3],[2,5,4],[0,3,3],[2,3,2],[3,4,4],[3,3,6]];
  if (offset >= -6) return recent[offset + 6];
  const i = offset + 29;
  const counts = [[1,0,1],[0,1,1],[1,1,0]][i % 3].slice();
  if (i < 20 && i % 4 === 0) counts[i % 3]++;
  return counts;
}
const dailyBuckets = new Map();
let allocated = [0,0,0];
const environmentTotals = envList.map(name => severityTotals[name].reduce((sum,count) => sum + count, 0));
let seen = 0;
for (let day = -29; day <= 0; day++) {
  const bucket = new Map(envList.map(name => [name,[0,0,0]]));
  const counts = dailySeries(day);
  counts.forEach((count,seriesIndex) => {
    for (let i = 0; i < count; i++) {
      seen++;
      const deficits = allocated.map((value,envIndex) => seen * environmentTotals[envIndex] / 112 - value);
      const env = deficits.indexOf(Math.max(...deficits));
      allocated[env]++;
      bucket.get(envList[env])[seriesIndex]++;
    }
  });
  bucket.set('',counts);
  dailyBuckets.set(day,bucket);
}
function countForDay(offset) {
  return dailyBuckets.get(offset).get(state.env);
}
function dateForDay(offset) {
  const date = new Date(Date.UTC(2026,10,25 + offset));
  return `${date.getUTCMonth()+1}/${String(date.getUTCDate()).padStart(2,'0')}`;
}

function trend() {
  const rows = Array.from({length:state.days}, (_, i) => {
    const offset = i - state.days + 1;
    return { date: dateForDay(offset), counts: countForDay(offset) };
  });
  const sum = a => a.reduce((total,value) => total + value, 0);
  const max = Math.max(4, Math.ceil(Math.max(...rows.map(({counts}) => sum(counts))) / 4) * 4);
  const active = rows[state.day] || rows.at(-1);
  return `<article class="panel">
    <div class="panel-head"><div><h2>诊断趋势</h2><p>${rows[0].date} – ${rows.at(-1).date} · UTC+8 · 按首次发现日统计</p></div>
    ${segment([[7,'7天'],[14,'14天'],[30,'30天']],state.days,'days','诊断趋势窗口')}</div>
    <div class="chart">
      <div class="plot-area"><div class="axis" aria-hidden="true">${[1,.75,.5,.25,0].map(f => `<span>${max*f}</span>`).join('')}</div>
        <div class="plot" role="group" aria-label="每日诊断量" style="--days:${state.days}">${rows.map(({date,counts},i) => {
          const label = date + ' · ' + series.map((key,j) => key + ' ' + counts[j]).join(' · ');
          return `<button class="day" type="button" data-day="${i}" title="${label}" aria-label="${label}" aria-pressed="${state.day===i}">${counts.map((count,j) => count ? `<span class="bar series-${j}" style="--share:${count*100/max}%"></span>` : '').join('')}</button>`;
        }).join('')}</div></div>
      <div class="x-axis" aria-hidden="true">${[0,Math.round((rows.length-1)/3),Math.round((rows.length-1)*2/3),rows.length-1].map(i => `<span>${rows[i].date}</span>`).join('')}</div>
      <div class="chart-footer"><span><strong>${active.date} · ${sum(active.counts)} 条</strong>　窗口内 ${sum(rows.map(row => sum(row.counts)))} 条</span>
        <div class="legend">${series.map((name,i) => `<span><i class="swatch series-${i}"></i>${name} ${active.counts[i]}</span>`).join('')}</div></div>
    </div>
  </article>`;
}

function overviewContent() {

    ${levels.map((level,i) => `<div class="distribution-row"><span><i class="swatch ${tone[level]}"></i>${level}</span><strong>${values[i]}</strong><small>${Math.round(values[i]/total*100)}%</small></div>`).join('')}</div></article>`;
  const recent = issues.filter(item => (!state.env || item.env === state.env) && (!state.level || item.level === state.level));
  return pageHead(`<label class="field">环境范围<select aria-label="环境范围" data-overview-env>${options.map(item => Array.isArray(item) ? option(item[0],item[1],state.env) : option(item,item,state.env)).join('')}</select></label>`) +

      <section class="analysis-grid" aria-label="诊断数据分析">${trend()}${distribution}</section>
      <section class="panel table-panel" id="recent-issues"><div class="panel-head"><div><h2>最近诊断${state.level ? ' · '+state.level : ''}</h2><p>按首次发现时间倒序 · UTC+8</p></div><a class="btn small" href="${link('incidents')}">查看故障事件</a></div>
      ${recent.length ? issueTable(recent) : empty('该范围暂无最近记录','可切换环境或点击「诊断记录总数」重置级别。')}</section>
    </div>`;
}

function clusterTable(rows) {
  return wrap(['集群','环境 / 业务线','接入方式','采集状态','节点健康','最近采集','操作'], rows.map(row =>
    [rowLink(row.name,row.id,row.id),safe(row.env + ' / ' + row.business),safe(row.mode),badge(row.status),safe(row.nodes),safe(row.time),
      `<button class="btn small" type="button" data-edit-cluster="${safe(row.id)}">${row.mode === '本地自动采集' ? '编辑归属' : '编辑配置'}</button>`]));
}
function sourceTable(rows) {
  return wrap(['数据源','类型','环境','用途','运行状态','最近活动'], rows.map(row =>
    [rowLink(row.name,row.id,row.endpoint),safe(row.kind),safe(row.env),safe(row.usage),badge(row.status),safe(row.time)]));
}
function entryTable(rows, [scope,extra]) {
  return wrap(['名称',scope,extra,'状态'], rows.map(row => [rowLink(row.name,row.id,row.idText),safe(row.scope),safe(row.extra),badge(row.status)]));
}

function currentList() {
  const summary = {
    incidents: { rows: issues.filter(item => item.kind === '故障事件'), table: issueTable, search: '搜索事件或受影响对象' },
    findings: { rows: issues.filter(item => item.kind === 'K8sGPT'), table: issueTable, search: '搜索资源或诊断名称' },
    clusters: { rows: clusters, table: clusterTable, search: '搜索集群名称、实例 ID' },
    sources: { rows: sources.filter(row => row.tab === state.sourceTab), table: sourceTable, search: '搜索名称、类型或访问地址' },
    wiki: { rows: documents, search: '搜索标题、标签或正文摘要' },
  };
  const headers = { policy:['作用范围','合并周期'], environments:['关联范围','说明'], business:['关联范围','说明'],
    governance:['来源','更新时间'], users:['身份来源','角色'], audit:['操作模块','时间 · UTC+8'] };
  if (state.page === 'access') {
    const role = state.accessTab === '角色';
    if (state.accessTab === '权限目录') {
      const rows = modules.flatMap(module => module.groups.flatMap(([label,keys]) => keys.map(key => ({
        name:pages[key].title, scope:module.title, extra:label, key }))));
      return { rows, search:'搜索模块或页面名称', table: items => wrap(['页面','一级模块','导航分组'],
        items.map(row => [`<a class="text-btn" href="${link(row.key)}">${row.name}</a>`,row.scope,row.extra])) };
    }
    return { rows: entries[role ? 'roles' : 'groups'], search:'搜索名称或标识', table: rows => entryTable(rows,role ? ['授权范围','已授权模块'] : ['成员','关联角色']) };
  }
  return summary[state.page] || { rows: entries[state.page], table: rows => entryTable(rows,headers[state.page]), search:'搜索名称或标识' };
}
function listKey() { return state.page + (state.page === 'sources' ? state.sourceTab : state.page === 'access' ? state.accessTab : ''); }
function listFilter() { return filtersByPage.get(listKey()) || {}; }
function listRows(config) {
  const f = listFilter();
  const query = (f.query ?? '').trim().toLowerCase();
  return config.rows.filter(row => (!f.env || row.env === f.env) && (!f.status || row.status === f.status)
    && (!f.kind || row.kind === f.kind) && (!query || Object.values(row).some(value => String(value).toLowerCase().includes(query))));
}
function cards(rows) {
  return `<div class="catalog-grid">${rows.map(row => `<article class="panel doc-card"><small>${row.tag}</small><h2>${rowLink(row.name,row.id)}</h2><p>${row.detail}</p><small>更新于 ${row.time}</small></article>`).join('')}</div>`;
}
function listBody(config, rows) {
  if (!rows.length) return `<div class="panel">${empty()}</div>`;
  if (state.page === 'wiki') return cards(rows);
  if (state.page === 'sources' && state.clustered) {
    return `<div class="panel table-panel">${[...new Set(rows.map(row => row.kind))].map(kind => {
      const items = rows.filter(row => row.kind === kind);
      return `<details class="group" open><summary>${kind} <small>${items.length} 个</small></summary>${sourceTable(items)}</details>`;
    }).join('')}</div>`;
  }
  return `<div class="panel table-panel">${config.table(rows)}</div>`;
}
function listPage() {
  const config = currentList();
  const rows = listRows(config);
  const f = listFilter();
  const action = {
    sources: button('＋ 新增数据源','add-source','primary'), clusters: button('＋ 接入集群','add-cluster','primary'),
    environments:button('＋ 新增环境','add-entry','primary'), business:button('＋ 新增业务线','add-entry','primary'),
  }[state.page];
  const possible = key => [...new Set(config.rows.map(row => row[key]).filter(Boolean))];
  let tabbar = '';
  if (state.page === 'sources') tabbar = tabs([['monitor','监控与诊断'],['assets','资产数据源']],state.sourceTab,'source-tab','数据源类别');
  if (state.page === 'access') tabbar = tabs(['角色','用户组','权限目录'].map(item => [item,item]),state.accessTab,'access-tab','权限工作区');
  return pageHead(action) + `<div class="stack">${tabbar}<section class="panel panel-pad filters" aria-label="列表筛选">
    <label class="field search">搜索<input type="search" name="query" data-filter value="${safe(f.query)}" placeholder="${config.search}"></label>
    ${possible('kind').length > 1 && state.page === 'sources' ? selectField('类型','kind',[['','全部类型'],...possible('kind')],f.kind,'data-filter') : ''}
    ${possible('env').length ? selectField('环境','env',[['','全部环境'],...envList],f.env,'data-filter') : ''}
    ${possible('status').length > 1 && state.page !== 'wiki' ? selectField('状态','status',[['','全部状态'],...possible('status')],f.status,'data-filter') : ''}
    ${state.page === 'sources' ? `<label class="check"><input type="checkbox" data-group-sources ${state.clustered?'checked':''}><span>按类型分组</span></label>` : ''}
    <span class="result" data-list-count aria-live="polite">${rows.length} 项</span></section>

function notify(message) {

function showOverlay(title, subtitle, body, footer, {drawer = false, form = ''} = {}) {
  if (!modal.open) opener = document.activeElement;
  modal.classList.toggle('drawer',drawer);
  const tag = form ? 'form' : 'div';
  modal.innerHTML = `<${tag} class="overlay" ${form ? `data-form="${form}"` : ''}>
    <header class="overlay-head"><div><h2 id="overlay-title" tabindex="-1">${title}</h2>${subtitle ? `<p>${subtitle}</p>` : ''}</div><button type="button" class="close" aria-label="关闭" data-action="dismiss">×</button></header>
    <div class="overlay-body">${body}</div>
    <footer class="overlay-foot">${footer}</footer></${tag}>`;
  if (!modal.open) modal.showModal();
  modal.querySelector('h2').focus();
}
modal.addEventListener('close', () => {
  if (modal.open) return;
  modal.replaceChildren();
  if (opener?.isConnected) opener.focus();
  else pageEl.querySelector('.page-head button, h1')?.focus();
});
const cancel = button('取消','dismiss');
const save = text => `<button type="submit" class="btn primary">${text}</button>`;
const footer = (actions, hint = '') => `<small role="status" data-overlay-status>${hint}</small><div class="actions">${actions}</div>`;
const describe = rows => `<dl class="details-list">${rows.map(([label,value]) => `<dt>${label}</dt><dd>${safe(value)}</dd>`).join('')}</dl>`;

  ].filter(([,value]) => value);
  let action = button('关闭','dismiss');

function sourceReady(form) {
  const kind = form.querySelector('[data-source-kind]').dataset.sourceKind;
  const ready = form.dataset.tested === 'true' && (kind !== 'Zabbix' || !!form.elements.group?.checked);
  form.querySelector('[type=submit]').disabled = !ready;

  if (kind === 'Zabbix' && form.dataset.tested === 'true') form.querySelector('[data-scope-preview]').textContent =
    ready ? '8 台主机 · 2 条活跃问题' : '选择主机组后查看问题预览。';
}
function testSource(form) {
  for (const name of ['env','name','endpoint','username','secret']) {
    const field = form.elements[name];
    if (field && !field.closest('[hidden]') && !field.reportValidity()) return;
  }
  form.dataset.tested = 'true';
  form.querySelector('[data-test-feedback]').innerHTML = badge('已验证') + '　连接成功 · 演示结果';
  const box = form.querySelector('[data-scope-result]');
  const zabbix = form.querySelector('[data-source-kind]').dataset.sourceKind === 'Zabbix';
  box.innerHTML = zabbix ? `<strong>采集主机组</strong>${check('演示主机组 · Windows 应用主机','group')}<p data-scope-preview></p>`
    : '<strong>连接测试成功</strong><p>演示范围内的资源可读。</p>';
  sourceReady(form);
}

    ${field('说明','extra',item?.extra)}${check('启用','enabled',item?.status !== '停用')}</div>`,
    footer(cancel + save('保存')),{form:'entry'});

function saveForm(form) {
  const data = new FormData(form);
  const value = name => String(data.get(name) ?? '').trim();
  let row;
  let collection;
  let editingId = form.dataset.editId;
  if (form.dataset.form === 'source') {
    if (form.querySelector('[type=submit]').disabled) return;
    const holder = form.querySelector('[data-source-kind]');
    const {sourceKind:kind, editId} = holder.dataset;
    editingId = editId;
    const prior = detailInfo.get(editingId);
    collection = sources;
    row = {...prior,id:editingId || 'source-demo-'+Date.now(), name:value('name'), env:value('env'),kind,
      usage:connectors[state.sourceTab].find(item => item[0] === kind)[1],status:'同步正常',endpoint:value('endpoint'),time:'刚刚',tab:state.sourceTab};
  } else if (form.dataset.form === 'cluster') {
    const prior = detailInfo.get(editingId);
    collection = clusters;
    if (!editingId && clusters.some(row => row.id === value('id'))) {
      form.querySelector('[data-overlay-status]').textContent = '实例 ID 已存在，请输入其他 ID。';
      return;
    }
    row = {...prior,id:value('id'),name:value('name'),env:value('env'),business:value('business'),
      mode:prior?.mode ?? '外部直连',status:prior?.mode === '本地自动采集' || data.has('enabled') ? '在线' : '停用',
      nodes:prior?.nodes ?? '待采集',time:'刚刚',endpoint:value('endpoint'),enabled:data.has('enabled'),ai:data.has('ai')};
  } else {
    const prior = detailInfo.get(editingId);
    collection = entries[state.page];
    if (!editingId && collection.some(row => row.idText === value('id'))) {
      form.querySelector('[data-overlay-status]').textContent = 'ID 已存在，请输入其他 ID。';
      return;
    }
    row = {...prior,id:editingId || 'catalog-demo-'+Date.now(),name:value('name'),idText:value('id'),
      status:data.has('enabled')?'已启用':'停用',scope:prior?.scope ?? '0 个集群',extra:value('extra')};
  }
  if (editingId) collection.splice(collection.findIndex(item => item.id === editingId),1,row);
  else collection.unshift(row);
  detailInfo.set(row.id,row);
  modal.close();
  refreshList();
  notify('已保存演示配置');
}

document.addEventListener('click', event => {
  const trigger = event.target.closest('button');
  if (!trigger) return;
  const data = trigger.dataset;
  if (data.days) { state.days = Number(data.days); state.day = state.days-1; paint('[data-days="'+data.days+'"]'); return; }
  if (Object.hasOwn(data,'day')) { state.day = Number(data.day); paint('[data-day="'+data.day+'"]'); return; }
  if (Object.hasOwn(data,'level')) { state.level = data.level; paint('[data-level="'+data.level+'"]'); return; }
  if (data.sourceTab) { state.sourceTab = data.sourceTab; paint('[data-source-tab="'+data.sourceTab+'"]'); return; }
  if (data.accessTab) { state.accessTab = data.accessTab; paint('[data-access-tab="'+data.accessTab+'"]'); return; }
  if (data.detail) { openDetail(data.detail); return; }
  if (data.connector) { sourceSetup(data.connector); return; }
  if (data.editCluster) { clusterSetup(data.editCluster); return; }
  if (data.editEntry) { entrySetup(data.editEntry); return; }
  if (data.editSource) { sourceSetup('Zabbix',data.editSource); return; }
  if (data.step) {
    for (const step of modal.querySelectorAll('[data-step]')) step.setAttribute('aria-pressed',String(step === trigger));
    for (const panel of modal.querySelectorAll('[data-pane]')) panel.hidden = panel.dataset.pane !== data.step;
    return;
  }
  const form = trigger.closest('form');
  switch (data.action) {
    case 'dismiss': modal.close(); break;
    case 'add-source': sourceChooser(); break;
    case 'add-cluster': clusterSetup(); break;
    case 'add-entry': entrySetup(); break;
    case 'test-source': testSource(form); break;
    case 'test-cluster': form.querySelector('[data-overlay-status]').textContent = '演示结果 · Kubernetes API 连接成功'; break;
    case 'test-ldap': form.querySelector('output').textContent = '演示结果 · LDAP 连接成功'; break;
  }
});
document.addEventListener('input', event => {
  const target = event.target;
  if (target.matches('[data-filter]')) {
    filtersByPage.set(listKey(),{...listFilter(),[target.name]:target.value});
    refreshList();
  }
  const form = target.form;
  if (form?.dataset.form !== 'source') return;
  if (target.name === 'auth') {
    const password = target.value === 'password';
    form.querySelector('[data-account]').hidden = !password;
    form.elements.username.required = password;
    form.elements.secret.value = '';
    form.elements.secret.closest('label').firstChild.textContent = password ? '密码' : 'API Token';
  }
  if (target.name !== 'group') {
    if (form.dataset.tested === 'true') {
      form.dataset.tested = 'false';
      form.querySelector('[data-test-feedback]').textContent = '';
      form.querySelector('[data-scope-result]').textContent = '连接信息已修改，请重新测试。';
    }
  }
  sourceReady(form);
});
document.addEventListener('change', event => {
  const target = event.target;
  if (target.matches('[data-mobile-page]')) location.hash = link(target.value);
  if (target.matches('[data-group-sources]')) { state.clustered = target.checked; refreshList(); }
  if (target.matches('[data-overview-env]')) { state.env = target.value; paint('[data-overview-env]'); }
});
document.addEventListener('invalid', event => {
  const pane = event.target.closest('[data-pane][hidden]');
  if (pane) modal.querySelector('[data-step="' + pane.dataset.pane + '"]')?.click();
}, true);
document.addEventListener('submit', event => {
  const form = event.target;
  if (!form.dataset.form) return;
  event.preventDefault();
  if (form.dataset.form === 'login') {
    location.hash = link('overview');
  } else if (form.dataset.form === 'password') {
    const matches = form.elements.new.value === form.elements.repeat.value;
    form.querySelector('output').textContent = matches ? '演示结果 · 密码已更新' : '两次输入的新密码不一致。';
    if (matches) form.reset();
  } else if (form.dataset.form === 'ldap') form.querySelector('output').textContent = '已保存演示配置';
  else saveForm(form);
});
function route() {
  const next = view();
  if (modal.open) modal.close();
  state.page = next;
  paint();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { if (location.hash !== '#main') route(); });
route();
</script>
</body>
</html>
