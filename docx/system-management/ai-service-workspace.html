<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 服务 · kube-aiops 交互原型</title>
<style>
  :root { font: 16px/1.55 system-ui, sans-serif; color: #18243a; background: #f4f6fb; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header, aside, section, dialog { background: white; border: 1px solid #dce3ef; }
  .top { padding: 1rem 1.5rem; display: flex; gap: 1.25rem; }
  .layout { display: grid; grid-template-columns: minmax(10rem,18%) minmax(0,1fr); min-height: 90vh; }
  aside, main { padding: 1.4rem; }
  aside a { display: block; margin: .5rem 0; padding: .5rem .75rem; border-radius: .65rem; }
  a { color: #4446ad; }
  a[aria-current] { background: #edecff; font-weight: 650; }
  h1, h2 { margin: 0 0 .8rem; }
  section { padding: 1rem; margin-bottom: .9rem; border-radius: 1rem; }
  .bar { display: flex; gap: .55rem; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  button, input, select, textarea { font: inherit; padding: .4rem .6rem; border: 1px solid #9baacc; border-radius: .55rem; }
  button { background: #fff; color: inherit; cursor: pointer; }
  button.primary { background: #4546bb; border-color: #4546bb; color: white; }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .65rem; border-bottom: 1px solid #dce3ef; }
  th { background: #f4f6fb; }
  dialog { width: min(34rem, calc(100vw - 2rem)); border-radius: 1rem; padding: 1rem; }
  dialog::backdrop { background: #18243a66; }
  dialog label { display: grid; gap: .25rem; margin: .6rem 0; }
  @media (max-width: 640px) { .layout { display: block; } aside { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; } aside a { margin: 0; } }
</style>
</head>
<body>
<header class="top"><strong>kube-aiops</strong><span>AI 服务</span><small>交互原型</small></header>
<div class="layout">
<aside aria-label="AI 服务"><strong>AI 服务</strong><a href="#configuration">AI 服务配置</a><a href="#skills">AI 技能</a></aside>
<main id="page"></main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><form id="form">
<div class="bar between"><h2 id="modal-title"></h2><button id="close" type="button">关闭</button></div>
<div id="fields"></div><p id="feedback" role="status"></p><button class="primary" id="submit" type="submit"></button>
</form></dialog>
<script>
const page = document.getElementById("page");
const modal = document.getElementById("modal");
const form = document.getElementById("form");
const title = document.getElementById("modal-title");
const fields = document.getElementById("fields");
const feedback = document.getElementById("feedback");
const submit = document.getElementById("submit");
const example = {name:"生产 Holmes", provider:"vLLM", fast:"qwen-fast", accurate:"qwen-accurate"};
const state = {environment:"prod", desired:null, effective:example, version:1, live:1, status:"", skills:[]};
const esc = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
document.getElementById("close").onclick = () => modal.close();
function openDialog(heading, content, label, save) {
  title.textContent = heading;
  fields.innerHTML = content;
  feedback.textContent = "";
  submit.hidden = !save;
  submit.textContent = label || "";
  form.onsubmit = event => {
    event.preventDefault();
    save?.(new FormData(form));
  };
  modal.showModal();
}
function configuration() {
  const model = state.desired || state.effective;
  return '<h1>AI 服务配置</h1><section class="bar"><label>环境 <select id="environment"><option value="prod">生产</option><option value="uat">验收</option></select></label><button data-action="architecture">查看架构</button></section>' +
    '<section><h2>HolmesGPT 服务</h2><p>独立内部服务，Portal API 按绑定调用 /api/chat。</p><p>Finding 复核、事件 RCA 和知识问答沿用既有回退规则。</p></section>' +
    '<section><div class="bar between"><h2>模型连接</h2><button class="primary" data-action="add" ' + (state.environment === "uat" ? "disabled" : "") + '>新增连接</button></div>' +
    (state.environment === "uat" ? '<p>请先部署 Holmes 并添加范围绑定。</p>' :
    '<div class="table"><table><thead><tr><th>提供商 / 类型</th><th>服务地址</th><th>凭据</th><th>生效模型</th><th>操作</th></tr></thead><tbody><tr><td>' + esc(model.name) + ' · ' + esc(model.provider) +
    '</td><td>https://holmes.example</td><td>部署绑定凭据</td><td>' + esc(state.effective.fast) + ' · ' + esc(state.effective.accurate) + '</td><td class="bar"><button data-action="probe">测试连接</button><button data-action="edit">编辑</button>' +
    (state.desired ? '<button class="primary" data-action="publish">发布配置</button>' : '') + '</td></tr></tbody></table></div><p role="status">' + esc(state.status) + '</p>') + '</section>' +
    '<section><h2>模型档位与发布版本</h2><p>期望 v' + state.version + ' · 生效 v' + state.live + '</p></section>';
}
function skills() {
  const rows = state.skills.map((skill, i) => '<tr><td>' + esc(skill.name) + ' · ' + skill.source + '</td><td>' + (skill.live ? "v2" : "草稿") + '</td><td>生产 / ops</td><td>' + (skill.live ? '已启用' : '审核中') + '</td><td><button data-skill="' + i + '">' + (skill.live ? '查看技能' : '审核预览') + '</button></td></tr>').join("");
  return '<h1>AI 技能</h1><section><div class="bar between"><h2>技能列表</h2><div class="bar"><button data-action="upload">上传技能</button><button class="primary" data-action="manual">从知识库手册转化</button></div></div>' +
    '<div class="table"><table><thead><tr><th>技能 / 来源</th><th>版本</th><th>适用</th><th>状态</th><th>说明</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="5">暂无已提交技能。</td></tr>') + '</tbody></table></div></section><section><h2>生效位置</h2><p>匹配范围的 AI 深度调查可引用已启用的技能。</p></section>';
}
function render() {
  const showSkills = location.hash === "#skills";
  document.querySelectorAll("aside a").forEach(link => {
    if (link.hash === (showSkills ? "#skills" : "#configuration")) link.setAttribute("aria-current","page");
    else link.removeAttribute("aria-current");
  });
  page.innerHTML = showSkills ? skills() : configuration();
  const environment = document.getElementById("environment");
  if (environment) {
    environment.value = state.environment;
    environment.onchange = () => { state.environment = environment.value; render(); };
  }
}
page.onclick = event => {
  const button = event.target.closest("button");
  if (!button) return;
  const action = button.dataset.action;
  if (action === "architecture") openDialog("HolmesGPT 部署与调用路径", "<p>Web Portal → Go API → 范围绑定的 HolmesGPT → 模型提供商</p>");
  if (action === "probe") { state.status = "服务已就绪 · 2 个模型"; render(); }
  if (action === "add" || action === "edit") {
    const model = state.desired || state.effective;
    openDialog(action === "add" ? "新增模型连接" : "编辑模型连接",
      '<p>部署范围 生产 / ops</p><label>名称<input name="name" required value="' + esc(model.name) + '"></label><label>提供商<select name="provider"><option>vLLM</option><option>OpenAI 兼容</option></select></label><button type="button" id="discover">发现模型</button><label>fast-model<select name="fast" required></select></label><label>accurate-model<select name="accurate" required></select></label>',
      "保存草稿", values => { state.desired = Object.fromEntries(values); state.version++; state.status = "草稿已保存"; modal.close(); render(); });
    fields.querySelector("#discover").onclick = () => {
      for (const field of ["fast", "accurate"]) form.elements.namedItem(field).replaceChildren(...["qwen-fast","qwen-accurate"].map(value => new Option(value, value, false, value === model[field])));
      feedback.textContent = "已发现 2 个模型别名。";
    };
  }
  if (action === "publish") openDialog("发布模型配置", "<p>将重新核对模型别名，校验通过后新请求使用当前版本。</p>", "发布配置", () => {
    state.effective = state.desired; state.desired = null; state.live = state.version; state.status = "发布成功"; modal.close(); render();
  });
  if (action === "manual" || action === "upload") {
    const manual = action === "manual";
    openDialog(manual ? "从知识库手册转化" : "上传技能",
      (manual ? '<label>已发布手册<select><option>数据库连接池排查 · v3</option></select></label>' : '<label>选择 SKILL.md<input type="file" accept=".md" id="skill-file"></label>') +
      '<label>名称<input name="name" required value="' + (manual ? "数据库连接池分析" : "") + '"></label><label>SKILL.md 正文<textarea rows="6" name="body" required>' +
      (manual ? "核对连接池等待、活跃连接和数据库响应。" : "") + '</textarea></label>', "提交审核", values => {
      state.skills.push({name:values.get("name"), body:values.get("body"), source:manual ? "手册转化" : "SKILL.md 上传", live:false}); modal.close(); render();
    });
    if (!manual) fields.querySelector("#skill-file").onchange = async event => {
      const file = event.target.files[0];
      if (file) form.elements.namedItem("body").value = await file.text();
    };
  }
  if (button.dataset.skill !== undefined) {
    const item = state.skills[Number(button.dataset.skill)];
    openDialog(item.live ? "查看技能" : "审核预览", '<h3>' + esc(item.name) + '</h3><p>' + esc(item.body) + '</p>' +
      (item.live ? "" : "<p>以下操作演示由另一位授权管理员审核。</p>"),
      "审核通过并启用", item.live ? undefined : () => { item.live = true; modal.close(); render(); });
  }
};
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
