<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 服务工作区 · kube-aiops</title>
<style>
:root {
  color-scheme: light;
  --ink:#203a37; --muted:#516963; --line:#e1ebe5; --white:#fff;
  --green:#246657; --mist:#e7f3eb; --sand:#f7edda; --violet:#f1edf9;
  --shadow:0 18px 48px -36px #294b3c60;
  font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:#f6f8f4;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button,a { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:disabled { opacity:.48; cursor:default; }
a { color:var(--green); }
:focus-visible { outline:3px solid #588f7f; outline-offset:3px; }
.top { background:#fffdf9; border-bottom:1px solid var(--line); }
.top-inner { max-width:1360px; margin:auto; padding:15px clamp(16px,4vw,46px); display:flex; align-items:center; gap:34px; }
.brand { display:flex; align-items:center; gap:10px; white-space:nowrap; font-weight:750; letter-spacing:-.025em; font-size:18px; }
.brand-mark,.icon { display:grid; place-items:center; flex:none; }
.brand-mark { width:38px; height:38px; border-radius:14px; background:#286458; color:white; font-size:17px; box-shadow:0 5px 14px #28645830; }
.top nav { display:flex; gap:5px; flex-wrap:wrap; }
.top nav a { text-decoration:none; border-radius:999px; padding:9px 15px; color:var(--muted); font-weight:600; white-space:nowrap; }
.top nav a[aria-current] { color:#235c4e; background:var(--mist); }
.person { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
.person select { max-width:156px; }
main { max-width:1360px; margin:auto; padding:33px clamp(16px,4vw,46px) 42px; }
h1,h2,h3,p,dl,dd { margin:0; }
h1 { font-size:clamp(29px,4vw,38px); letter-spacing:-.04em; line-height:1.2; }
h2 { font-size:20px; letter-spacing:-.02em; }
h3 { font-size:16px; overflow-wrap:anywhere; }
p, dd { overflow-wrap:anywhere; }
.subtitle,.muted,small { color:var(--muted); }
.subtitle { margin-top:8px; }
.page-head { margin-bottom:22px; }
.row,.actions,.chips { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
.between { justify-content:space-between; }
.btn { display:inline-flex; justify-content:center; align-items:center; gap:6px; min-height:42px; padding:8px 15px; border:1px solid #d9e6de; background:#fff; border-radius:999px; color:var(--ink); text-decoration:none; white-space:nowrap; font-weight:650; }
.btn:hover:enabled,.btn[href]:hover { background:#f0f6ef; }
.btn.primary { background:var(--green); border-color:var(--green); color:#fff; }
.btn.primary:hover:enabled { background:#1e5549; }
.btn.quiet { background:transparent; border-color:transparent; }
.btn.small { min-height:36px; padding:6px 11px; font-size:13px; }
.pill,.scope-chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:650; background:#edf2ef; color:#48635a; }
.pill::before { content:""; width:6px; height:6px; background:currentColor; border-radius:50%; }
.pill.good { background:#dff0e6; color:#225c49; }
.pill.warn { background:var(--sand); color:#82511d; }
.pill.bad { background:#fae9e4; color:#963f30; }
.scope-chip { font-weight:500; background:#f0f5f1; max-width:100%; overflow-wrap:anywhere; }
.hero { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:center; gap:24px; isolation:isolate; position:relative; overflow:hidden; padding:24px 27px; border-radius:29px; border:1px solid #dceae0; background:radial-gradient(ellipse at 91% -20%,#d9ece3 3%,transparent 66%),linear-gradient(110deg,#f4f8e9,#eef7f1 58%,#f4f6e9); box-shadow:var(--shadow); margin-bottom:22px; }
.hero::after { content:""; pointer-events:none; position:absolute; z-index:-1; width:340px; height:260px; top:-150px; right:-100px; border:1px solid #6e9e8a34; border-radius:49% 51% 62% 38%; box-shadow:0 0 0 23px #e7f3e854,0 0 0 44px #6e9e8a14; transform:rotate(-20deg); }
.hero-head { align-items:flex-start; flex-wrap:nowrap; gap:14px; }
.icon { width:42px; height:42px; border-radius:15px; background:var(--mist); color:#23624f; font-size:18px; font-weight:650; }
.icon.lilac { background:var(--violet); color:#645582; }
.icon.sand { background:var(--sand); color:#82511d; }
.hero h2 { margin-bottom:5px; }
.hero .end { justify-self:end; max-width:100%; }
.inline-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.stat { padding:8px 13px; border-radius:16px; background:#ffffffad; min-width:0; }
.stat strong { display:block; font-size:24px; line-height:1.05; font-variant-numeric:tabular-nums; }
.stat small { font-size:12px; white-space:nowrap; }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(225px,290px); gap:19px; align-items:start; }
.panel { background:var(--white); border:1px solid var(--line); border-radius:25px; padding:19px 21px; box-shadow:var(--shadow); min-width:0; }
.panel-head { margin-bottom:13px; }
.stack { display:grid; gap:14px; }
.filters { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.filters input { flex:1 1 160px; min-width:100px; }
.filters select { max-width:100%; }
input,select,textarea { min-height:39px; border:1px solid #d4e2da; border-radius:12px; padding:7px 10px; background:#fcfdfa; max-width:100%; min-width:0; }
input[type="checkbox"] { width:auto; min-height:0; accent-color:var(--green); }
input:focus,select:focus,textarea:focus { border-color:#568572; }
textarea { resize:vertical; }
.search { padding-left:13px; }
.item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:start; gap:13px; padding:15px 0; border-top:1px solid #edf1ee; }
.item .actions { justify-content:flex-end; align-self:center; }
.item h3 { line-height:1.4; margin-bottom:4px; }
.item .chips { gap:6px; margin-top:5px; }
.models { margin-top:7px; display:flex; gap:6px 14px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
.models b { color:var(--ink); font-weight:600; overflow-wrap:anywhere; }
.side-title { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.side-title h2 { font-size:17px; }
.side-title .icon { width:31px; height:31px; border-radius:11px; font-size:15px; }
.side-note { margin:8px 0 12px; color:var(--muted); font-size:14px; }
.release { display:grid; width:100%; gap:4px; background:#faf8f1; border:1px solid #efe8d7; border-radius:15px; text-align:left; padding:11px 12px; margin:8px 0; }
.release b { overflow-wrap:anywhere; }
.release:hover { background:#f7efda; }
.meta { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:7px; font-size:13px; color:var(--muted); margin-top:10px; }
.empty { padding:26px 9px; text-align:center; border-top:1px solid var(--line); color:var(--muted); }
.empty .actions { justify-content:center; margin-top:10px; }
.tabs { display:flex; flex-wrap:wrap; gap:5px; margin:0 0 12px; }
.tabs button { border:none; background:#f1f5f2; border-radius:999px; padding:7px 11px; min-height:38px; font-weight:650; color:var(--muted); }
.tabs button[aria-pressed="true"] { background:#dceee4; color:#225a4b; }
dialog { border:1px solid var(--line); border-radius:28px; padding:0; background:#fffefa; color:var(--ink); width:min(680px,calc(100% - 24px)); max-height:calc(100dvh - 24px); box-shadow:0 36px 100px #21413748; }
dialog::backdrop { background:#243d37a0; }
dialog form { display:grid; grid-template-columns:minmax(0,1fr); }
.dialog-head,.dialog-foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:16px 21px; background:#fffefa; position:sticky; z-index:1; }
.dialog-head { top:0; border-bottom:1px solid var(--line); }
.dialog-foot { bottom:0; border-top:1px solid var(--line); justify-content:flex-end; }
.dialog-body { display:grid; gap:13px; padding:17px 21px; min-width:0; }
.dialog-body label { display:grid; grid-template-columns:minmax(0,1fr); gap:5px; font-weight:650; min-width:0; }
.dialog-body label > :is(input,select,textarea) { font-weight:400; width:100%; text-overflow:ellipsis; }
.dialog-body label.check { display:flex; align-items:center; }
.dialog-body label.check input { width:auto; }
.grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.group { display:grid; grid-template-columns:minmax(0,1fr); gap:11px; padding:13px 15px; border:1px solid var(--line); border-radius:18px; background:#fff; margin:0; min-width:0; }
.group legend { padding:0 6px; font-weight:700; }
.scope { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:4px 13px; color:var(--muted); padding:9px 12px; border-radius:13px; background:#f4f8f4; font-size:13px; }
.scope dd { color:var(--ink); }
.discovery { align-items:end; grid-template-columns:minmax(0,1fr) auto; }
.feedback { border-radius:12px; padding:9px 11px; background:#e7f3ed; color:#225a4b; margin:0 21px 13px; }
.feedback:empty { display:none; }
.feedback[data-tone="bad"] { background:#faeae4; color:#873728; }
.preview { margin:0; padding:14px; background:#f2f6f3; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; }
code { overflow-wrap:anywhere; }
.toast { position:fixed; bottom:20px; right:20px; z-index:3; border-radius:16px; padding:12px 16px; background:#275e51; color:white; box-shadow:0 10px 40px #21413744; max-width:calc(100% - 40px); }
.footnote { margin-top:20px; font-size:13px; color:var(--muted); }
.footnote summary { cursor:pointer; }
@media (max-width:960px) { .workspace { grid-template-columns:minmax(0,1fr); } .workspace aside.stack { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:660px) {
  .top-inner { gap:10px 16px; flex-wrap:wrap; } .top nav { order:3; width:100%; }
  main { padding-top:21px; } .hero { grid-template-columns:minmax(0,1fr); gap:12px; padding:18px; border-radius:23px; }
  .hero .end { justify-self:stretch; } .workspace aside.stack { grid-template-columns:minmax(0,1fr); }
  .panel { padding:15px; border-radius:20px; } .page-head { align-items:flex-start; gap:13px; }
  .item { grid-template-columns:auto minmax(0,1fr); gap:8px 11px; } .item .actions { grid-column:2; justify-content:flex-start; }
  .grid-2 { grid-template-columns:minmax(0,1fr); } .discovery .btn { justify-self:start; } .dialog-body,.dialog-head,.dialog-foot { padding-inline:14px; }
  .dialog-head h2 { font-size:18px; } .dialog-head .btn { min-height:36px; padding:5px 11px; }
}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><span class="brand-mark" aria-hidden="true">K</span>kube-aiops</div>
  <nav aria-label="AI 服务"><a href="#configuration">AI 服务配置</a><a href="#skills">AI 技能</a></nav>
  <label class="person">演示身份 <select id="actor"><option value="林晓">林晓 · 管理员</option><option value="周宁">周宁 · 管理员</option></select></label>
</div></header>
<main id="page"></main>
<dialog id="modal" aria-labelledby="dialog-title">
  <form id="form">
    <header class="dialog-head"><h2 id="dialog-title"></h2><button class="btn quiet" id="close" type="button">关闭</button></header>
    <div class="dialog-body" id="fields"></div>
    <p id="feedback" class="feedback" role="status"></p>
    <footer class="dialog-foot"><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary" id="submit"></button></footer>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const $ = (selector, root = document) => root.querySelector(selector);
const page = $("#page"), modal = $("#modal"), form = $("#form"), fields = $("#fields"), submit = $("#submit");
const envNames = { prod:"生产", stage:"预发布", test:"测试" };
const kindNames = { zabbix:"Zabbix 告警", alertmanager:"Alertmanager 告警", finding:"Finding 复核", incident:"事件 RCA", wiki:"知识问答" };
const skillLabels = { review:"待审核", enabled:"已启用", disabled:"已停用" };
const aliases = ["fast-model","accurate-model","accurate-backup"];
const endpoint = "http://holmes-pilot-holmes.holmes-pilot.svc";
const sources = [
  { id:"zbx-prod", raw:"VULS37GACIR2MXC32GOMUXK7ZABBIXPRODUCTIONGLOBAL", name:"生产全局 Zabbix 监控", kind:"zabbix", env:"prod", business:"平台运维" },
  { id:"am-prod", raw:"am-prod-gateway", name:"生产网关告警", kind:"alertmanager", env:"prod", business:"基础平台", cluster:"prod-sh-01" },
  { id:"am-stage", raw:"am-stage-apps", name:"预发布应用告警", kind:"alertmanager", env:"stage", business:"应用平台", cluster:"stage-sh-01" },
  { id:"zbx-test", raw:"zbx-test", name:"测试环境 Zabbix", kind:"zabbix", env:"test", business:"质量平台" },
];
const manuals = [
  {id:"gateway", title:"网关 5xx 排障手册", version:3, body:"# 网关 5xx 排障\n\n- 核对网关与上游的 5xx 变化。\n- 对照 xDS NACK、后端端点和发布记录。\n- 写明缺失证据和下一步验证。"},
  {id:"memory", title:"主机内存压力排障手册", version:2, body:"# 主机内存压力\n\n- 查看 PSI、swap 和主要进程的内存趋势。\n- 对齐告警发生时间和负载变化。"},
];
const state = {
  actor:"林晓", service:"ready", discovery:"ok", env:"", bindingQuery:"", skillQuery:"", skillStatus:"", skillScope:"",
  records:[
    {...sources[0], key:"a", ns:"", model:"accurate-model", live:{name:"生产全局 Zabbix 监控",provider:"智谱 AI",fast:"fast-model",accurate:"accurate-model",paused:false}, draft:null, version:2, liveVersion:2},
    {...sources[1], key:"b", ns:"gateway-system", model:"accurate-model", live:null, draft:{name:"生产网关告警",provider:"智谱 AI",fast:"fast-model",accurate:"accurate-model",paused:false}, version:1, liveVersion:0},
    {...sources[2], key:"c", ns:"apps", model:"accurate-model", live:null, draft:null, version:0, liveVersion:0},
  ],
  skills:[
    {id:"s1",name:"网关 5xx 快速取证",scope:"b",origin:"手册转化",manual:"网关 5xx 排障手册 · v3",status:"review",author:"周宁",keyword:"5xx",body:manuals[0].body,version:1},
    {id:"s2",name:"主机内存压力检查",scope:"a",origin:"Markdown 上传",status:"enabled",author:"林晓",reviewer:"周宁",keyword:"内存",body:manuals[1].body,version:2},
    {id:"s3",name:"历史网关日志检查",scope:"c",origin:"Markdown 上传",status:"disabled",author:"周宁",keyword:"日志",body:"# 历史网关日志检查\n\n- 按告警时间核对已授权日志。",version:3},
  ],
};
const esc = (value = "") => String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const opt = (value, name, selected) => `<option value="${esc(value)}"${value === selected ? " selected" : ""}>${esc(name)}</option>`;
const button = (action, label, type = "", id = "") => `<button type="button" class="btn ${type}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const pill = (name, tone = "") => `<span class="pill ${tone}">${esc(name)}</span>`;
const scopeText = row => [envNames[row?.env],row?.business,row?.cluster,row?.ns].filter(Boolean).join(" / ") || "全局";
const icon = (mark, type = "") => `<span class="icon ${type}" aria-hidden="true">${mark}</span>`;
const matched = (query, ...cells) => cells.join(" ").toLowerCase().includes(query.trim().toLowerCase());
const byKey = key => state.records.find(row => row.key === key);
let toastTimer, controls, dialogCycle = 0;
function notify(message) {
  const toast = $("#toast");
  toast.textContent = message; toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
}
function feedback(message = "", tone = "") {
  $("#feedback").textContent = message; $("#feedback").dataset.tone = tone;
}
function openDialog(title, html, label, onSubmit) {
  dialogCycle++;
  controls?.abort();
  fields.oninput = null;
  fields.onchange = null;
  $("#dialog-title").textContent = title;
  fields.innerHTML = html; feedback();
  submit.hidden = !onSubmit; submit.disabled = false; submit.textContent = label || "";
  $("#cancel").textContent = onSubmit ? "取消" : "返回";
  form.onsubmit = event => { event.preventDefault(); onSubmit?.(new FormData(form)); };
  if (!modal.open) modal.showModal();
}
for (const id of ["close","cancel"]) $(`#${id}`).onclick = () => modal.close();
modal.addEventListener("close", () => { dialogCycle++; });
$("#actor").onchange = event => { state.actor = event.target.value; render(); };

function configuration() {
  const waiting = state.records.filter(row => row.draft);
  const visible = state.records.filter(row => (!state.env || state.env === row.env)
    && matched(state.bindingQuery,row.name,kindNames[row.kind],scopeText(row)));
  return `<div class="page-head row between">
    <div><h1>AI 服务配置</h1><p class="subtitle">查看 HolmesGPT 服务状态，管理数据范围和生效模型。</p></div>
    ${button("bind","＋ 新增范围绑定","primary")}
  </div>
  <section class="hero" aria-label="HolmesGPT 服务状态">
    <div class="row hero-head">${icon("✦")}
      <div><div class="row"><h2>HolmesGPT 服务</h2>${state.service === "ready" ? pill("服务已就绪","good") : pill("服务不可达","bad")}</div>
      <p class="muted"><code>${endpoint}</code></p></div>
    </div>
    <div class="end"><div class="inline-stats">
      <div class="stat"><strong>${state.records.length}</strong><small>已绑定范围</small></div>
      <div class="stat"><strong>${state.records.filter(row => row.live && !row.live.paused).length}</strong><small>已发布档位</small></div>
      <div class="stat"><strong>${waiting.length}</strong><small>待发布草稿</small></div>
    </div><div class="actions">${button("recheck","检查服务","small")}${button("service-details","服务详情","quiet small")}</div></div>
  </section>
  <div class="workspace">
    <section class="panel" aria-label="范围与模型">
      <div class="row between panel-head"><h2>范围与模型</h2><small data-binding-count>${visible.length} 个范围</small></div>
      <div class="filters"><input class="search" id="binding-search" type="search" aria-label="搜索绑定" placeholder="搜索数据源、集群或业务" value="${esc(state.bindingQuery)}">
        <select id="env" aria-label="环境"><option value="">全部环境</option>${Object.entries(envNames).map(([id,label]) => opt(id,label,state.env)).join("")}</select></div>
      <div id="binding-items">${bindingRows(visible)}</div>
    </section>
    <aside class="stack" aria-label="配置操作">
      <section class="panel"><div class="side-title">${icon("↑","sand")}<h2>待发布配置</h2></div>
      ${waiting.length ? waiting.map(row => `<button type="button" class="release" data-action="publish" data-id="${esc(row.key)}"><b>${esc(row.draft.name)}</b><small>草稿 v${row.version} · 查看发布差异</small></button>`).join("") : '<p class="side-note">暂无待发布的草稿。</p>'}</section>
      <section class="panel"><div class="side-title">${icon("⌁","lilac")}<h2>模型档位</h2></div>
      <p class="side-note"><b>快速模型</b>用于知识问答和增强复核。<br><b>深度模型</b>用于告警调查、初步复核和事件 RCA。</p>
      ${button("architecture","查看调用链路","small")}</section>
    </aside>
  </div>`;
}
function visibleBindings() {
  return state.records.filter(row => (!state.env || state.env === row.env)
    && matched(state.bindingQuery,row.name,kindNames[row.kind],scopeText(row)));
}
function bindingRows(rows) {
  if (!rows.length) return '<div class="empty">当前筛选下没有范围绑定。<div class="actions">' + button("clear-bindings","清除筛选","small") + "</div></div>";
  return rows.map(row => `<article class="item">${icon(row.kind === "alertmanager" ? "A" : row.kind === "zabbix" ? "Z" : "H",row.kind === "alertmanager" ? "sand" : "")}
    <div><h3>${esc(row.live?.name || row.name)}</h3><small>${esc(kindNames[row.kind])}</small>
    <div class="chips"><span class="scope-chip">${esc(scopeText(row))}</span>${row.live?.paused ? pill("已暂停","warn") : row.live ? pill("已发布","good") : pill("使用默认模型")}${row.draft ? pill("有待发布草稿","warn") : ""}</div>
    <div class="models">${row.live && !row.live.paused ? `<span>快速 <b>${esc(row.live.fast)}</b></span><span>深度 <b>${esc(row.live.accurate)}</b></span>` : row.live?.paused ? "" : `<span>绑定模型 <b>${esc(row.model)}</b></span>`}${row.liveVersion ? `<span>生效 v${row.liveVersion}</span>` : ""}</div></div>
    <div class="actions">${button("probe","测试","small",row.key)}${button("edit",row.live || row.draft ? "编辑档位" : "配置档位","small",row.key)}${row.draft ? button("publish","发布","primary small",row.key) : ""}</div></article>`).join("");
}

function skillsPage() {
  const review = state.skills.filter(skill => skill.status === "review");
  const enabled = state.skills.filter(skill => skill.status === "enabled");
  return `<div class="page-head row between">

modal.addEventListener("click", event => { if (event.target.closest('[data-action="close-go"]')) modal.close(); });
window.addEventListener("hashchange",render);
render();
</script>
</body>
