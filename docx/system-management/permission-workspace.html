 (config?'<label>环境<select name="environment" required>'+option("","请选择环境",env)+Object.entries(scopes).map(([k,v])=>option(k,v.label,env)).join("")+'</select></label>'+
 '<label>集群实例<select name="cluster" '+(kind==="集群实例"||env==="production"||env==="staging"?"required":"")+'>'+option("","请选择集群",cluster)+Object.keys(instances).map(k=>option(k,k,cluster)).join("")+'</select></label>':"")+
 (resources&&cluster?'<label>业务线<select name="business" '+(env==="production"||env==="staging"?"required":"")+'>'+option("","请选择业务线",business)+Object.keys(businesses).map(k=>option(k,businessLabels[k]||k,business)).join("")+'</select></label>'+
 (namespaces.length?'<fieldset class="scope-group"><legend>命名空间</legend>'+namespaces.map(n=>'<label class="toggle"><input name="namespace" type="checkbox" value="'+n+'">'+n+'</label>').join("")+'</fieldset>':"")+
 (!(env==="production"||env==="staging")?'<label class="toggle"><input type="checkbox" name="entire">明确选择整个实例</label>':""):"")+
 '<button type="submit" class="primary">加入授权清单</button></form>':'<p class="muted">勾选权限点以添加授权。</p>')+
 '<p class="status" id="status" role="status">'+e(state.status)+'</p>'+
 (draft().length?draft().map((g,i)=>grantRow(g,true,i)).join(""):'<p class="blank">暂无已选范围。</p>')+
 '<div class="buttons"><button type="button" class="primary" data-action="preview"'+(total?'':' disabled')+'>预览并保存'+(total?' · '+total:'')+'</button>'+
 (total?'<span class="badge">新增 '+edits.add.length+' · 撤销 '+edits.remove.length+'</span>':'')+'</div></section>';
}
function lab(){
 return '<details class="panel pad lab" '+(state.labOpen?'open':'')+'><summary>验证菜单同步</summary>'+
 '<p class="muted">模拟修改共享菜单注册表，可回到角色查看草稿和授权位置。</p><div class="toolbar">'+
 '<button data-action="rename">模拟改名为「采集数据源」</button><button data-action="move">模拟移回诊断控制台</button><button data-action="revert">恢复当前菜单</button></div>'+
 '<div class="tree-change" aria-label="菜单预览">'+["module.resources","module.diagnosis"].map(id=>{
   const m=registry[id],groups=Object.values(registry).filter(n=>n.parentId===id).sort(byOrder);
   return '<p><strong>'+e(m.label)+'</strong> · '+groups.map(g=>e(g.label)+' › '+Object.values(registry)
     .filter(n=>n.parentId===g.id&&n.route).sort(byOrder).map(n=>e(n.label)).join("、")).join("　")+'</p>';
 }).join("")+'</div></details>';
}
function groupView(){
 const group=groups.find(x=>x.id===state.group);
 return '<div class="group-grid"><section class="panel pad"><h2>用户组</h2>'+groups.map(g=>'<button class="group-link" data-group="'+e(g.id)+'">'+e(g.name)+'</button>').join("")+
 '</section><section class="panel pad stack"><h2>'+e(group.name)+'</h2><p>成员 '+e(group.members.join("、"))+'</p><p class="muted">关联角色</p><div class="buttons">'+
 group.roles.map(id=>'<button data-role="'+e(id)+'">'+e(roles.find(r=>r.id===id)?.name||id)+'</button>').join("")+'</div></section></div>';
}
function impact(){
 return users.filter(u=>u.roles.includes(state.role)||groups.some(g=>u.groups.includes(g.id)&&g.roles.includes(state.role)));
}
function preview(){
 const edits=diff(),affected=impact();
 modal("核对变更",'<div class="stack"><p><strong>'+e(current().name)+'</strong> · 新增 '+edits.add.length+' 项，撤销 '+edits.remove.length+' 项</p>'+
 '<div class="rule">受此角色影响的账号 '+affected.length+' 个'+(affected.length?' · '+e(affected.map(x=>x.id).join("、")):'')+'。直接关联与用户组继承按账号去重。</div>'+
 (edits.add.length?'<div><span class="badge ok">新增</span>'+edits.add.map(g=>grantRow(g)).join("")+'</div>':"")+
 (edits.remove.length?'<div><span class="badge removed">撤销</span>'+edits.remove.map(g=>grantRow(g)).join("")+'</div>':"")+
 (edits.add.some(g=>["敏感","高风险"].includes(lookup.get(g.code)?.risk))?'<div class="rule">新增了敏感或高风险动作，请核对数据范围。</div>':"")+'</div>',
 '<button data-action="close-dialog">返回编辑</button><button class="primary" data-action="save">确认保存</button>');
}
function modal(title,body,footer){
 dialog.innerHTML='<header><h2 id="modal-title">'+title+'</h2><button class="link" data-action="close-dialog">关闭</button></header><section>'+body+'</section><footer>'+footer+'</footer>';
 dialog.showModal();
}
function chooseRole(id){state.role=id;state.tab="roles";state.status="";state.kind="";history.replaceState(null,"","#roles");view();}
function formValues(form){return Object.fromEntries(new FormData(form));}
pane.addEventListener("input",event=>{
 if(event.target.id==="query"){state.query=event.target.value;view(true);}
 if(event.target.id==="role-query"){
  const q=event.target.value.toLowerCase();
  pane.querySelectorAll(".role-list li").forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q));
 }
});
document.addEventListener("change",event=>{
 const t=event.target;
 if(t.id==="module"||t.id==="action"){state[t.id]=t.value;view();document.getElementById(t.id)?.focus();}
 if(t.dataset.pick){
  if(t.checked)selected().add(t.dataset.pick);else selected().delete(t.dataset.pick);
  view();pane.querySelector('[data-pick="'+CSS.escape(t.dataset.pick)+'"]')?.focus();
 }
 if(t.form?.id==="scope-form"&&["kind","environment","cluster","business"].includes(t.name)){
  const values=formValues(t.form);
  document.querySelector("#grant-summary").outerHTML=summary(values);
  pane.querySelector('#scope-form [name="'+t.name+'"]')?.focus();
 }
});
document.addEventListener("submit",event=>{
 const f=event.target;if(f.id!=="scope-form"&&f.id!=="new-role-form")return;
 event.preventDefault();
 if(f.id==="new-role-form"){
  const name=String(new FormData(f).get("name")||"").trim();
  if(!name){f.querySelector("[role=status]").textContent="请填写角色名称。";return;}
  if(roles.some(r=>r.name===name)){f.querySelector("[role=status]").textContent="角色名称已存在。";return;}
  const id="role-"+Date.now();roles.push({id,name,grants:[]});dialog.close();chooseRole(id);return;
 }
 const data=new FormData(f),kind=state.kind,environment=String(data.get("environment")||""),cluster=String(data.get("cluster")||""),business=String(data.get("business")||"");
 const ns=data.getAll("namespace"), restricted=environment==="production"||environment==="staging";
 const resource=kind==="资源范围"||kind==="知识目标";
 if(resource&&((restricted&&(!cluster||!business||!ns.length))||(cluster&&!ns.length&&!data.has("entire")))){
  const status=document.querySelector("#status");status.textContent="请明确选择授权范围。预发布和生产要求实例、业务线与命名空间。";status.classList.add("error");return;
 }
 const targets=resource?(ns.length?ns:[""]).map(namespace=>({environment,cluster,business,namespace})):
   kind==="集群实例"?[{environment,cluster}]:[{environment:""}];
 const existing=new Set(draft().map(key));
 let added=0;
 for(const code of [...selected()]){
  if(lookup.get(code)?.scope!==kind)continue;
  for(const scope of targets){const grant={code,scope};if(!existing.has(key(grant))){draft().push(grant);existing.add(key(grant));added++;}}
  selected().delete(code);
 }
 state.status=added?"已加入 "+added+" 项授权。":"相同权限与范围已在清单中。";view();
});
document.addEventListener("click",event=>{
 const b=event.target.closest("button");if(!b)return;
 if(b.dataset.tab){
  state.tab=b.dataset.tab;state.status="";history.replaceState(null,"","#"+state.tab);view();return;
 }
 if(b.dataset.role){chooseRole(b.dataset.role);return;}
 if(b.dataset.group){state.group=b.dataset.group;view();return;}
 if(b.dataset.detail){details(b.dataset.detail);return;}
 if(b.dataset.remove!==undefined){draft().splice(Number(b.dataset.remove),1);state.status="已从草稿移除。";view();return;}
 switch(b.dataset.action){
 case "bulk-read":case "bulk-all":{
  const candidates=visible().filter(p=>!p.restricted&&(b.dataset.action==="bulk-all"||p.action==="R"));
  for(const p of candidates)selected().add(p.code);
  state.status="已勾选当前结果中的 "+candidates.length+" 项。";view();break;
 }
 case "clear": selected().clear();state.status="";view();break;
 case "new-role":modal("新建自定义角色",'<form id="new-role-form" class="form-name"><label for="new-name">角色名称</label><input id="new-name" name="name" type="text" maxlength="60" required><p role="status"></p></form>','<button data-action="close-dialog">取消</button><button class="primary" form="new-role-form" type="submit">创建</button>');break;
 case "preview":preview();break;
 case "save":current().grants=structuredClone(draft());state.status="示例授权已保存。";dialog.close();view();break;
 case "close-dialog":dialog.close();break;
 case "close-detail":document.querySelector("#detail").hidden=true;break;
 case "rename":registry["resource.datasources"].label="采集数据源";state.labOpen=true;view();break;
 case "move":registry["resource.datasources"].parentId="group.diagnosis.settings";state.labOpen=true;view();break;
 case "revert":registry=structuredClone(baseRegistry);state.labOpen=true;view();break;
 }
});
function renderRoute(){const tab=location.hash.slice(1);state.tab=["roles","groups","catalog"].includes(tab)?tab:"roles";view();}
window.addEventListener("hashchange",renderRoute);renderRoute();
</script>
</body>
</html>
