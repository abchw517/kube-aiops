<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色配置 · kube-aiops 设计评审</title>
<style>
:root{color-scheme:light;--ink:#14263f;--muted:#4b6380;--line:#d7e1ef;--fill:#f2f6fb;--blue:#2548ba;--green:#116350;--gold:#785114;font:15px/1.6 "Inter","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;border-top:4px solid #16253c;background:#eff3fa;color:var(--ink)}a{color:var(--blue);text-underline-offset:.18em}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}[hidden]{display:none!important}:focus-visible{outline:3px solid #2776ce;outline-offset:3px}
main{width:min(1360px,calc(100% - 2rem));margin:2rem auto 3rem}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.7rem,4vw,2.15rem);line-height:1.2;margin-bottom:1rem}h2{font-size:1.35rem}h3{font-size:1.03rem}
.shell{border:1px solid var(--line);border-radius:10px;background:white;padding:1.25rem 1.5rem 1.5rem}.nav,.tabs,.row,.actions,.heading{display:flex;align-items:center;gap:.68rem;flex-wrap:wrap}.nav,.tabs{gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem}.nav a,.tabs a{color:#2d4c73;text-decoration:none;padding:.57rem .51rem;border-bottom:2px solid transparent}.nav [aria-current],.tabs [aria-current]{color:var(--blue);font-weight:730;border-color:var(--blue)}.heading{justify-content:space-between;align-items:flex-end;margin-bottom:1rem}.muted,.meta{color:var(--muted)}.meta{font-size:.84rem}
.panel{border:1px solid var(--line);border-radius:8px;padding:1rem;min-width:0}.stack>*+*{margin-top:.75rem}.scroll{overflow:auto}table{width:100%;text-align:left;border-collapse:collapse;font-size:.9rem;min-width:515px}th,td{border-bottom:1px solid var(--line);padding:.68rem;vertical-align:top}th{background:var(--fill);color:#375273}td:last-child{min-width:122px}.btn{display:inline-flex;align-items:center;text-decoration:none;justify-content:center;min-height:36px;border:1px solid #aabbd7;border-radius:6px;background:white;color:#294878;font-size:.88rem;font-weight:700;padding:.39rem .61rem}.btn:hover{background:#f0f5ff}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#193ca6}.btn.danger{color:#9a2141}
.label{display:inline-block;background:#edf3fa;color:#315578;font-size:.75rem;font-weight:700;border-radius:4px;padding:.13rem .38rem;white-space:nowrap}.label.good{color:var(--green);background:#e2f5ef}.label.warn{color:var(--gold);background:#fff4dc}.notice{background:#edf4ff;color:#284b77;border-inline-start:3px solid #557fc7;padding:.7rem .85rem;border-radius:5px}.notice.warn{background:#fff6e4;color:var(--gold);border-color:#b18435}
label.field{display:grid;gap:.28rem;font-size:.88rem;color:#405a78;min-width:0}input:not([type=checkbox]),select{width:100%;min-width:0;border:1px solid #aabbd1;border-radius:6px;background:white;color:var(--ink);min-height:37px;padding:.42rem .54rem}input[type=checkbox]{accent-color:var(--blue)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.62rem}.two{grid-template-columns:repeat(2,minmax(0,1fr))}fieldset{border:1px solid var(--line);border-radius:7px;padding:.65rem .8rem;min-width:0}fieldset label{margin:.2rem .55rem .2rem 0;display:inline-flex;align-items:center;gap:.3rem}.pair{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:.85rem}.scroller{min-width:0}.lists{margin:.5rem 0;padding-inline-start:1.35rem}.gap{margin-top:.75rem}.search{max-width:340px}
dialog{width:min(750px,calc(100% - 1.4rem));max-height:86vh;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:1.1rem 1.2rem}dialog::backdrop{background:#13294583}dialog .actions{justify-content:flex-end}.inline{border:0;background:none;color:var(--blue);text-decoration:underline;text-underline-offset:.17em;padding:.25rem}
.toast{position:fixed;bottom:1.05rem;right:1.05rem;background:#213b62;color:white;border-radius:8px;padding:.65rem .85rem;max-width:calc(100vw - 2rem)}
@media(max-width:760px){.pair,.fields{grid-template-columns:1fr}.shell{padding:.9rem}main{margin:1rem auto}.nav a,.tabs a{font-size:.85rem;padding:.48rem .35rem}}
</style>
</head>
<body>
<main>
<h1>系统管理</h1>
<section class="shell" aria-label="系统管理预览">
<nav class="nav" aria-label="系统管理">
  <a href="admin-workspace.html#ldap">认证配置</a>
  <a href="#/users" data-nav="users">用户管理</a>
  <a href="#/access" data-nav="access">权限配置</a>
  <a href="#/roles" data-nav="roles">角色配置</a>
  <a href="admin-workspace.html#audit">操作审计</a>
  <a href="admin-workspace.html#password">修改密码</a>
</nav>
<div id="app"></div>
</section>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<p id="toast" class="toast" role="status" hidden></p>
<script>
"use strict";
const app = document.querySelector("#app");
const dialog = document.querySelector("#dialog");
const toast = document.querySelector("#toast");
const diag = "findings:read", wiki = "wiki:read";
const actions = {
  [diag]: {name:"历史诊断查看",module:"诊断控制台",state:"已开放",intro:"覆盖现有列表、汇总与详情"},
  [wiki]: {name:"Wiki 阅读",module:"运维知识库",state:"只读试点",intro:"仅访问获授权范围内的已发布知识"},
  "wiki:publish": {name:"发布与来源同步",module:"运维知识库",state:"沿用现有权限",intro:"角色配置首批不提供委派"},
  "findings:review": {name:"AI 复核及结论保存",module:"诊断控制台",state:"沿用现有权限",intro:"独立委派待评审"},
  admin: {name:"资源与系统管理",module:"平台管理",state:"预置角色",intro:"继续按现有管理员边界执行"}
};
const environments = {
  研发:[{id:"dev-k8s",names:["platform","sandbox"]}],
  测试:[{id:"test-a",names:["checkout","sandbox"]}],
  预发布:[{id:"stg-yunfan",businesses:{云帆:["yunfan-api","yunfan-jobs"]}}],
  生产:[{id:"prod-shared",businesses:{支付:["checkout","checkout-worker"],云帆:["yunfan-api","yunfan-jobs"]}},{id:"prod-pay",businesses:{支付:["pay-core"]}}]
};
const roles = [
  {id:"system",name:"系统管理员",fixed:true,grants:[]},
  {id:"guest",name:"访客只读",fixed:true,grants:[{key:diag,env:"研发"},{key:diag,env:"测试"}]},
  {id:"prod-reader",name:"生产值班观察",grants:[{key:diag,env:"生产",cluster:"prod-shared",business:"支付",namespace:"checkout"}]}
];
const groups = [{name:"生产值班组",roles:["prod-reader"]}];
const users = [{name:"李晨",type:"LDAP 员工",roles:["prod-reader"],groups:["生产值班组"]},{name:"管理员示例",roles:["system"]},{name:"访客示例",roles:["guest"]}];
let pilot = false;
let toastTimer;
let draft;
let original;
let focusedPage = "access";
let roleReturn = "#/roles";
const esc = (s="") => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
const role = id => roles.find(item=>item.id===id);
const getAction = key => actions[key].name;
const label = (s,kind="") => '<span class="label '+kind+'">'+esc(s)+'</span>';
const link = (text,path,kind="") => '<a class="btn '+kind+'" href="'+esc(path)+'">'+esc(text)+'</a>';
const btn = (text,action,id="",kind="") => '<button type="button" class="btn '+kind+'" data-action="'+action+'" data-id="'+esc(id)+'">'+esc(text)+'</button>';
const heading = (title,desc,tools="") => '<header class="heading"><div><h2 tabindex="-1">'+esc(title)+'</h2><p class="meta">'+esc(desc)+'</p></div><div class="actions">'+tools+'</div></header>';
const opt = (list,value) => list.map(([id,name])=>'<option value="'+esc(id)+'"'+(id===value?" selected":"")+'>'+esc(name)+'</option>').join("");
const scope = grant => [grant.env,grant.cluster||"全部实例",grant.business,grant.namespace||"全部命名空间"].filter(Boolean).join(" / ");
const grantKey = grant => [grant.key,grant.env,grant.cluster||"",grant.business||"",grant.namespace||""].join("|");
function refs(id) {
  return {users:users.filter(user=>user.roles.includes(id)),groups:groups.filter(group=>group.roles.includes(id))};
}
function table(headers,rows) {
  return '<div class="scroll" tabindex="0" role="region" aria-label="配置表格"><table><thead><tr>'+
    headers.map(name=>'<th scope="col">'+name+'</th>').join("")+'</tr></thead><tbody>'+
    rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
}
function notify(text){toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true;},3000);}
function openDialog(title,body){
  dialog.innerHTML='<div class="stack"><h3 id="dialog-title">'+esc(title)+'</h3>'+body+'</div>';
  if(!dialog.open)dialog.showModal();
}
function go(path){if(dialog.open)dialog.close();if(location.hash===path)render();else location.hash=path;}
function listPage(isAccess,kind,params) {
  roleReturn=location.hash||"#/access";
  const name=isAccess?"权限配置":"角色配置";
  const intro=isAccess?"查看角色引用，维护用户组到角色的关联。":"为角色选择权限动作和资源范围。";
  const tabs=isAccess?'<nav class="tabs" aria-label="权限配置内容"><a href="#/access"'+(kind==="groups"?"":' aria-current="page"')+'>角色</a><a href="#/access/groups"'+(kind==="groups"?' aria-current="page"':"")+'>用户组</a></nav>':"";
  const top=heading(name,intro,kind==="groups"?link("查看现有用户组管理","../../system-management/prototype.html#permissions"):
    (isAccess?"":link("权限目录","#/roles/catalog"))+link("＋ 新建角色","#/roles/new","primary"));
  if(kind==="groups")return top+'<section class="panel">'+tabs+table(["用户组","关联角色","成员","操作"],groups.map(group=>[
    esc(group.name),group.roles.map(id=>'<a href="#/roles/'+id+'">'+esc(role(id).name)+'</a>').join("、"),"1 人",
    link("查看现有授权","../../system-management/prototype.html#permissions")]))+'</section>';
  const q=(params.get("q")||"").trim();
  const shown=roles.filter(item=>item.name.toLowerCase().includes(q.toLowerCase()));
  const filter=isAccess?"":'<form id="search" class="row gap"><label for="q">搜索角色</label><div class="search"><input type="search" id="q" name="q" value="'+esc(q)+'" placeholder="输入角色名称"></div><button class="btn">查询</button><a href="#/roles">重置</a></form>';
  return top+'<section class="panel stack">'+tabs+filter+
    (shown.length?table(["角色",isAccess?"范围":"权限摘要","引用","操作"],shown.map(item=>{
      const ref=refs(item.id);
      let listing=item.id==="system"?"全局管理":item.grants.length+" 项权限";
      if(item.id==="guest")listing="2 项历史诊断权限";
      const operation=item.fixed?link("查看","#/roles/"+item.id)+label("禁止删除"):
        isAccess?link("编辑角色","#/roles/"+item.id):link("编辑","#/roles/"+item.id)+
        (ref.users.length+ref.groups.length?'<button class="btn" disabled>删除</button>':btn("删除","delete",item.id,"danger"));
      return ['<strong>'+esc(item.name)+'</strong> '+(item.fixed?label("预置"):""),
        esc(listing)+(isAccess||item.id==="system"?"":'<p class="meta">'+esc([...new Set(item.grants.map(g=>getAction(g.key)))].join("、"))+'</p>'),
        '<button class="inline" data-action="refs" data-id="'+item.id+'">'+(ref.users.length+ref.groups.length)+' 处</button>',
        '<div class="actions">'+operation+'</div>'];
    })):'<p class="notice">暂无匹配角色。可重置搜索条件。</p>')+'</section>';
}
function grantList(grants, editable=false) {
  if(!grants.length)return '<p class="notice">暂无权限条目。</p>';
  return table(["权限动作","资源范围",...(editable?["操作"]:[])],grants.map((grant,i)=>[
    esc(getAction(grant.key)),esc(scope(grant)),...(editable?[btn("移除","remove",String(i),"danger")]:[])
  ]));
}
function editPage(id) {
  const current=role(id);
  if(current?.fixed)return heading(current.name,"预置角色",link("返回列表",roleReturn))+
    '<div class="panel stack"><p class="notice">权限固定，禁止编辑和删除。</p>'+
    (id==="system"?'<h3>现有能力</h3><p>全局诊断、资源管理、系统管理、操作审计与现有知识库管理权限。</p>':grantList(current.grants))+
    btn("查看引用","refs",current.id)+'</div>';
  if(!current&&id!=="new")return heading("角色不存在","",link("返回列表",roleReturn));
  original = current;
  draft = {id,name:current?.name||"",grants:current?.grants.map(g=>({...g}))||[]};
  return heading(current?"编辑角色":"新建角色","为每个动作指定相应资源范围。",link("返回列表",roleReturn))+
    '<div class="pair"><div class="panel stack"><label class="field">角色名称<input data-name maxlength="128" value="'+esc(draft.name)+'" placeholder="输入便于授权时识别的名称"></label>'+
    '<h3>待保存权限</h3><div data-grants>'+grantList(draft.grants,true)+'</div>'+
    '<div class="actions">'+btn("预览变更","preview","","primary")+link("取消",roleReturn)+'</div><p id="edit-error" role="status" class="notice warn" hidden></p></div>'+
    '<div class="panel stack"><h3>添加权限</h3><form id="grant-form" class="stack"><label class="field">模块与动作<select name="key">'+
    opt([[diag,"诊断控制台 · 历史诊断查看"],...(pilot?[[wiki,"运维知识库 · Wiki 阅读"]]:[])],diag)+
    '</select></label><label class="field">环境<select name="env">'+opt(Object.keys(environments).map(key=>[key,key]),"研发")+
    '</select></label><div id="range-fields" class="stack"></div><button class="btn">添加权限</button></form>'+
    '<p class="meta">Wiki 阅读仅在已开启只读试点时可配置。</p></div></div>';
}
function ranges(form, reuseCluster=true, reuseBusiness=true) {
  const env=form.elements.env.value, key=form.elements.key.value;
  const strict=["预发布","生产"].includes(env);
  const requiresTarget=strict||key===wiki;
  const previous=reuseCluster?form.elements.cluster?.value:"";
  const clusters=environments[env];
  const cluster=clusters.find(entry=>entry.id===previous)|| (requiresTarget?clusters[0]:undefined);
  const candidate=reuseBusiness?form.elements.business?.value:"";
  const businesses=Object.keys(cluster?.businesses||{});
  const business=businesses.includes(candidate)?candidate:businesses[0];
  const names=cluster?.businesses?.[business]||cluster?.names||[];
  form.querySelector("#range-fields").innerHTML='<label class="field">集群实例<select name="cluster">'+
    (!requiresTarget?'<option value="">全部实例</option>':"")+opt(clusters.map(item=>[item.id,item.id]),cluster?.id)+'</select></label>'+
    (strict?'<label class="field">业务线<select name="business">'+opt(businesses.map(name=>[name,name]),business)+'</select></label>':"")+
    (cluster?'<fieldset><legend>命名空间'+(requiresTarget?"（必选）":"（不选时为全部）")+'</legend>'+
    names.map(name=>'<label><input type="checkbox" name="namespace" value="'+esc(name)+'">'+esc(name)+'</label>').join("")+'</fieldset>':"");
}
function catalogue() {
  return heading("权限目录","查看平台动作在本阶段的分配边界。",link("返回角色配置","#/roles"))+
    '<div class="panel stack"><label><input id="pilot" type="checkbox"'+(pilot?" checked":"")+'> 模拟开启 Wiki 只读试点</label>'+
    table(["模块","动作","状态","说明"],Object.entries(actions).map(([key,a])=>[
      esc(a.module),esc(a.name),key===wiki?label(pilot?"试点可选":"默认关闭",pilot?"good":"warn"):label(a.state),
      esc(a.intro)]))+'</div>';
}
function userPage() {
  const user=users[0];
  const assignments=new Map();
  const collect=(id,source)=>role(id).grants.forEach(grant=>{
    const key=grantKey(grant);
    const entry=assignments.get(key)||{grant,sources:[]};
    entry.sources.push(source+" → "+role(id).name);
    assignments.set(key,entry);
  });
  user.roles.forEach(id=>collect(id,"直接角色"));
  groups.filter(group=>user.groups.includes(group.name)).forEach(group=>group.roles.forEach(id=>collect(id,group.name)));
  return heading("用户管理","核对角色配置保存后，现有授权来源如何展示。",link("打开现有用户管理","../../system-management/prototype.html#users"))+
    '<div class="panel stack"><div class="row"><h3>'+esc(user.name)+'</h3>'+label(user.type)+'</div>'+
    '<p>直接角色 '+user.roles.map(id=>'<a href="#/roles/'+id+'">'+esc(role(id).name)+'</a>').join("、")+'</p>'+
    '<p>用户组 <a href="#/access/groups">'+esc(user.groups.join("、"))+'</a></p><h3>生效权限</h3>'+
    table(["权限","范围","全部来源"],[...assignments.values()].map(({grant,sources})=>[
      esc(getAction(grant.key)),esc(scope(grant)),sources.map(source=>'<div>'+esc(source)+'</div>').join("")
    ]))+'</div>';
}
function render() {
  const [path,query]=location.hash.slice(2).split("?");
  const [page,id]=path.split("/");
  focusedPage=["roles","users"].includes(page)?page:"access";
  document.querySelectorAll("[data-nav]").forEach(node=>{
    if(node.dataset.nav===focusedPage)node.setAttribute("aria-current","page");else node.removeAttribute("aria-current");
  });
  const params=new URLSearchParams(query);
  app.innerHTML=page==="users"?userPage():page==="roles"&&id==="catalog"?catalogue():page==="roles"&&id?editPage(id):listPage(page!=="roles",id,params);
  const form=document.querySelector("#grant-form");
  if(form)ranges(form,false,false);
}
function refreshGrants(){document.querySelector("[data-grants]").innerHTML=grantList(draft.grants,true);}
function feedback(text=""){const error=document.querySelector("#edit-error");error.textContent=text;error.hidden=!text;}
function showPreview(){
  draft.name=document.querySelector("[data-name]").value.trim();
  if(!draft.name||!draft.grants.length){feedback("请填写角色名称，并添加至少一项权限。");return;}
  if(roles.some(item=>item.id!==draft.id&&item.name===draft.name)){feedback("角色名称已存在。");return;}
  const before=original?.grants||[];
  const additions=draft.grants.filter(grant=>!before.some(item=>grantKey(item)===grantKey(grant)));
  const removals=before.filter(grant=>!draft.grants.some(item=>grantKey(item)===grantKey(grant)));
  const ref=refs(draft.id);
  feedback();
  openDialog("保存前预览",'<p><strong>'+esc(draft.name)+'</strong> · 直接用户引用 '+ref.users.length+' 处 · 用户组引用 '+ref.groups.length+' 处</p>'+
    '<h3>新增权限</h3>'+grantList(additions)+'<h3>移除权限</h3>'+grantList(removals)+
    '<div class="actions">'+btn("取消","close")+btn("确认保存","save","","primary")+'</div>');
}
app.addEventListener("input",event=>{
  if(event.target.id==="pilot"){pilot=event.target.checked;return;}
  if(event.target.matches("[data-name]"))feedback();
});
app.addEventListener("change",event=>{
  const field=event.target, form=field.form;
  if(form?.id!=="grant-form")return;
  if(field.name==="env"||field.name==="key")ranges(form,false,false);
  if(field.name==="cluster")ranges(form,true,false);
  if(field.name==="business")ranges(form);
});
app.addEventListener("submit",event=>{
  event.preventDefault();
  const form=event.target, data=new FormData(form);
  if(form.id==="search"){
    const q=data.get("q").trim();go(q?"#/roles?q="+encodeURIComponent(q):"#/roles");return;
  }
  if(form.id!=="grant-form")return;
  const key=data.get("key"),env=data.get("env"),cluster=data.get("cluster"),business=data.get("business")||"";
  const namespaces=data.getAll("namespace");
  if((key===wiki||["预发布","生产"].includes(env))&&(!cluster||!namespaces.length)){feedback("当前动作和环境必须选择具体命名空间。");return;}
  let added=0;
  for(const namespace of namespaces.length?namespaces:[""]){
    const grant={key,env,cluster,business,namespace};
    if(draft.grants.some(item=>grantKey(item)===grantKey(grant)))continue;
    draft.grants.push(grant);added++;
  }
  feedback(added?"":"该动作和范围已经存在。");
  refreshGrants();
});
document.addEventListener("click",event=>{
  const control=event.target.closest("[data-action]");
  if(!control)return;
  const {action,id}=control.dataset;
  if(action==="remove"){draft.grants.splice(Number(id),1);refreshGrants();feedback();}
  if(action==="preview")showPreview();
  if(action==="close")dialog.close();
  if(action==="save"){
    if(original)Object.assign(original,draft);
    else roles.push({...draft,id:"custom-"+roles.length});
    go(roleReturn);notify("模拟保存成功。已有引用继续使用同一角色 ID。");
  }
  if(action==="refs"){
    const ref=refs(id);
    openDialog("角色引用",'<p>直接用户 '+esc(ref.users.map(user=>user.name).join("、")||"无")+'</p><p>用户组 '+esc(ref.groups.map(group=>group.name).join("、")||"无")+
      '</p><div class="actions">'+link("查看用户","#/users")+link("查看用户组","#/access/groups")+btn("关闭","close")+'</div>');
  }
  if(action==="delete"){
    const item=role(id),ref=refs(id);
    if(item.fixed||ref.users.length||ref.groups.length)return;
    openDialog("删除角色",'<p>确认删除「'+esc(item.name)+'」？</p><div class="actions">'+btn("取消","close")+btn("确认删除","delete-confirm",id,"danger")+'</div>');
  }
  if(action==="delete-confirm"){roles.splice(roles.findIndex(item=>item.id===id),1);dialog.close();render();notify("角色已删除。");}
});
window.addEventListener("hashchange",()=>{if(dialog.open)dialog.close();render();app.querySelector("h2")?.focus();});
render();
</script>
</body>
</html>
