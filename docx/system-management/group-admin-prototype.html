<main>
<p class="crumb">系统管理 / 权限配置</p><div class="header"><h1>权限配置</h1><p>通过用户组继承角色，按接口动作和数据范围配置授权。</p><a href="permission-catalog.html">权限目录</a></div>
<div class="notice" id="notice" role="status" hidden></div>
<section class="panel">
<nav class="tabset" aria-label="权限配置"><button type="button" id="rolesTab" aria-pressed="true">角色配置</button><button type="button" id="groupsTab" aria-pressed="false">用户组</button></nav>
<div id="roles">
<div class="section-header"><div><h2>编辑角色 · 值班 SRE</h2><p class="summary">选择接口权限</p></div><button class="btn primary" id="saveRole">保存角色</button></div>
<div class="workspace"><div class="matrix"><nav class="modtabs" id="moduleTabs" aria-label="权限模块"></nav>
<div class="filters"><input type="search" id="query" placeholder="搜索功能、权限编码或接口" aria-label="搜索权限点"><select id="kit" aria-label="工具集合"></select><select id="filter" aria-label="权限状态"><option value="">全部权限</option><option value="risk">高风险</option><option value="selected">待添加</option><option value="configured">已加入清单</option></select></div>
<div class="toolbar"><label class="batch"><input id="allVisible" type="checkbox">批量勾选当前结果</label><span class="summary" id="selectionStatus" role="status"></span><button type="button" class="btn" id="clearPicks">清空待添加</button></div>
<div class="table-scroll" role="region" aria-label="增删改查权限矩阵" tabindex="0"><table class="permissions"><thead><tr><th scope="col">功能点</th><th scope="col">增 · 新增</th><th scope="col">删 · 撤销</th><th scope="col">改 · 变更</th><th scope="col">查 · 查询</th></tr></thead><tbody id="matrix"></tbody></table></div></div>
<aside class="details" tabindex="-1" id="detail" aria-label="接口权限详情"><h3>接口权限详情</h3><div id="detailBody"></div></aside></div>
<div class="ledger"><div class="ledger-body"><div class="ledger-scope">
<label id="grantKindLabel" hidden>本次添加的范围类型 <select id="grantKind" aria-label="本次添加的范围类型" disabled></select></label>
<label for="grantScope">数据范围</label><select id="grantScope" aria-label="数据范围"></select><button class="btn primary" id="addGrants">添加到授权清单</button></div>
<p class="status" role="status" id="roleStatus"></p><h3>授权清单</h3><ul class="grants" id="grants"></ul></div></div></div>
<div id="groups" hidden><div class="section-header"><div><h2>用户组</h2><p class="summary">查看组角色和管理员继承来源。</p></div><button class="btn primary" id="newGroup">＋ 新建用户组</button></div>
<div class="group-content"><div class="table-scroll"><table class="groups"><thead><tr><th scope="col">用户组</th><th scope="col">关联角色</th><th scope="col">成员</th><th scope="col">操作</th></tr></thead><tbody id="groupRows"></tbody></table></div></div></div>
</section>
</main></div>
<dialog id="groupDialog" aria-labelledby="groupTitle">
<form id="groupForm" class="group-form"><div class="dialog-head"><h2 id="groupTitle"></h2><button type="button" class="btn" data-close="groupDialog">关闭</button></div>
<div class="dialog-body"><label class="field">用户组名称<input id="groupName" required maxlength="80"></label><label class="field">用途<input id="groupDescription" maxlength="256"></label>
<fieldset><legend>关联角色</legend>
<label class="role-choice"><input type="checkbox" name="groupRole" value="platform">平台管理</label>
<label class="role-choice"><input type="checkbox" name="groupRole" value="guest">访客只读</label>
<label class="role-choice"><input type="checkbox" name="groupRole" value="admin" id="adminRole">系统管理员 <span class="tag risk">全局管理</span></label>
<p class="role-note" id="groupRule"></p></fieldset>
<div class="impact" id="groupImpact" hidden></div><p class="status" role="status" id="groupStatus"></p></div>
<div class="dialog-foot"><button type="button" class="btn" data-close="groupDialog">取消</button><button type="submit" class="btn primary" id="saveGroup">保存用户组</button></div></form></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><div class="dialog-head"><h2 id="confirmTitle">核对变更</h2><button type="button" class="btn" data-close="confirmDialog">关闭</button></div><div class="dialog-body" id="confirmBody"></div><div class="dialog-foot"><button type="button" class="btn" data-close="confirmDialog">返回编辑</button><button type="button" id="confirmSave" class="btn primary">确认保存</button></div></dialog>
<dialog id="membersDialog" aria-labelledby="membersTitle"><div class="dialog-head"><h2 id="membersTitle">成员生效权限</h2><button type="button" class="btn" data-close="membersDialog">关闭</button></div><div class="dialog-body" id="membersBody"></div></dialog>

<script>
const catalog = JSON.parse(document.getElementById("catalog").textContent);
const $ = id => document.getElementById(id);
const html = value => String(value ?? "").replace(/[&<>"']/g, letter => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[letter]);
const points = new Map(catalog.rows.flatMap(feature => feature.points.map(point => [point.code, {...point, feature}])));
const columns = ["C","D","U","R"];
const sampleScopes = {
  test: ["资源范围","测试 / 华东测试集群 / 支付测试命名空间"],
  testAll: ["资源范围","测试 / 整个环境"],
  prod: ["资源范围","生产 / 华东生产集群 / 支付业务线 / 支付命名空间"],
  testCluster: ["集群实例","测试 / 华东测试集群"],
  prodCluster: ["集群实例","生产 / 华东生产集群"],
  global: ["平台全局","平台全局"],
  self: ["仅本人","仅本人"]
};
const roleNames = {platform:"平台管理",guest:"访客只读",admin:"系统管理员"};
const members = new Map([["lin",{name:"林晨",direct:false}],["li",{name:"李伟",direct:true}],["zhou",{name:"周敏",direct:false}]]);
const groups = new Map([
  ["ops",{name:"运维组 ops",description:"负责平台日常运维",roles:["platform"],members:["lin","li","zhou"]}],
  ["incident",{name:"应急值守组",description:"负责生产应急值守",roles:["admin"],members:["zhou"]}]
]);
let moduleKey = "diagnosis";
let active = "diagnosis.finding.list";
let editingGroup = null;
let confirmAction = null;
let groupIndex = 1;
const picked = new Set();
let saved = new Map([["diagnosis.finding.list@test",{code:"diagnosis.finding.list",scope:"test"}]]);
const draft = new Map(saved);
const editable = code => !points.get(code)?.restricted;
const actorSuper = () => $("actor").value === "super";
const roleGroupLabel = role => html(roleNames[role] || role);
const roleKey = (code,scope) => code+"@"+scope;
const scopeKind = code => points.get(code).feature.scope;
const selectedKinds = () => [...new Set([...picked].map(scopeKind))];
const sampleKind = kind => kind === "知识目标" ? "资源范围" : kind;

function renderScopeOptions() {
  const kinds = selectedKinds();
  const kind = $("grantKind");
  const previousKind = kind.value;
  kind.innerHTML = '<option value="">请选择</option>'+kinds.map(value=>'<option>'+html(value)+'</option>').join("");
  if (kinds.includes(previousKind)) kind.value = previousKind;
  $("grantKindLabel").hidden = kind.disabled = kinds.length < 2;
  const type = kinds.length === 1 ? kinds[0] : kind.value;
  const scope = $("grantScope");
  const previousScope = scope.value;
  const matching = Object.entries(sampleScopes).filter(([, entry])=>entry[0] === sampleKind(type));
  scope.innerHTML = matching.length ? matching.map(([key, entry])=>'<option value="'+key+'">'+html(entry[1])+'</option>').join("") : '<option value="">请选择权限点和范围类型</option>';
  if (matching.some(([key])=>key===previousScope)) scope.value = previousScope;
  scope.disabled = !matching.length;
}
$("grantKind").onchange = renderScopeOptions;

function notify(message) { $("notice").textContent = message; $("notice").hidden = false; }
function switchTab(groupTab) {
  $("rolesTab").setAttribute("aria-pressed",String(!groupTab));
  $("groupsTab").setAttribute("aria-pressed",String(groupTab));
  $("roles").hidden=groupTab;
  $("groups").hidden=!groupTab;
  if (groupTab) renderGroups();
}
$("rolesTab").onclick=()=>switchTab(false);
$("groupsTab").onclick=()=>switchTab(true);
$("actor").onchange=()=>{ if ($("groupDialog").open) $("groupDialog").close(); renderGroups(); };

function renderTabs() {
  $("moduleTabs").innerHTML = Object.entries(catalog.modules).map(([key, name]) => '<button type="button" data-module="'+html(key)+'" aria-pressed="'+String(key===moduleKey)+'">'+html(name)+'</button>').join("");
  const kits = [...new Set(catalog.rows.filter(row=>row.module===moduleKey).map(row=>row.toolkit))];
  $("kit").innerHTML = '<option value="">全部工具集合</option>'+kits.map(kit=>'<option>'+html(kit)+'</option>').join("");
}
function visibleRows() {
  const query=$("query").value.trim().toLowerCase(), filter=$("filter").value, toolkit=$("kit").value;
  const configured=new Set([...draft.values()].map(item=>item.code));
  return catalog.rows.filter(row=>row.module===moduleKey&&(!toolkit||row.toolkit===toolkit)).map(row=>({...row, points:row.points.filter(p=>{
    const text=[row.name,row.toolkit,p.label,p.code,p.path,p.method].join(" ").toLowerCase();
    return (!query||text.includes(query))&& (filter!=="risk"||p.risk==="高风险")&&
      (filter!=="selected"||picked.has(p.code))&&(filter!=="configured"||configured.has(p.code));
  })})).filter(row=>row.points.length);
}
function setBatchState(control,codes) {
  const count=codes.filter(code=>picked.has(code)).length;
  control.disabled=!codes.length;
  control.checked=!!codes.length&&count===codes.length;
  control.indeterminate=count>0&&count<codes.length;
}
function renderMatrix() {
  const rows=visibleRows();
  const visible=rows.flatMap(row=>row.points.map(point=>point.code));
  if (!visible.includes(active)) active=visible[0]||"";
  const enabled=visible.filter(editable);
  const configured=new Set([...draft.values()].map(item=>item.code));
  const toolkits=[...new Set(rows.map(row=>row.toolkit))];
  $("matrix").innerHTML=toolkits.map(kit=> {
    const header='<tr class="kit"><th colspan="5"><div class="kithead"><span>'+html(kit)+'</span><label class="batch">勾选本集合 <input type="checkbox" data-kit-batch="'+html(kit)+'" aria-label="'+html("勾选 "+kit)+'"></label></div></th></tr>';
    return header+rows.filter(row=>row.toolkit===kit).map(row=>'<tr><th scope="row">'+html(row.name)+'<small class="desc">'+html(row.desc)+'</small></th>'+columns.map(action=>{
      const items=row.points.filter(point=>point.action===action);
      return '<td>'+(items.length?items.map(p=>'<div class="point" data-checked="'+picked.has(p.code)+'" data-configured="'+configured.has(p.code)+'" data-risk="'+html(p.risk)+'">'+
        '<button class="point-name" type="button" data-detail="'+html(p.code)+'" aria-pressed="'+(active===p.code)+'">'+html(p.label)+'</button>'+
        '<input type="checkbox" data-point="'+html(p.code)+'" aria-label="'+html("勾选 "+p.label)+'" '+(picked.has(p.code)?"checked ":"")+(editable(p.code)?"":'disabled title="现有管理身份"')+'></div>').join(""):'<span class="dash" title="当前无此动作">—</span>')+'</td>';
    }).join("")+'</tr>').join("");
  }).join("")||'<tr><td colspan="5">暂无匹配权限。</td></tr>';
  setBatchState($("allVisible"),enabled);
  for (const box of $("matrix").querySelectorAll("[data-kit-batch]")) {
    setBatchState(box,rows.filter(row=>row.toolkit===box.dataset.kitBatch).flatMap(row=>row.points.map(point=>point.code)).filter(editable));
  }
  $("selectionStatus").textContent="当前结果 "+enabled.filter(code=>picked.has(code)).length+" / "+enabled.length+" 项 · 总待添加 "+picked.size+" 项";
  $("clearPicks").disabled=!picked.size;
  $("addGrants").disabled=!picked.size;
  renderScopeOptions();
  renderDetails();
}
function renderDetails() {
  const p=points.get(active);
  if (!p) { $("detailBody").innerHTML='<p class="summary">选择权限名称查看接口详情。</p>'; return; }
  const paths = new Map([...saved,...draft]);
  const configured = [...paths.entries()].filter(([,item])=>item.code===active).map(([key,item])=>
    '<li>'+html(sampleScopes[item.scope][1])+' · '+(draft.has(key)?(saved.has(key)?"已保存":"待保存"):"待移除")+'</li>').join("");
  $("detailBody").innerHTML='<p class="summary">'+html(p.feature.toolkit+' / '+p.feature.name)+'</p><p class="detail-title">'+html(p.label)+'</p>'+
    '<span class="tag '+(p.risk==="高风险"?"risk":"")+'">'+html(p.risk)+'</span> '+(p.restricted?'<span class="tag">现有管理身份</span>':'')+
    '<dl><div><dt>权限编码</dt><dd><code>'+html(p.code)+'</code></dd></div><div><dt>方法与路径</dt><dd><code>'+html(p.method+" "+p.path)+'</code></dd></div>'+
    '<div><dt>分流与约束</dt><dd>'+html(p.rule||"按实际资源范围校验。")+'</dd></div><div><dt>适用范围</dt><dd>'+html(p.feature.scope)+'</dd></div>'+
    (configured?'<div><dt>角色授权范围</dt><dd><ul>'+configured+'</ul></dd></div>':'')+'</dl>';
}
function applyBatch(codes, checked) {
  for (const code of codes) {
    if (!editable(code)) continue;
    if (checked) picked.add(code);
    else picked.delete(code);
  }
  renderMatrix();
}
$("moduleTabs").onclick=event=>{
  const button=event.target.closest("[data-module]");
  if(!button)return;
  moduleKey=button.dataset.module;renderTabs();renderMatrix();
  $("moduleTabs").querySelector('[aria-pressed="true"]')?.focus();
};
$("query").oninput=renderMatrix;
$("kit").onchange=renderMatrix;
$("filter").onchange=renderMatrix;
$("allVisible").onchange=event=>applyBatch(visibleRows().flatMap(row=>row.points.map(point=>point.code)),event.target.checked);
$("clearPicks").onclick=()=>{picked.clear();renderMatrix();};
$("matrix").onchange=event=>{
  const box=event.target;
  if(box.dataset.point) {
    applyBatch([box.dataset.point],box.checked);
    $("matrix").querySelector('[data-point="'+CSS.escape(box.dataset.point)+'"]')?.focus();
  } else if (box.dataset.kitBatch) {
    applyBatch(visibleRows().filter(row=>row.toolkit===box.dataset.kitBatch).flatMap(row=>row.points.map(point=>point.code)),box.checked);
    [...$("matrix").querySelectorAll("[data-kit-batch]")].find(b=>b.dataset.kitBatch===box.dataset.kitBatch)?.focus();
  }
};
$("matrix").onclick=event=>{
  const button=event.target.closest("[data-detail]");
  if(!button)return;
  active=button.dataset.detail;renderMatrix();
  if (matchMedia("(max-width:850px)").matches) $("detail").focus();
  else $("matrix").querySelector('[data-detail="'+CSS.escape(active)+'"]')?.focus();
};
function diff() {
  return [...[...draft.entries()].filter(([key])=>!saved.has(key)).map(([,v])=>["新增",v]),
          ...[...saved.entries()].filter(([key])=>!draft.has(key)).map(([,v])=>["撤销",v])];
}
function renderGrants() {
  $("grants").innerHTML=[...draft.entries()].map(([key,grant])=>'<li><span><strong>'+html(points.get(grant.code).label)+'</strong> '+
    (points.get(grant.code).risk==="高风险"?'<span class="tag risk">高风险</span> ':"")+
    '<span class="tag '+(saved.has(key)?"good":"")+'">'+(saved.has(key)?"已保存":"待保存")+'</span><small>'+html(sampleScopes[grant.scope][1])+
    '</small></span><button type="button" class="btn" data-remove="'+html(key)+'">移除</button></li>').join("")||'<li>授权清单为空。</li>';
}
$("addGrants").onclick=()=>{
  const kinds=selectedKinds();
  const type=kinds.length===1?kinds[0]:$("grantKind").value;
  const scope=$("grantScope").value;
  if (!type || !scope) {
    $("roleStatus").textContent="请选择本次添加的范围类型。";
    $("grantKind").focus();
    return;
  }
  const before=draft.size;
  for (const code of picked) {
    if (scopeKind(code)!==type) continue;
    draft.set(roleKey(code,scope),{code,scope});
    picked.delete(code);
  }
  const added=draft.size-before;
  renderMatrix();renderGrants();
  const result=added?"已加入 "+added+" 项，保存角色后生效。":"这些授权已在清单中。";
  $("roleStatus").textContent=result+(picked.size?"还有 "+picked.size+" 项待添加。":"");
};
$("grants").onclick=event=>{
  const remove=event.target.closest("[data-remove]");
  if (!remove) return;
  draft.delete(remove.dataset.remove);renderGrants();renderMatrix();
  $("roleStatus").textContent="已从草稿清单移除，保存角色后生效。";
};
function confirm(title,description,action) {
  $("confirmTitle").textContent=title;
  $("confirmBody").innerHTML=description;
  confirmAction=action;
  $("confirmDialog").showModal();
}
$("confirmSave").onclick=()=>{
  $("confirmDialog").close();
  const action=confirmAction;confirmAction=null;action?.();
};
$("saveRole").onclick=()=>{
  if (picked.size) { $("roleStatus").textContent="还有 "+picked.size+" 项待添加，请先加入清单或清空选择。"; return; }
  const changes=diff();
  if (!changes.length) { $("roleStatus").textContent="当前没有需要保存的改动。";return; }
  const risk=changes.filter(([,grant])=>points.get(grant.code).risk==="高风险").length;
  confirm("核对角色授权",'<p>角色 · 值班 SRE '+(risk?'<span class="tag risk">'+risk+' 项高风险变更</span>':'')+'</p><ul class="diff-list">'+
    changes.map(([kind,grant])=>'<li><strong>'+kind+' · '+html(points.get(grant.code).label)+'</strong><small>'+html(sampleScopes[grant.scope][1])+'</small></li>').join("")+'</ul>',()=>{
      saved=new Map(draft);renderGrants();renderMatrix();
      $("roleStatus").textContent="已保存。清单内的角色授权在原型中已生效。";
      notify("角色「值班 SRE」已保存，"+changes.length+" 项授权变更已生效。");
    });
};
function adminSources(id, groupID, replacement) {
  const sources=members.get(id)?.direct?["直接授予"]:[];
  for (const [key,group] of groups) {
    const roles=key===groupID&&replacement?replacement:group.roles;
    if (group.members.includes(id)&&roles.includes("admin")) sources.push("用户组 "+group.name);
  }
  return sources;
}
function renderGroups() {
  $("groupRows").innerHTML=[...groups.entries()].map(([id,group])=>'<tr><th scope="row">'+html(group.name)+'<small class="desc">'+html(group.description)+'</small></th><td>'+
    group.roles.map(role=>'<span class="tag '+(role==="admin"?"risk":"")+'">'+roleGroupLabel(role)+'</span> ').join("")+'</td><td>'+group.members.length+' 人</td><td>'+
    '<button type="button" class="btn" data-edit-group="'+html(id)+'">'+(group.roles.includes("admin")&&!actorSuper()?"查看":"编辑")+'</button> '+
    '<button type="button" class="btn" data-members="'+html(id)+'">查看成员权限</button></td></tr>').join("");
}
function readGroupRoles() {
  return [...$("groupForm").querySelectorAll('input[name="groupRole"]:checked')].map(input=>input.value);
}
function describeImpact(group,next) {
  const prior=group?.roles??[], enabled=next.includes("admin");
  const current=group?.members??[];
  if (prior.includes("admin")===enabled) return "";
  if (!current.length) return enabled
    ? '<p><strong>将关联全局管理角色</strong></p><p>当前成员 0 人。后续加入的符合条件的员工将继承系统管理员。</p>'
    : '<p>当前成员 0 人。保存后该组取消关联「系统管理员」。</p>';
  const changed=current.filter(id=>Boolean(adminSources(id,editingGroup).length)!==Boolean(adminSources(id,editingGroup,next).length));
  const retained=current.filter(id=>adminSources(id,editingGroup).length&&adminSources(id,editingGroup,next).length);
  return '<p><strong>'+(enabled?"将关联":"将取消关联")+'系统管理员</strong></p><p>当前成员 '+current.length+' 人 · '+(enabled?"新增管理员":"失去管理员")+' '+changed.length+
    ' 人 · 另有 '+retained.length+' 人保留其他管理员来源。'+(changed.length?" 受影响账号需重新登录。":"")+'</p>'+
    (changed.length?'<p>受影响成员 · '+changed.map(id=>html(members.get(id).name)).join("、")+'</p>':'');
}
function drawGroupImpact() {
  const description=describeImpact(groups.get(editingGroup),readGroupRoles());
  $("groupImpact").innerHTML=description;$("groupImpact").hidden=!description;
}
function openGroup(id=null) {
  editingGroup=id;const group=groups.get(id);
  const locked=group?.roles.includes("admin")&&!actorSuper();
  $("groupTitle").textContent=group?(locked?"查看用户组":"编辑用户组"):"新建用户组";
  $("groupName").value=group?.name??"";
  $("groupDescription").value=group?.description??"";
  $("groupName").readOnly=Boolean(locked);$("groupDescription").readOnly=Boolean(locked);
  for(const input of $("groupForm").querySelectorAll('input[name="groupRole"]')) {
    input.checked=group?.roles.includes(input.value)??false;
    input.disabled=Boolean(locked)||input.value==="admin"&&!actorSuper();
  }
  $("groupRule").textContent=actorSuper()?"角色保存后，符合条件的员工通过用户组继承相应权限。":"仅超级管理员可调整管理员组角色和成员。";
  $("groupStatus").textContent="";$("saveGroup").disabled=Boolean(locked);
  drawGroupImpact();$("groupDialog").showModal();
}
$("newGroup").onclick=()=>openGroup();
$("groupForm").onchange=drawGroupImpact;
$("groupForm").onsubmit=event=>{
  event.preventDefault();const group=groups.get(editingGroup),next=readGroupRoles();
  if (!actorSuper()&&(next.includes("admin")||group?.roles.includes("admin"))) {
    $("groupStatus").textContent="仅超级管理员可调整管理员组。";return;
  }
  const name=$("groupName").value.trim();
  if (!name) {$("groupStatus").textContent="请输入用户组名称。";return;}
  if ([...groups].some(([id,entry])=>id!==editingGroup&&entry.name===name)) {$("groupStatus").textContent="已有同名用户组。";return;}
  const description=$("groupDescription").value.trim(), impact=describeImpact(group,next);
  const save=()=>{
    groups.set(editingGroup??"new-"+groupIndex++,{name,description,roles:next,members:group?.members??[]});
    $("groupDialog").close();renderGroups();
    notify("用户组「"+name+"」已保存。"+(next.includes("admin")?" 成员继承系统管理员的结果可在「查看成员权限」中核对。":""));
  };
  if (impact) confirm("确认管理员角色变更",'<p>用户组 · '+html(name)+'</p><div class="impact">'+impact+'</div>',save);
  else save();
};
$("groupRows").onclick=event=>{
  const edit=event.target.closest("[data-edit-group]");
  if(edit){openGroup(edit.dataset.editGroup);return;}
  const show=event.target.closest("[data-members]");
  const group=show?groups.get(show.dataset.members):null;
  if(!group)return;
  $("membersTitle").textContent=group.name+" · 成员生效权限";
  $("membersBody").innerHTML=group.members.length?'<ul class="diff-list">'+group.members.map(id=>{
    const sources=adminSources(id);
    return '<li><strong>'+html(members.get(id).name)+'</strong><small>'+html(sources.length?"系统管理员 · "+sources.join("、"):"按已有普通角色生效")+'</small></li>';
  }).join("")+'</ul>':'<p>暂无成员。</p>';
  $("membersDialog").showModal();
};
for(const button of document.querySelectorAll("[data-close]"))button.onclick=()=>$(button.dataset.close).close();
renderTabs();renderMatrix();renderGrants();renderGroups();
</script>
</body>
</html>
