<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kube-aiops · 系统管理原型</title>
<style>
:root{color-scheme:light;--ink:#16263a;--muted:#596c82;--line:#dfe6ed;--paper:#fff;--bg:#f2f6f9;--mint:#a8e3cc;--teal:#00664f;--night:#102335;--shadow:0 14px 42px #142b3c15}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Instrument Sans","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #149b7c;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.48}h1,h2,h3,p{margin:0}h1{font-size:35px;letter-spacing:-.04em;line-height:1.2}h2{font-size:19px}h3{font-size:15px}small,.muted{color:var(--muted)}small{font-size:12px}.mono{font:12px "IBM Plex Mono",monospace}.top{height:62px;position:sticky;top:0;z-index:5;background:var(--night);color:#fff;display:flex;align-items:center;padding:0 27px;gap:17px}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:var(--mint);color:#12352e;font-size:18px;font-weight:800}.brand{font-weight:750;font-size:17px;letter-spacing:-.025em}.top .divider{border-left:1px solid #446072;height:21px}.top small{color:#bed0dc}.top .mode{margin-left:auto;display:flex;align-items:center;gap:12px}.top select{background:#20394c;color:#fff;border-color:#466074;max-width:165px}.frame{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 62px)}aside.nav{background:#fff;border-right:1px solid var(--line);padding:32px 17px;min-height:100%}.nav h2{font-size:12px;color:#627689;letter-spacing:.08em;padding:0 11px 12px}.nav button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:none;border:0;color:#405369;border-radius:8px;padding:11px;margin:2px 0}.nav button[aria-current=page]{background:#e0f4ec;color:#005942;font-weight:700}.nav button:hover{background:#edf5f7}.icon{width:20px;text-align:center;font-size:16px}.nav .note{font-size:12px;color:#688092;border-top:1px solid var(--line);margin-top:30px;padding:17px 10px}main{min-width:0;padding:28px 34px 48px;max-width:1750px;width:100%}.bread{font-size:12px;color:#65798e;margin-bottom:16px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}.hero p{margin-top:8px;color:var(--muted)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid #cbd7e0;background:white;border-radius:8px;padding:7px 11px;color:#263e55;font-weight:650;white-space:nowrap}.btn:hover{background:#edf6f4}.btn.primary{background:#00664f;color:#fff;border-color:#00664f}.btn.primary:hover{background:#005440}.btn.danger{color:#a33144}.link{border:0;background:none;color:#00664f;font-weight:700;padding:2px;text-align:left}.link:hover{text-decoration:underline}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 7px #182c3d05;min-width:0}.pad{padding:19px}.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(325px,1fr);gap:17px;align-items:start}.half{grid-template-columns:1fr 1fr}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.stat strong{font-size:25px;line-height:1;color:#174b43;font-variant-numeric:tabular-nums}.filters{padding:14px 14px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filters input[type=search]{flex:1;min-width:140px}.filters select{max-width:150px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th,.table td{border-bottom:1px solid #e8edf2;padding:11px 11px;vertical-align:middle}.table th{font-size:12px;color:#51677a;background:#f6f9fb;font-weight:700;white-space:nowrap}.table tr:last-child td{border-bottom:0}.table tr.active td{background:#eaf7f2}.table tr:hover td{background:#f2f8f8}.user-cell{display:flex;gap:9px;align-items:center;min-width:122px}.avatar{flex:none;width:30px;height:30px;display:grid;place-items:center;background:#e1f0f9;color:#245c82;border-radius:8px;font-weight:750}.avatar.dark{color:#fff;background:#24485f}.avatar.mint{color:#065b47;background:#d9f1e7}.tag{display:inline-block;border-radius:5px;background:#e9eff5;color:#375571;font-size:11px;font-weight:700;padding:2px 6px;white-space:nowrap}.tag.ok{color:#075942;background:#dcf2e7}.tag.bad{color:#9f293b;background:#fbe8ec}.tag.warn{color:#805016;background:#fff0d8}.foot{padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.detailhead{padding:15px 15px 11px;border-bottom:1px solid var(--line)}.detailhead .avatar{width:37px;height:37px}.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 13px;border-bottom:1px solid var(--line)}.tabs button{padding:11px 9px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}.tabs button[aria-selected=true]{color:var(--teal);font-weight:700;border-color:var(--teal)}.scope{padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fbfdfe}.scope p{margin:5px 0}.source{font-size:12px;color:#3c6160;margin:4px 0}.spacer{height:12px}.gridform{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}label.field{display:grid;gap:5px;color:#42566a;font-size:13px;font-weight:650}input:not([type=checkbox]),select{width:100%;border:1px solid #cbd7e0;border-radius:7px;background:white;padding:8px 9px;color:var(--ink);min-width:0}input[type=checkbox]{accent-color:#00664f}.notice{background:#e8f5f0;color:#205746;border:1px solid #c7e5da;border-radius:8px;padding:10px 12px;margin:10px 0}.notice.warn{background:#fff5e7;color:#775016;border-color:#f0dfbf}.stack>*+*{margin-top:11px}.list{padding:0;list-style:none}.list li{padding:11px 0;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}dialog{width:min(580px,calc(100vw - 28px));max-height:calc(100vh - 38px);border:1px solid var(--line);border-radius:14px;padding:0;box-shadow:var(--shadow);color:var(--ink)}dialog::backdrop{background:#101f31a8}dialog header,dialog footer{padding:14px 19px;border-bottom:1px solid var(--line)}dialog footer{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}dialog section{padding:17px 19px}.toast{position:fixed;right:21px;bottom:21px;background:var(--night);color:white;padding:11px 15px;border-radius:9px;z-index:20;box-shadow:var(--shadow);max-width:calc(100vw - 42px)}.toast:empty{display:none}.check{display:flex;align-items:center;gap:8px;padding:8px 0}.hidden{display:none!important}.audit a{color:#00664f}.timeline li{padding-left:13px;border-left:2px solid #b6ded0}.detailbody{padding:14px}.code{background:#132b3c;color:#e9faf5;padding:12px;border-radius:8px;overflow:auto}
@media(max-width:1150px){main{padding:24px 20px}.frame{grid-template-columns:175px 1fr}.split{grid-template-columns:1fr}.half{grid-template-columns:1fr 1fr}}@media(max-width:680px){.top{padding:0 10px;gap:8px}.top .divider,.top .project,.top .mode small{display:none}.frame{display:block}.nav h2,.nav .note,.nav .icon{display:none}aside.nav{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border:0;border-bottom:1px solid var(--line)}.nav button{width:auto;padding:7px;font-size:12px}main{padding:16px 10px}.hero{align-items:start;flex-direction:column}h1{font-size:28px}.half,.gridform{grid-template-columns:1fr}.stats{gap:4px}.stat{padding:7px;display:block}.stat strong{display:block;font-size:19px}.table td,.table th{padding:8px 7px}}
.account-identity { min-width: 0; overflow-wrap: anywhere; }
.account-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 12px }
.account-toolbar .row { margin-inline-start:auto }
.account-bindings { margin:0 }
.account-binding { display:grid; grid-template-columns:minmax(4.5rem,max-content) minmax(0,1fr); align-items:baseline; gap:8px 12px; padding:10px 0; border-bottom:1px solid var(--line) }
.account-binding dt { color:var(--muted); font-weight:650 }
.account-binding dd { margin:0; display:flex; flex-wrap:wrap; gap:6px; overflow-wrap:anywhere }
.account-bindings-footer { display:flex; justify-content:flex-end; margin-top:12px }
</style></head>
<body>
<header class="top"><span class="mark" aria-hidden="true">k</span><span class="brand">kube-aiops</span><span class="divider"></span><small class="project">运维控制台</small><div class="mode"><small>原型身份</small><select id="actor" aria-label="切换原型身份"><option value="super">超级管理员</option><option value="admin">系统管理员</option><option value="ldap">LDAP 员工</option><option value="guest">本地访客</option><option value="temporary">访客待改密</option></select></div></header>
<div class="frame"><aside class="nav" aria-label="系统管理导航" id="nav"></aside><main id="main"></main></div>
<dialog id="dialog"></dialog><div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const $ = (selector, root = document) => root.querySelector(selector);
const all = (selector, root = document) => [...root.querySelectorAll(selector)];
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const state = {
  page:"users", actor:"super", detail:"liwei", tab:"effective", q:"", filter:"", status:"", checked:new Set(), permissionTab:"roles",
  auditFilter:{q:"",type:"",level:""}, tested:false, ldapSteps:[],
  ldap:{address:"ldaps://directory.example.internal:636",bind:"CN=svc-aiops,OU=Service Accounts,DC=example,DC=internal",base:"OU=Employees,DC=example,DC=internal",attribute:"sAMAccountName",range:"整个子树"},
  groups:[{id:"g1",name:"云帆生产观察组",roles:["r1"],desc:"生产业务命名空间历史诊断"},{id:"g2",name:"研测运维组",roles:["r2"],desc:"研发、测试环境诊断查看"}],
  roles:[{id:"guest",name:"访客只读",fixed:true,scopes:[["研发","全部集群","—","全部命名空间"],["测试","全部集群","—","全部命名空间"]]},{id:"admin",name:"系统管理员",fixed:true,scopes:[]},{id:"r1",name:"云帆生产诊断",scopes:[["生产","prod-shared","云帆","yunfan-api"],["生产","prod-shared","云帆","yunfan-jobs"]]},{id:"r2",name:"研发集群观察",scopes:[["研发","dev-k8s","—","全部命名空间"]]},{id:"r3",name:"预发布诊断观察",scopes:[["预发布","stg-yunfan","云帆","yunfan-api"]]}],
  users:[
    {id:"superadmin",name:"超级管理员",type:"super",status:"enabled",roles:["admin"],groups:[],time:"今天 09:12"},
    {id:"ops.liu",name:"刘洋",type:"admin",status:"enabled",roles:["admin"],groups:[],time:"今天 10:32"},
    {id:"liwei",name:"李伟",type:"ldap",status:"enabled",roles:["guest","r1"],groups:["g1"],time:"今天 14:26"},
    {id:"zhangmin",name:"张敏",type:"ldap",status:"enabled",roles:["guest","r3"],groups:["g2"],time:"今天 13:08"},
    {id:"chenyu",name:"陈宇",type:"ldap",status:"disabled",roles:["guest"],groups:["g2"],time:"昨天 18:42"},
    {id:"visitor-qa",name:"测试访客",type:"guest",status:"enabled",roles:["guest"],groups:[],time:"今天 11:06"},
    {id:"visitor-demo",name:"演示访客",type:"guest",status:"temporary",roles:["guest"],groups:[],time:"—"}
  ],
  audits:[
    {time:"2026-11-17 14:28:12",who:"superadmin",type:"批量授予角色",level:"中",target:"liwei、visitor-qa",result:"部分成功",items:[["liwei","成功","已授予云帆生产诊断"],["visitor-qa","失败","本地访客只能关联预置访客角色"]]},
    {time:"2026-11-17 14:26:10",who:"liwei",type:"登录成功",level:"低",target:"liwei",result:"成功"},
    {time:"2026-11-17 14:12:24",who:"LDAP 状态检查",type:"目录停用撤权",level:"高",target:"chenyu",result:"成功"},
    {time:"2026-11-17 11:54:09",who:"zhangmin",type:"登录失败",level:"低",target:"zhangmin",result:"失败",items:[["zhangmin","失败","目录认证未通过"]]},
    {time:"2026-11-17 10:18:34",who:"superadmin",type:"创建系统管理员",level:"高",target:"ops.liu",result:"成功"},
    {time:"2026-11-17 09:45:01",who:"服务器恢复脚本",type:"重置超级管理员密码",level:"高",target:"superadmin",result:"成功"}
  ]
};
const user = id => state.users.find(u => u.id === id);
const role = id => state.roles.find(r => r.id === id);
const group = id => state.groups.find(g => g.id === id);
const admin = () => ["super","admin"].includes(state.actor);
const types = {super:"超级管理员",admin:"系统管理员",ldap:"LDAP 员工",guest:"本地访客"};
const statuses = {enabled:["启用","ok"],disabled:["停用","bad"],temporary:["待改密","warn"]};
const tags = (label,cls="") => '<span class="tag '+cls+'">'+esc(label)+'</span>';
const btn = (text,action,value="",cls="") => '<button type="button" class="btn '+cls+'" data-action="'+action+'" data-value="'+esc(value)+'">'+text+'</button>';
const link = (text,action,value="") => '<button type="button" class="link" data-action="'+action+'" data-value="'+esc(value)+'">'+esc(text)+'</button>';
const choices = (items, value) => items.map(([key,label])=>'<option value="'+esc(key)+'"'+(value===key?' selected':'')+'>'+esc(label)+'</option>').join("");
const avatar = u => '<span class="avatar '+(u.type==="ldap"?"mint":u.type==="guest"?"":"dark")+'">'+esc(u.name.at(0))+'</span>';
const header = (title,description,actions="") => '<div class="bread">系统管理 / '+title+'</div><div class="hero"><div><h1>'+title+'</h1><p>'+description+'</p></div><div class="row">'+actions+'</div></div>';
const audit = (type,target,level="中",items) => state.audits.unshift({time:new Date().toLocaleString("sv-SE"),who:({super:"superadmin",admin:"ops.liu",ldap:"liwei",guest:"visitor-qa",temporary:"visitor-demo"})[state.actor],type,level,target,result:items?.some(i=>i[1]==="失败")?(items.some(i=>i[1]==="成功")?"部分成功":"失败"):"成功",items});
function notify(text){$("#toast").textContent=text;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$("#toast").textContent="",3300)}
function table(headers,rows,empty="暂无符合条件的记录"){
 return '<div class="scroll"><table class="table"><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join("")+'</tr></thead><tbody>'+(rows.join("")||'<tr><td colspan="'+headers.length+'">'+empty+'</td></tr>')+'</tbody></table></div>';
}
function navigate(page){state.page=page;location.hash=page;render()}
const navs=[["users","用户管理","◎"],["ldap","认证配置","◇"],["permissions","权限配置","⊞"],["audit","操作审计","≡"],["password","修改密码","⊙"],["diagnosis","历史诊断","▤"]];
function render(){
 const allowed=admin()?navs.slice(0,5):state.actor==="temporary"?navs.filter(n=>n[0]==="password"):navs.filter(n=>n[0]==="diagnosis"||(state.actor==="guest"&&n[0]==="password"));
 if(!allowed.some(n=>n[0]===state.page))state.page=allowed[0][0];
 $("#nav").innerHTML='<h2>'+(admin()?"系统管理":"我的工作台")+'</h2>'+allowed.map(([id,title,icon])=>'<button type="button" data-action="nav" data-value="'+id+'"'+(state.page===id?' aria-current="page"':'')+'><span class="icon" aria-hidden="true">'+icon+'</span>'+title+'</button>').join("")+'<div class="note">交互原型 · 模拟数据</div>';
 $("#main").innerHTML=({users:usersPage,ldap:ldapPage,permissions:permissionsPage,audit:auditPage,password:passwordPage,diagnosis:diagnosisPage})[state.page]();
}
function effective(u){
 const entries=new Map();
 function add(rid,via){const r=role(rid);if(!r)return;for(const scope of r.scopes){const key=JSON.stringify(scope);if(!entries.has(key))entries.set(key,{scope,sources:[]});entries.get(key).sources.push(via+" → "+r.name)}}
 u.roles.forEach(id=>add(id,"直接授予"));u.groups.forEach(id=>{const g=group(id);g?.roles.forEach(r=>add(r,g.name))});return [...entries.values()];
}
function scopeName(s){return s.filter(v=>v!=="—").join(" / ")}
function userRows(){
 const query=state.q.trim().toLowerCase();
 return state.users.filter(u=>(!query||[u.name,u.id].join(" ").toLowerCase().includes(query))&&(!state.filter||u.type===state.filter)&&(!state.status||u.status===state.status));
}
function usersPage(){
 const rows=userRows();
 const stat=(name,n)=>'<div class="stat panel"><span>'+name+'</span><strong>'+n+'</strong></div>';
 const body=rows.map(u=>'<tr'+(u.id===state.detail?' class="active"':'')+'><td><input type="checkbox" aria-label="选择 '+esc(u.name)+'" data-check="'+esc(u.id)+'" '+(state.checked.has(u.id)?"checked":"")+'></td><td><div class="user-cell">'+avatar(u)+'<div>'+link(u.name,"detail",u.id)+'<br><small class="mono">'+esc(u.id)+'</small></div></div></td><td>'+tags(types[u.type])+'</td><td>'+tags(...statuses[u.status])+'</td><td>'+esc(u.time)+'</td></tr>');
 const filters='<div class="filters"><input aria-label="搜索账号" type="search" id="user-q" placeholder="搜索用户名或账号" value="'+esc(state.q)+'"><select id="user-type" aria-label="账号类型">'+choices([["","全部类型"],...Object.entries(types)],state.filter)+'</select><select id="user-status" aria-label="账号状态">'+choices([["","全部状态"],...Object.entries(statuses).map(([k,[v]])=>[k,v])],state.status)+'</select></div>';
 const selection=state.checked.size?'<div class="filters"><strong>已选 '+state.checked.size+' 项</strong>'+btn("批量授权 / 撤销","assign","batch","primary")+btn("取消选择","clear")+'</div>':"";
 return header("用户管理","管理账号生命周期，并核对每项访问权限的来源。",btn("＋ 创建访客","new-user","guest","primary")+(state.actor==="super"?btn("创建系统管理员","new-user","admin"):""))+
 '<div class="stats">'+stat("平台账号",state.users.length)+stat("LDAP 员工",state.users.filter(u=>u.type==="ldap").length)+stat("本地访客",state.users.filter(u=>u.type==="guest").length)+'</div><div class="split"><section class="panel">'+filters+selection+table(['<input type="checkbox" data-all aria-label="选择当前结果" '+(rows.length&&rows.every(u=>state.checked.has(u.id))?"checked":"")+'>',"账号","类型","状态","最近登录"],body)+'<div class="foot">共 '+rows.length+' 个账号</div></section>'+userDetail(user(state.detail))+'</div>';
}
function userDetail(u){
 if(!u)return '<section class="panel pad">请选择一个账号。</section>';
 const entries=effective(u);
 const tabs=[["effective","生效权限"],["bindings","关联关系"]];
 let content;
 if(state.tab==="bindings"){
  content='<dl class="account-bindings"><div class="account-binding"><dt>用户组</dt><dd>'+(u.groups.map(g=>tags(group(g)?.name)).join("")||'<span class="muted">未加入用户组</span>')+'</dd></div><div class="account-binding"><dt>直接角色</dt><dd>'+(u.roles.map(r=>tags(role(r)?.name)).join("")||'<span class="muted">未分配直接角色</span>')+'</dd></div></dl><footer class="account-bindings-footer">'+(u.type==="ldap"?btn("分配或撤销","assign",u.id,"primary"):'<small class="muted">本地账号通过预置角色获得权限。</small>')+'</footer>';
 }else{
  content=u.status!=="enabled"?'<div class="notice warn">当前账号没有访问权限。启用并完成所需的改密后，按关联角色生效。</div>':["admin","super"].includes(u.type)?'<div class="scope"><strong>全局管理与诊断查看</strong><div class="source">直接授予 → 系统管理员</div></div>':entries.length?entries.map(({scope,sources})=>'<div class="scope"><div class="row between"><strong>历史诊断查看</strong>'+tags(sources.length+" 条来源","ok")+'</div><p>'+esc(scopeName(scope))+'</p>'+sources.map(x=>'<div class="source">'+esc(x)+'</div>').join("")+'</div>').join(""):'<p class="muted">没有生效权限，下次成功登录时恢复访客只读。</p>';
 }
 const actions=["ldap","guest"].includes(u.type)?btn(u.status==="disabled"?"重新启用":"停用","toggle",u.id,u.status==="disabled"?"":"danger")+(u.type==="guest"?btn("重置密码","reset",u.id):""):u.type==="admin"&&state.actor==="super"?btn("删除管理员","remove-admin",u.id,"danger"):"";
 return '<section class="panel"><div class="detailhead stack"><div class="row">'+avatar(u)+'<div class="account-identity"><h2>'+esc(u.name)+'</h2><small class="mono">'+esc(u.id)+'</small></div></div><div class="account-toolbar">'+tags(...statuses[u.status])+'<div class="row">'+actions+'</div></div></div><div class="tabs" role="tablist" aria-label="用户详情">'+tabs.map(([k,v])=>'<button type="button" role="tab" aria-selected="'+(state.tab===k)+'" data-action="user-tab" data-value="'+k+'">'+v+'</button>').join("")+'</div><div class="detailbody">'+content+'</div></section>';
}
function ldapPage(){
