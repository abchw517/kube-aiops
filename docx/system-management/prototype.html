<script>
"use strict";

  page:"users", actor:"super", detail:"liwei", tab:"effective", q:"", filter:"", status:"", checked:new Set(), permissionTab:"roles",
  auditFilter:{q:"",type:"",level:"",batch:""}, auditPage:0, auditPageSize:20, auditAccess:"", retention:{"低":3,"中":5,"高":7},

  ldap:{address:"ldaps://directory.example.internal:636",bind:"CN=svc-aiops,OU=Service Accounts,DC=example,DC=internal",base:"OU=Employees,DC=example,DC=internal",attribute:"sAMAccountName",range:"整个子树",allowPlain:false,passwordConfigured:true},

  roles:[{id:"guest",name:"访客只读",fixed:true,scopes:[["研发","全部集群","—","全部命名空间"],["测试","全部集群","—","全部命名空间"]]},{id:systemAdminRole,name:"系统管理员",fixed:true,scopes:[]},{id:"r1",name:"云帆生产诊断",scopes:[["生产","prod-shared","云帆","yunfan-api"],["生产","prod-shared","云帆","yunfan-jobs"]]},{id:"r2",name:"研发集群观察",scopes:[["研发","dev-k8s","—","全部命名空间"]]},{id:"r3",name:"预发布诊断观察",scopes:[["预发布","stg-yunfan","云帆","yunfan-api"]]}],
  users:[
    {id:"superadmin",name:"超级管理员",type:"super",status:"enabled",roles:[systemAdminRole],groups:[],time:"今天 09:12"},
    {id:"ops.liu",name:"刘洋",type:"admin",status:"enabled",roles:[systemAdminRole],groups:[],time:"今天 10:32"},
    {id:"liwei",name:"李伟",dn:"ldap:cn=李伟,ou=安全组,ou=公共支撑部,ou=研发管理中心,ou=platform-engineering,dc=example,dc=internal",type:"ldap",status:"enabled",roles:["guest","r1"],groups:["g1"],time:"今天 14:26"},
    {id:"zhangmin",name:"张敏",type:"ldap",status:"enabled",roles:["guest","r3"],groups:["g2"],time:"今天 13:08"},
    {id:"chenyu",name:"陈宇",type:"ldap",status:"disabled",roles:["guest"],groups:["g2"],time:"昨天 18:42"},

  ],
  audits:[
    {time:"2026-11-17 14:28:12",who:"superadmin",type:"批量授予角色",level:"高",target:"liwei、visitor-qa",result:"部分成功",batch:"batch-demo-01",items:[["liwei","成功","已授予云帆生产诊断"],["visitor-qa","失败","本地访客只能关联预置访客角色"]]},
    {time:"2026-11-17 14:28:12",who:"superadmin",type:"授予角色",level:"高",target:"visitor-qa",result:"失败",batch:"batch-demo-01",reason:"本地访客只能关联预置访客角色"},

    {time:"2026-11-17 14:26:10",who:"liwei",type:"登录成功",level:"低",target:"liwei",result:"成功"},
    {time:"2026-11-17 14:12:24",who:"LDAP 状态检查",type:"目录停用撤权",level:"高",target:"chenyu",result:"成功"},
    {time:"2026-11-17 11:54:09",who:"zhangmin",type:"登录失败",level:"低",target:"zhangmin",result:"失败",reason:"目录认证未通过"},
    {time:"2026-11-17 10:18:34",who:"superadmin",type:"创建系统管理员",level:"高",target:"ops.liu",result:"成功"},
    {time:"2026-11-17 09:45:01",who:"服务器恢复脚本",type:"重置超级管理员密码",level:"高",target:"superadmin",result:"成功"}
  ]
};
const auditClock = new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
const auditTime = at => auditClock.format(at).replace(/\s/g,"");
const auditDay = 86_400_000;
const auditLevels = ["低","中","高"];
const auditPageSizes = [20,50,100];
const maxAuditDays = 106_751_991_167_300;
const sampleAuditBase = Date.parse("2026-11-17T14:28:12+08:00");
const sampleAuditNow = Date.now();
for(const event of state.audits){
 event.at=sampleAuditNow+Date.parse(event.time.replace(" ","T")+"+08:00")-sampleAuditBase;
}
const oldestSample = state.audits.at(-1).at;
for (let index=1;index<=68;index++) state.audits.push({
 at:oldestSample-index*60_000,who:"superadmin",type:"维护资源目录",level:"中",target:"测试环境 "+index,result:"成功"
});
const withinRetention = event => state.retention[event.level]>0 && event.at>Date.now()-state.retention[event.level]*auditDay;

const ldapAdmin = u => u?.type==="ldap" && u.roles.includes(systemAdminRole);
const ldapActor = () => state.actor==="ldap" ? user("liwei") : undefined;
const admin = () => {
 const employee=ldapActor();
 return ["super","admin"].includes(state.actor) ||
  Boolean(ldapAdmin(employee) && employee.status==="enabled" && !employee.reloginRequired);
};
const canManageLDAP = u => admin() && u.type==="ldap" && (state.actor==="super" || !ldapAdmin(u));

const types = {super:"超级管理员",admin:"系统管理员",ldap:"LDAP 员工",guest:"本地访客"};

// 风险保留天数为 0 时，演示写入入口直接跳过该类记录。
function audit(type,target,level="中",items){
 if(state.retention[level]===0)return;
 const at=Date.now(),who=({super:"superadmin",admin:"ops.liu",ldap:"liwei",guest:"visitor-qa",temporary:"visitor-demo"})[state.actor];
 const result=items?.some(item=>item[1]==="失败")?(items.some(item=>item[1]==="成功")?"部分成功":"失败"):"成功";
 const batch=items?.length?"batch-demo-"+at+"-"+state.audits.length:"";
 const children=items?.map(([id,outcome,reason])=>({at,who,type,level,target:id,result:outcome,reason:outcome==="失败"?reason:"",batch}))??[];
 state.audits.unshift({at,who,type,level,target,result,items,batch},...children);

 return '<div class="scroll'+scroll+'"'+region+'><table class="table"><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join("")+'</tr></thead><tbody>'+(rows.join("")||'<tr><td colspan="'+headers.length+'">'+empty+'</td></tr>')+'</tbody></table></div>';
}

 const employee=ldapActor();

 if(ending?!canDeleteUser(u):reset?u.type!=="guest":u.type!=="guest"&&!canManageLDAP(u))return;

 d.innerHTML='<div class="audit-detail"><header><h2 id="dialog-title" tabindex="-1">'+esc(a.type)+'</h2><div class="row">'+riskBadge(a.level)+outcomeBadge(a.result)+'</div></header>'+

// 保存后按新策略清理，审计写入入口独立执行高风险保留规则。
function saveAuditRetention(days){

 state.retention=days;
 state.audits=state.audits.filter(withinRetention);
 state.auditPage=0;
 audit("修改审计保留策略",auditLevels.map(level=>level+"风险 "+retentionDays(days[level])).join(" / "),"高");

}

// 正数改为零会清理现有记录，须在独立步骤确认。
function editAuditRetention(trigger,draft=state.retention){
 if(state.actor!=="super"||state.auditAccess)return;
 auditDialogTrigger=trigger;
 const fields='<p>按记录发生时间计算。保存会清理超过新期限的记录。填 0 表示不保留。</p>'+
  '<div class="audit-retention-grid">'+auditLevels.map(level=>'<label class="field">'+level+'风险（天）<input name="'+level+'" value="'+draft[level]+'" type="number" min="0" max="'+maxAuditDays+'" step="1" required></label>').join("")+'</div>';
 modal("编辑保留策略",fields,"保存保留策略",data=>{
  const values=auditLevels.map(level=>String(data.get(level)??"").trim());
  const days=Object.fromEntries(auditLevels.map((level,i)=>[level,Number(values[i])]));
  if(values.some(value=>!value)||Object.values(days).some(day=>!Number.isSafeInteger(day)||day<0||day>maxAuditDays))return;
  const purged=auditLevels.filter(level=>state.retention[level]>0&&days[level]===0);
  if(purged.length){
   modal("确认不保留审计记录",'<p>保存后立即清除'+esc(purged.map(level=>level+"风险").join("、"))+
    '的所有现有记录，后续也不再保存这些记录。</p>',"确认保存并清理",()=>saveAuditRetention(days));
   const cancel=$("#dialog footer button[type=button]");
   cancel.removeAttribute("data-action");
   cancel.addEventListener("click",()=>editAuditRetention(trigger,days),{once:true});
   cancel.focus();
   return;
  }
  saveAuditRetention(days);
 });
}
document.addEventListener("click",event=>{
 const b=event.target.closest("[data-action]");if(!b)return;

 switch(a){

 case "detail":state.detail=v;state.tab="effective";render();break;
 case "user-tab":state.tab=v;render();break;
 case "permission-tab":state.permissionTab=v;render();break;
 case "clear":state.checked.clear();render();break;
 case "close":close();break;
 case "assign":showAssign(v==="batch"?[...state.checked]:[v],v==="batch");break;
 case "ldap-login":{
  const employee=ldapActor();
  if(employee?.reloginRequired&&employee.status==="enabled"){
   employee.reloginRequired=false;
   if(!employee.roles.length&&!employee.groups.some(id=>group(id)?.roles.length))employee.roles=["guest"];
   navigate(admin()?"users":"diagnosis");

 case "audit-retention-edit":editAuditRetention(b);break;
 case "audit-batch":case "audit-clear-batch":
  if(!admin()||state.auditAccess)break;
  state.auditFilter={q:"",type:"",level:"",batch:a==="audit-batch"?v:""};

 case "audit-page":
  if(!admin()||state.auditAccess)break;

  state.auditAccess="";$("#actor").value=state.actor;
  navigate(admin()?"audit":"diagnosis");break;
 case "add-scope":{
  const env=$("#scope-env").value,cl=$("#scope-cluster").value,biz=$("#scope-biz").value,ns=$("#scope-ns").value;

 case "test-ldap":{
  const cfg=state.ldapDraft||state.ldap;
  const employee=state.ldapTest;
  if(!employee.account.trim()||!employee.password){employee.message="请输入有效的 LDAP 测试员工账号和密码。";render();break;}
  const failure=!/^ldaps?:\/\//i.test(cfg.address)||(/^ldap:\/\//i.test(cfg.address)&&!cfg.allowPlain)?[0,"请核对 URL。使用 ldap:// 需允许明文 LDAP。"]:
   !cfg.bind.trim()?ldapFailures.bind:!cfg.base.trim()?ldapFailures.search:v==="fail"?ldapFailures[employee.failure]:null;
  const failed=failure?.[0]??-1;
  state.tested=!failure;state.ldapSteps=ldapStages.map((_,i)=>!failure||i<failed?"通过":i===failed?"失败":"待验证");
  employee.message=failure?.[1]??"四项验证全部通过，可以保存。";
  clearTimeout(ldapTimer);
  if(!failure){
   employee.account=employee.password="";
   ldapTimer=setTimeout(()=>{state.tested=false;state.ldapSteps=[];employee.message="验证已失效，请重新测试。";if(state.page==="ldap")render();},300000);
  }
  render();break;
 }
 case "save-ldap":
  if(state.tested){const draft={...(state.ldapDraft||state.ldap)};draft.passwordConfigured=Boolean(draft.bindPassword||draft.passwordConfigured);delete draft.bindPassword;state.ldap=draft;state.ldapDraft=null;state.ldapDirty=false;state.tested=false;state.ldapSteps=[];clearTimeout(ldapTimer);audit("启用 LDAP 配置","LDAP","高");render();$("#ldap-save-hint").textContent="已保存并启用 LDAP 配置。";}break;
 }
});
